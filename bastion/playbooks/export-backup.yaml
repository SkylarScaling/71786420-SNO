---
# Periodic/on-demand backup-data egress out of a fully disconnected cluster — there is
# no always-on path from the cluster to the internet, so this is a separate,
# re-runnable playbook (same pattern as mirror-refresh.yaml being separate from
# provision-sno-baremetal.yaml (or provision-sno-aws.yaml)), not something wired into full-bastion-setup.yaml. Schedule it
# however fits the environment (cron on the bastion, etc).
# See roles/ocp/configure_mcg_backup_export/README.md for the full design rationale —
# the cluster has no internet route, so data always stages on the bastion first, then
# one of three paths out, selected by backup_egress_mode: 'media' (manual removable-
# media handoff from the bastion, default), 'internal' (push straight to an on-prem
# backup target already on the same disconnected network — no internet needed), or
# 'network'/'both' (package the staged data for staging — the only host with real
# internet in this split — reversing the inbound mirroring pipeline; unlikely to
# apply on a truly disconnected production deployment).
- name: Export application S3 data from the bastion
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [configure_backup_export]
  tasks:
    - include_role:
        name: export_backup_from_noobaa

    - name: Push staged backup data to the internal on-prem backup target
      include_role:
        name: push_backup_to_internal_target
      when: backup_egress_mode == 'internal'

    - name: Package staged backup data for the trip back to staging
      include_role:
        name: package_staging_bundle
      when: backup_egress_mode in ['network', 'both']
