---
- name: Fail fast if required network details are missing
  fail:
    msg: >
      rendezvous_ip, sno_mac_address, dns_server and default_gateway must be set
      (see staging/inventory/inventory.yaml) before an agent ISO can be generated.
  when: rendezvous_ip is not defined or sno_mac_address is not defined

- name: Fail fast if dual_switch topology is selected without both NICs defined
  fail:
    msg: >
      sno_network_topology is dual_switch but sno_interface_name_secondary and/or
      sno_mac_address_secondary are not set (see staging/inventory/inventory.yaml) — both NICs are
      required to render a bonded nmstate config.
  when:
    - sno_network_topology == 'dual_switch'
    - sno_interface_name_secondary is not defined or sno_mac_address_secondary is not defined

- name: Generate install-config.yaml for bare-metal SNO
  include_role:
    name: generate_install_config

- name: Render agent-config.yaml
  template:
    src: agent-config.yaml.j2
    dest: "{{ install_dir }}/agent-config.yaml"
    mode: '0600'

# openshift-install consumes (deletes) install-config.yaml/agent-config.yaml as part
# of generating the ISO — "Consuming Install Config"/"Consuming Agent Config" — so on
# any re-run they're guaranteed to be freshly re-templated by the tasks above
# regardless of whether anything actually changed, making a content/mtime-based skip
# on those inputs meaningless. The ISO's own existence is the only reliable
# idempotency signal: without this check, re-running provision-sno.yaml after a later
# failure (e.g. the BMC boot step, a known first-run failure point) would
# unconditionally regenerate the ISO every time. To force a genuine regeneration
# (network/BMC details actually changed), delete {{ install_dir }}/agent.x86_64.iso
# (or the whole install_dir) before re-running.
- name: Check whether an agent ISO has already been generated
  stat:
    path: "{{ install_dir }}/agent.x86_64.iso"
  register: _agent_iso_stat

- name: Generate agent ISO image
  command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install --dir={{ install_dir }} agent create image"
  when: not _agent_iso_stat.stat.exists

- name: Report ISO location
  debug:
    msg: >
      Boot ISO ready at {{ install_dir }}/agent.x86_64.iso — copy it to the bastion's
      {{ iso_serve_dir | default('/var/www/html/sno-iso') }} (see configure_bastion_services)
      and mount it via BMC virtual media to begin installation.
