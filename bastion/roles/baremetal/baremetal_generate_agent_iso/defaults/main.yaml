---
sno_hostname: sno-master-0
sno_interface_name: eno1
sno_prefix_length: 24

# Unset by default — rendered as agent-config.yaml's rootDeviceHints.deviceName only
# when set (see templates/agent-config.yaml.j2). Pin this to the real target device
# (e.g. /dev/nvme0n1) on multi-disk hardware so the Agent-Based Installer doesn't have
# to guess which disk to install RHCOS onto; confirmed live as a real gap on the
# target R7725 hardware, which has more than one NVMe drive. Leave unset only for
# genuinely single-disk hardware where there's no ambiguity to begin with.
sno_root_device: ""

# single_switch (default): one NIC, no bonding — matches the current production
# topology. dual_switch: bonds sno_interface_name (primary) and
# sno_interface_name_secondary across two ToR switches for switch-level redundancy —
# see README for the NIC-count prerequisite and why this is SNO-node-only (the
# bastion side of dual-switch is a manual/physical concern, not automated here).
sno_network_topology: single_switch
sno_bond_name: bond0
sno_bond_mode: active-backup
