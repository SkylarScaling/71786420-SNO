---
# Runs on the bastion (hosts: localhost), after export_backup_from_noobaa (and
# optionally push_backup_to_internal_target). The reverse of package_bastion_bundle:
# packages the staged backup export data for the trip back to staging, which is the
# only side of this split with real internet access to push it on to an external S3
# target. Replaces the old sync_backup_to_staging role's rsync-with-cross-host-polling
# dance — same simplification as package_bastion_bundle, since each side now only
# ever pushes outward from itself.
- name: Ensure the bundle export directory exists
  file:
    path: "{{ staging_bundle_export_dir }}"
    state: directory
    mode: '0755'

- name: Archive the staged backup export data into one tar.gz
  archive:
    path: "{{ backup_sync_source_dir }}"
    dest: "{{ staging_bundle_export_dir }}/{{ staging_bundle_name }}"
    format: gz

- name: Report the media-transfer next step
  debug:
    msg: >
      Backup bundle packaged to {{ staging_bundle_export_dir }}/{{ staging_bundle_name }}.
      Copy it to removable media, carry it to staging, and extract it where
      unpack_staging_backup_bundle expects it, then run
      staging/playbooks/receive-backup.yaml there.
  when: staging_transfer_method == 'media'

- name: Stage the SSH private key here for the rsync push to staging
  copy:
    src: "{{ staging_transfer_ssh_key }}"
    dest: "/tmp/.staging_bundle_transfer_key"
    mode: '0600'
  when: staging_transfer_method == 'rsync'

- name: Fail fast if rsync transfer was requested without a target host
  fail:
    msg: "staging_transfer_method is 'rsync' but staging_transfer_host is unset."
  when:
    - staging_transfer_method == 'rsync'
    - not staging_transfer_host

- name: Rsync the backup bundle to staging
  command: >
    rsync -a
    --rsh="ssh -i /tmp/.staging_bundle_transfer_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    {{ staging_bundle_export_dir }}/{{ staging_bundle_name }}
    {{ staging_transfer_user }}@{{ staging_transfer_host }}:{{ staging_transfer_dest_dir }}/
  when: staging_transfer_method == 'rsync'

- name: Remove the staged relay key
  file:
    path: "/tmp/.staging_bundle_transfer_key"
    state: absent
  when: staging_transfer_method == 'rsync'

- name: Report the rsync-transfer next step
  debug:
    msg: >
      Backup bundle pushed to {{ staging_transfer_user }}@{{ staging_transfer_host }}:
      {{ staging_transfer_dest_dir }}/{{ staging_bundle_name }}. Extract it where
      unpack_staging_backup_bundle expects it, then run
      staging/playbooks/receive-backup.yaml.
  when: staging_transfer_method == 'rsync'
