---
# Runs on the bastion (the disconnected target) — installs a standalone Quay via
# mirror-registry, then pushes the synced archive into it ("disk to mirror"). This
# becomes the registry that install-config.yaml's imageContentSources points at.

# mirror_registry_quay_hostname isn't provisioned by this automation at all — it's a
# customer DNS record (docs/bare-metal-architecture.md §9) that has to exist before
# any of this role can work. Without this check, a missing record isn't discovered
# until well into the run: mirror-registry install (several minutes), then podman
# login, then oc-mirror's push all fail on it independently, each with a generic
# "Temporary failure in name resolution"/"Name or service not found" that gives no
# hint it's a DNS gap rather than something this role actually got wrong.
#
# Originally checked with `getent hosts` (NSS-based, the same resolution path
# dnf/podman/oc-mirror all use) rather than a module that implies network
# reachability. Switched to `dig +short` after a real customer run: the customer
# deleted the DNS record to test this exact failure path, but a stale
# /etc/hosts entry (NSS checks files before dns by default) made `getent` keep
# reporting success — this check exists specifically to validate the *DNS record*
# the customer owns, so it needs to bypass /etc/hosts and any local resolver cache
# rather than reflect whatever this one host happens to have cached/hardcoded. `dig`
# talks to the nameserver(s) in /etc/resolv.conf directly, skipping NSS/files
# entirely — requires bind-utils, mirrored as part of bastion_packages since the
# bastion has no internet route to install it directly (see
# staging/roles/common/stage_mirror_content's defaults).
- name: Check whether the mirror registry hostname resolves in DNS (bypasses /etc/hosts and NSS so a stale local override can't mask a real DNS gap)
  command: "dig +short +time=5 +tries=1 {{ mirror_registry_quay_hostname }}"
  register: _mirror_registry_hostname_resolved
  changed_when: false
  failed_when: false

- name: Fail fast with guidance if the mirror registry hostname doesn't resolve in DNS
  fail:
    msg: >-
      {{ mirror_registry_quay_hostname }} does not resolve in DNS (checked directly
      against this host's configured nameserver via `dig`, bypassing /etc/hosts and
      any local resolver cache — see tasks/main.yaml's comment for why). This is a
      customer DNS record (mirror.<base_domain> -> the bastion's own IP), not
      something this automation creates — see docs/bare-metal-architecture.md §9 for
      the full DNS record list, and confirm the bastion is actually pointed at the
      customer's DNS server before re-running. If this host has a stale
      /etc/hosts entry for this hostname, remove it too — it won't affect this
      check, but will still affect every other tool (podman, dnf, oc-mirror) that
      resolves through NSS.
  when: >-
    _mirror_registry_hostname_resolved.rc != 0 or
    (_mirror_registry_hostname_resolved.stdout | trim | length == 0)

# Confirmed root cause of a real customer failure (the "disk to mirror" push dying
# partway through with "500 Internal Server Error" from the registry's bearer-token
# endpoint — see this role's README): /var was at 100% utilization, not a memory/CPU
# constraint as first suspected. Podman's default storage root (/var/lib/containers)
# backs both mirror-registry's own Quay/Postgres/Redis containers and the local
# staging podman/oc-mirror does for every blob it copies — filling it up breaks
# container storage in ways that surface as a registry-side 500, not an obvious
# "disk full" error. Checked up front so a future run fails in seconds instead of
# ~20+ minutes into the push. bastion_min_free_disk_gb is a rough placeholder, not a
# value confirmed against real mirrored-content sizes on this customer's
# environment — tune it once a real run's actual /var usage is known.
- name: Check available disk space on /var (backs podman's default container storage)
  command: df -BG --output=avail /var
  register: _var_disk_free
  changed_when: false

- name: Fail fast if /var doesn't have enough free space for mirror-registry/oc-mirror
  vars:
    _var_free_gb: "{{ _var_disk_free.stdout_lines[-1] | trim | regex_replace('G$', '') | int }}"
  fail:
    msg: >-
      /var has only {{ _var_free_gb }}GB free, below the {{ bastion_min_free_disk_gb }}GB
      this role expects. Podman's default storage root (/var/lib/containers) backs
      both mirror-registry's own containers and every blob oc-mirror copies during
      the "disk to mirror" push — confirmed on a real run: /var filling to 100% broke
      container storage mid-push, surfacing as a registry "500 Internal Server Error"
      rather than an obvious disk-full error. Free up space (or grow the volume
      backing /var) before re-running.
  when: (_var_disk_free.stdout_lines[-1] | trim | regex_replace('G$', '') | int) < bastion_min_free_disk_gb

# Same long-quiet-stdout risk as stage_mirror_content's "mirror to disk" run applies
# here to the "disk to mirror" push and the mirror-registry install itself — see the
# comment there for the full rationale. Paired with the client-side
# ServerAliveInterval/ControlPersist in playbooks/ansible.cfg.
- name: Harden sshd keepalives against long-running oc-mirror/mirror-registry sessions dropping
  block:
    - name: Configure sshd ClientAliveInterval/ClientAliveCountMax
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\b"
        line: "{{ item.key }} {{ item.value }}"
      loop:
        - { key: ClientAliveInterval, value: 60 }
        - { key: ClientAliveCountMax, value: 30 }
      register: sshd_keepalive_config

    - name: Restart sshd to apply keepalive settings
      service:
        name: sshd
        state: restarted
      when: sshd_keepalive_config.changed
  become: true

# lookup('env', 'USER') rather than the ansible_user_id fact — this repo's roles
# never otherwise rely on gather_facts having run, and a fact lookup here is fragile
# against a mid-playbook resume (--start-at-task, or --tags narrower than this play's
# own) skipping the implicit "Gathering Facts" step ahead of this task (confirmed
# live in staging/playbooks/stage-and-package.yaml — see its comment). The env lookup
# is evaluated on the controller at template time regardless, and is safe here since
# every play in this repo runs connection: local (controller == target).
- name: Ensure the install directory exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_registry_install_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

# Unarchived from the tarball package_bastion_bundle/unpack_bastion_bundle already synced here, not
# downloaded — this host has no internet route at all. Idempotent
# (unarchive skips re-extracting an unchanged source), so safe to run every time
# rather than gating it on an install-state check.
- name: Extract the mirror-registry installer from the synced tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/mirror-registry.tar.gz"
    dest: "{{ mirror_registry_install_dir }}"
    remote_src: true
    mode: '0755'

# mirror-registry 2.0.x has no `status`/`start` subcommand at all (only
# install/uninstall/upgrade — confirmed via `mirror-registry --help` against a real
# run) — a previous version of this task tried to distinguish "never installed" from
# "installed but stopped" using commands that don't exist in this version and would
# either always report "not installed" (status) or fail outright (start). `install`
# itself is idempotent: it detects an existing ~/quay-install/quay-config/config.yaml,
# preserves its secrets, and reconciles/restarts the containers — confirmed directly
# against a real bastion — so it's simplest and most correct to just always run it,
# first-install or re-run alike, rather than try to pre-detect state with commands
# this version doesn't support.
#
# --quayPort is NOT a valid flag here either (confirmed: "Error: unknown flag:
# --quayPort" — and the tool still exits 0 on that error, so a bad flag wouldn't even
# fail this task loudly). The port must be embedded directly in --quayHostname as
# host:port; --quayHostname's own default is literally "<targetHostname>:8443".
#
# Without --sslCert/--sslKey, `install` auto-generates a brand NEW self-signed
# rootCA/cert/key pair on every single invocation — confirmed directly: a second,
# otherwise fully idempotent reconcile run still showed "changed" for "Create root CA
# key"/"Create root CA pem"/"Create ssl key". Across a single playbook run this is
# harmless (the CA is fetched fresh after install, below), but across SEPARATE runs
# (e.g. re-running mirror-content.yaml to refresh content on an already-installed
# cluster) it would silently invalidate the CA that cluster's install-config.yaml
# additionalTrustBundle already baked in, breaking its ability to pull from this
# registry. Pin the cert stable by feeding back the first run's own generated
# cert/key on every run after that, via --sslCert/--sslKey (both required together;
# only passed once a previous run's copy exists to point at).
- name: Check for a previously persisted TLS cert/key pair
  stat:
    path: "{{ mirror_registry_install_dir }}/.ssl.cert"
  register: mirror_registry_saved_cert

# mirror-registry's `install` always connects over SSH to do the actual work, even
# when installing onto the box it's invoked from — confirmed against a real run:
# it failed outright with "could not find ssh key at default location" rather than
# generating one itself. Generate the key pair it expects (idempotent via `creates:`)
# and trust it against this same user's own authorized_keys, since mirror-registry is
# connecting back to itself as the user running this task.
- name: Check whether the mirror-registry SSH key pair already exists
  stat:
    path: "{{ mirror_registry_ssh_key }}"
  register: mirror_registry_ssh_key_stat

- name: Generate the SSH key pair mirror-registry needs for its own localhost install connection
  command: "ssh-keygen -t ed25519 -f {{ mirror_registry_ssh_key }} -N ''"
  args:
    creates: "{{ mirror_registry_ssh_key }}"
  when: not mirror_registry_ssh_key_stat.stat.exists

- name: Trust the mirror-registry installer's own key for its localhost SSH connection
  ansible.posix.authorized_key:
    user: "{{ lookup('env', 'USER') }}"
    key: "{{ lookup('file', mirror_registry_ssh_key + '.pub') }}"

- name: Install (or idempotently reconcile) the mirror registry on the bastion
  command: >
    {{ mirror_registry_install_dir }}/mirror-registry install
    --quayHostname {{ mirror_registry_quay_hostname }}:{{ mirror_registry_quay_port }}
    --ssh-key {{ mirror_registry_ssh_key }}
    {{ ('--sslCert ' + mirror_registry_install_dir + '/.ssl.cert --sslKey ' + mirror_registry_install_dir + '/.ssl.key') if mirror_registry_saved_cert.stat.exists else '' }}
  register: mirror_registry_install

# mirror-registry exits 0 even when it did nothing at all (confirmed: an unrecognized
# flag just prints usage and returns 0) — rc can't be trusted to detect failure here,
# so check for its own expected output artifact directly instead of waiting on the
# "Wait for the mirror registry to be healthy" task below to eventually time out with
# an opaque "Connection refused" ten minutes later.
- name: Verify the install actually produced a config.yaml
  stat:
    path: "~/quay-install/quay-config/config.yaml"
  register: mirror_registry_config_stat

- name: Fail clearly if mirror-registry install silently did nothing
  fail:
    msg: >-
      mirror-registry install did not produce ~/quay-install/quay-config/config.yaml
      despite exiting 0 — it silently no-ops on bad arguments rather than failing.
      Full output: {{ mirror_registry_install.stdout }} {{ mirror_registry_install.stderr }}
  when: not mirror_registry_config_stat.stat.exists

# Captures this (first) run's auto-generated cert/key so every subsequent run can
# pin to it via --sslCert/--sslKey above instead of silently regenerating a new one.
- name: Persist the generated TLS cert/key pair for future reconcile runs
  copy:
    src: "~/quay-install/quay-config/{{ item.src }}"
    dest: "{{ mirror_registry_install_dir }}/{{ item.dest }}"
    remote_src: true
    mode: '0600'
  loop:
    - { src: ssl.cert, dest: .ssl.cert }
    - { src: ssl.key, dest: .ssl.key }
  when: not mirror_registry_saved_cert.stat.exists

# `install` prints the generated `init` user's credentials to its own stdout on
# EVERY run (`... Quay is available at https://host:port with credentials
# (init, <password>)`) — but confirmed directly against two consecutive real runs,
# that printed password is only REAL the very first time the init user is actually
# created. On every idempotent reconcile run after that, this line still prints a
# freshly fabricated, inapplicable random password — even though the "Create init
# user" task itself reports "Init user already exists, skipping creation" and the
# account's actual password never changes. Trusting stdout on every run (an earlier
# version of this task did) intermittently logs in with the wrong password and fails
# "disk to mirror" with "UNAUTHORIZED". The only fix is to capture the real
# credentials once, on first creation, and persist them for every run after that
# rather than re-deriving from stdout each time.
- name: Check for previously saved init user credentials
  stat:
    path: "{{ mirror_registry_install_dir }}/.init-credentials"
  register: mirror_registry_saved_creds

- name: Extract the generated init user credentials from the install output (first install only — see above)
  set_fact:
    _mirror_registry_init_creds: "{{ mirror_registry_install.stdout | regex_search('credentials \\((\\w+), (\\S+)\\)', '\\1', '\\2') }}"
  no_log: true
  when: not mirror_registry_saved_creds.stat.exists

- name: Fail clearly if init user credentials couldn't be parsed from a first-time install
  fail:
    msg: "Could not find generated init user credentials in mirror-registry's first-install output — needed to log in before the 'disk to mirror' push."
  when:
    - not mirror_registry_saved_creds.stat.exists
    - _mirror_registry_init_creds is none or (_mirror_registry_init_creds | length) < 2

- name: Persist the init user credentials for future reconcile runs (stdout is only trustworthy this once)
  copy:
    content: "{{ _mirror_registry_init_creds[0] }}:{{ _mirror_registry_init_creds[1] }}"
    dest: "{{ mirror_registry_install_dir }}/.init-credentials"
    mode: '0600'
  when: not mirror_registry_saved_creds.stat.exists
  no_log: true

- name: Read the persisted init user credentials
  slurp:
    src: "{{ mirror_registry_install_dir }}/.init-credentials"
  register: _mirror_registry_creds_raw
  no_log: true

# slurp returns base64("user:pass") from the .init-credentials file (saved as plain
# "user:pass" above) — exactly the format the pull secret's "auth" field needs, so no
# re-encoding is required. generate_install_config merges this into pullSecret;
# without it, openshift-install's own "Mirror registry ... is not found in
# pullSecret" warning is fatal in practice (confirmed against a real run): nothing on
# the node — kubelet, crio, machine-config-daemon-pull — can authenticate to pull
# release/operator images from here, which silently manifests as bootstrapping timing
# out after 45 minutes rather than a clear auth error.
- name: Expose the mirror registry's pull-secret auth entry to the later generate_install_config role
  set_fact:
    mirror_registry_auth_b64: "{{ _mirror_registry_creds_raw.content }}"
  no_log: true

# Fetched and trusted here, before the login below, not after the "wait for healthy"
# check further down — podman login talks HTTPS to this same self-signed registry, so
# the bastion's OS trust store needs the CA *before* that call, not just before the
# later oc-mirror "disk to mirror" push. Confirmed against a real run: login failed
# with "x509: certificate signed by unknown authority" when this trust step ran after
# login instead of before it. The root CA file itself only depends on the install
# above having completed, not on anything happening later (firewalld/health-check), so
# moving it earlier is safe.
- name: Fetch the mirror registry's generated root CA (needed for additionalTrustBundle)
  slurp:
    src: "~/quay-install/quay-rootCA/rootCA.pem"
  register: mirror_root_ca

- name: Expose the root CA to the later generate_install_config role
  set_fact:
    mirror_registry_ca_cert: "{{ mirror_root_ca['content'] | b64decode }}"

- name: Trust the mirror registry's root CA on the bastion itself (podman login/push talk HTTPS from here)
  copy:
    content: "{{ mirror_root_ca['content'] | b64decode }}"
    dest: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
    mode: '0644'
  become: true
  register: mirror_registry_ca_trusted

- name: Update the bastion's CA trust store
  command: update-ca-trust
  become: true
  when: mirror_registry_ca_trusted is changed

- name: Log in to the mirror registry as the init user (needed for the "disk to mirror" push below)
  vars:
    _mirror_registry_creds: "{{ (_mirror_registry_creds_raw.content | b64decode).split(':', 1) }}"
  command: >
    podman login -u {{ _mirror_registry_creds[0] }} -p {{ _mirror_registry_creds[1] }}
    {{ mirror_registry_quay_hostname }}:{{ mirror_registry_quay_port }}

# mirror-registry has no --quayConfig install flag (it's silently ignored and can
# leave the CA cert unwritten) — patch the generated config.yaml directly instead.
# PUSH_TEMP_TAG_EXPIRATION_SEC (default 300s) controls how long an in-progress blob
# upload session is kept alive; the default is too short for the large OCP release
# blobs this role's "disk to mirror" push writes.
- name: Extend Quay's upload session timeout in the generated config
  lineinfile:
    path: "~/quay-install/quay-config/config.yaml"
    regexp: "^PUSH_TEMP_TAG_EXPIRATION_SEC:"
    line: "PUSH_TEMP_TAG_EXPIRATION_SEC: {{ mirror_registry_push_timeout }}"
    insertafter: EOF
  when: mirror_registry_install is changed

- name: Find the running Quay app container name (varies by mirror-registry version)
  shell: |
    podman ps --format json | python3 -c "
    import sys, json
    for c in json.load(sys.stdin):
        name = (c.get('Names') or [''])[0]
        nl = name.lower()
        if 'quay' in nl and 'postgres' not in nl and 'redis' not in nl:
            print(name)
            break
    "
  register: quay_container_name
  changed_when: false
  failed_when: quay_container_name.stdout | trim == ""
  when: mirror_registry_install is changed

- name: Restart the Quay container to apply the extended upload timeout
  command: "podman restart {{ quay_container_name.stdout | trim }}"
  when: mirror_registry_install is changed

- name: Open the mirror registry port in firewalld (on by default on RHEL; Podman doesn't do this itself)
  block:
    - name: Check whether firewalld is installed
      command: which firewall-cmd
      register: firewalld_available
      changed_when: false
      failed_when: false

    - name: Add the firewalld rule for the mirror registry port
      command: "firewall-cmd --add-port={{ mirror_registry_quay_port }}/tcp --permanent"
      register: firewalld_rule
      changed_when: "'already' not in firewalld_rule.stdout"
      failed_when: firewalld_rule.rc != 0 and 'NOT_RUNNING' not in firewalld_rule.stderr
      when: firewalld_available.rc == 0

    - name: Reload firewalld to apply the rule
      command: firewall-cmd --reload
      when: firewalld_available.rc == 0 and firewalld_rule is changed
  become: true

- name: Wait for the mirror registry to be healthy
  uri:
    url: "https://{{ mirror_registry_quay_hostname }}:{{ mirror_registry_quay_port }}/health/instance"
    validate_certs: false
    status_code: [200, 301]
    timeout: 30
  register: mirror_registry_health
  until: mirror_registry_health.status | default(0) in [200, 301]
  retries: 40
  delay: 15

- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for the oc-mirror binary
  command: "{{ bin_dir }}/oc-mirror version"
  register: oc_mirror_check
  failed_when: false
  changed_when: false

# Unarchived from the tarball package_bastion_bundle/unpack_bastion_bundle already synced here (this host
# is separate from wherever stage_mirror_content ran, and has no internet route of
# its own).
- name: Extract the oc-mirror binary from the synced tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/oc-mirror.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
  when: oc_mirror_check.rc != 0

# v2's "disk to mirror" push needs --config again (unlike v1, where --from alone was
# enough because the archive was fully self-describing) — stage_mirror_content renders
# imageset-config.yaml directly into the archive dir specifically so it travels here
# via package_bastion_bundle/unpack_bastion_bundle without a separate sync path. --cache-dir is scoped to
# this host, independent of the synced archive content.
#
# Retried (until/retries/delay), not a single attempt — confirmed against a real run:
# a ~22-minute push of 483 images (mostly already-pushed shared base layers being
# deduped via "trying to reuse blob") hit a batch of "received unexpected HTTP status:
# 500 Internal Server Error" from the mirror registry's own bearer-token endpoint,
# spread across the run rather than one clean cutoff — consistent with the registry
# (Quay+Redis+Postgres, all running as concurrent containers on the bastion itself —
# see this role's README/docs/bare-metal-architecture.md §2 for the known headroom
# risk) being intermittently overloaded under sustained concurrent push load, not a
# content/config problem. The push is safe to retry wholesale: oc-mirror/containers-image
# check for and reuse blobs that already exist at the destination before
# re-uploading, so a retry mostly re-attempts only what actually failed rather than
# redoing the whole archive.
- name: Push the synced archive into the bastion's mirror registry ("disk to mirror")
  command: >
    {{ bin_dir }}/oc-mirror --v2 --config {{ mirror_archive_dir }}/imageset-config.yaml
    --cache-dir {{ oc_mirror_cache_dir }}
    --from file://{{ mirror_archive_dir }}
    docker://{{ mirror_registry_quay_hostname }}:{{ mirror_registry_quay_port }}
  register: _mirror_disk_push
  until: _mirror_disk_push.rc == 0
  retries: 3
  delay: 30

# oc-mirror itself already points at the right file on failure ("Please review
# .../working-dir/logs/mirroring_errors_*.txt") but that guidance is buried at the
# bottom of a potentially huge stdout dump — surface the actual error lines directly
# rather than relying on the operator to find it themselves, same approach already
# applied to stage_mirror_content's "mirror to disk" failure handling.
- name: Collect likely-relevant error lines from oc-mirror's own mirroring-errors log
  shell: >
    tail -n 40 {{ mirror_archive_dir }}/working-dir/logs/mirroring_errors_*.txt 2>/dev/null
  register: _mirror_disk_push_error_lines
  changed_when: false
  failed_when: false
  when: _mirror_disk_push.rc != 0

- name: Fail with oc-mirror's own error context if the push still failed after retries
  fail:
    msg: |-
      oc-mirror "disk to mirror" push failed after {{ _mirror_disk_push.attempts | default(1) }} attempt(s) (rc={{ _mirror_disk_push.rc }}).
      Tail of {{ mirror_archive_dir }}/working-dir/logs/mirroring_errors_*.txt:
      {{ _mirror_disk_push_error_lines.stdout | default('') | trim | default('(none found — inspect that directory directly)', true) }}
      Repeated "received unexpected HTTP status: 500 Internal Server Error" from the
      registry's bearer-token endpoint, especially spread across the run rather than
      failing immediately, points at the mirror registry itself (Quay/Redis/Postgres,
      all running as concurrent containers on this bastion) being under-resourced for
      a sustained concurrent push — see this role's README and
      docs/bare-metal-architecture.md §2 for the known headroom requirement.
  when: _mirror_disk_push.rc != 0
