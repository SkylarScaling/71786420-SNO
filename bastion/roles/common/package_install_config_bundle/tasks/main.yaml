---
# AWS-only. Runs on the bastion (hosts: localhost), after generate_install_config.
# `openshift-install create cluster` has to run on staging (the internet-connected
# host — see staging/roles/aws/aws_provision_sno_ipi's README for why), but
# install-config.yaml has to be generated here, colocated with deploy_mirror_registry's
# facts. This one-file handback closes that gap. Much lighter than package_bastion_bundle
# (a single file, not a whole tree) — same media/rsync pattern, no bundle-root
# assembly step needed.
- name: Ensure the bundle export directory exists
  file:
    path: "{{ install_config_bundle_export_dir }}"
    state: directory
    mode: '0755'

# community.general.archive (not ansible.builtin — confirmed live: "couldn't resolve
# module/action 'archive'") isn't available here — the bastion only ever gets bare
# ansible-core installed offline from an RPM (bootstrap-bastion-host.sh), with no
# Galaxy collections at all, unlike staging which installs requirements.yml's
# collections normally. Using `tar` directly via command: avoids needing any
# collection here, the same way this repo already shells out to rsync/podman/dnf
# elsewhere. `-C {{ install_dir }}` makes the one archive member just
# "install-config.yaml" (not the full absolute path) — unpack_install_config_bundle
# relies on that to land the file directly in its own install_dir.
- name: Archive install-config.yaml into one tar.gz
  command: >
    tar -czf {{ install_config_bundle_export_dir }}/{{ install_config_bundle_name }}
    -C {{ install_dir }} install-config.yaml
  args:
    creates: "{{ install_config_bundle_export_dir }}/{{ install_config_bundle_name }}"

- name: Report the media-transfer next step
  debug:
    msg: >
      install-config.yaml packaged to
      {{ install_config_bundle_export_dir }}/{{ install_config_bundle_name }}. Copy it
      to staging, then run unpack_install_config_bundle there (via
      staging/playbooks/provision-sno-aws.yaml).
  when: install_config_transfer_method == 'media'

- name: Stage the SSH private key here for the rsync push to staging
  copy:
    src: "{{ install_config_transfer_ssh_key }}"
    dest: "/tmp/.install_config_transfer_key"
    mode: '0600'
    remote_src: true
  when: install_config_transfer_method == 'rsync'

- name: Fail fast if rsync transfer was requested without a target host
  fail:
    msg: "install_config_transfer_method is 'rsync' but install_config_transfer_host is unset."
  when:
    - install_config_transfer_method == 'rsync'
    - not install_config_transfer_host

- name: Rsync install-config.yaml's bundle to staging
  command: >
    rsync -a
    --rsh="ssh -i /tmp/.install_config_transfer_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    {{ install_config_bundle_export_dir }}/{{ install_config_bundle_name }}
    {{ install_config_transfer_user }}@{{ install_config_transfer_host }}:{{ install_config_transfer_dest_dir }}/
  when: install_config_transfer_method == 'rsync'

- name: Remove the staged relay key
  file:
    path: "/tmp/.install_config_transfer_key"
    state: absent
  when: install_config_transfer_method == 'rsync'

- name: Report the rsync-transfer next step
  debug:
    msg: >
      install-config.yaml's bundle pushed to
      {{ install_config_transfer_user }}@{{ install_config_transfer_host }}:
      {{ install_config_transfer_dest_dir }}/{{ install_config_bundle_name }}. Run
      unpack_install_config_bundle on staging (via
      staging/playbooks/provision-sno-aws.yaml).
  when: install_config_transfer_method == 'rsync'
