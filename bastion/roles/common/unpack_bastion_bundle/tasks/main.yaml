---
# Runs on the bastion (hosts: localhost), first thing in
# bastion/playbooks/provision-sno.yaml — lays down everything
# package_bastion_bundle assembled on staging: mirrored content, install-time
# binaries, and the flattened per-environment vars.
- name: Fail fast if the expected bundle contents aren't present
  stat:
    path: "{{ bastion_bundle_dir }}/bastion-resolved-vars.yaml"
  register: _bundle_vars_stat

- name: Fail with guidance if the bundle hasn't been extracted here yet
  fail:
    msg: >
      {{ bastion_bundle_dir }}/bastion-resolved-vars.yaml not found. Extract the
      staging-produced tar.gz (sno-bastion-bundle-*.tar.gz) into
      {{ bastion_bundle_dir }} before running this playbook — see
      package_bastion_bundle's README on the staging side.
  when: not _bundle_vars_stat.stat.exists

- name: Write the bundled resolved vars to bastion/group_vars/all.yaml
  copy:
    src: "{{ bastion_bundle_dir }}/bastion-resolved-vars.yaml"
    dest: "{{ playbook_dir }}/group_vars/all.yaml"
    remote_src: true
    mode: '0600'

# group_vars/all.yaml is only read once, when the playbook run starts — overwriting it
# above has no effect on THIS run (confirmed live: every var that only exists in the
# bundle, e.g. mirror_registry_quay_hostname, came back "undefined" in a later role,
# since this is the very first run ever to actually reach this point end-to-end).
# Explicitly loading it into the current play's vars makes every later role in this
# same run see the real values immediately, not just on the next invocation.
- name: Load the newly-written resolved vars into this run
  include_vars:
    file: "{{ playbook_dir }}/group_vars/all.yaml"

# A tens-of-GB tar.gz carried over physical media or rsync has no integrity check of
# its own — tar -xzf can partially succeed on a corrupted archive without erroring,
# so by the time bastion-resolved-vars.yaml is readable (confirming extraction at
# least ran) the content inside it may still be silently wrong. Stat-gated both ways:
# skips cleanly if the tar.gz was already deleted (e.g. a prior successful run, or
# bastion_bundle_tarball_path set to '' deliberately) or if no .sha256 file shipped
# alongside it, rather than treating either as an error — see defaults/main.yaml.
- name: Check whether the staging-produced tar.gz is still present to verify
  stat:
    path: "{{ bastion_bundle_tarball_path }}"
  register: _bastion_bundle_tarball_stat
  when: bastion_bundle_tarball_path | length > 0

- name: Check whether a checksum file was shipped alongside the tar.gz
  stat:
    path: "{{ bastion_bundle_tarball_path }}.sha256"
  register: _bastion_bundle_checksum_stat
  when: _bastion_bundle_tarball_stat.stat.exists | default(false)

# sha256sum -c itself fails loudly (non-zero rc) on a mismatch, with the mismatched
# filename in its own output — no separate fail task needed. chdir'd to the tar.gz's
# own directory since the checksum file (written by package_bastion_bundle) records
# only the bare filename, not an absolute path.
- name: Verify the tar.gz against its shipped checksum before trusting its contents
  command: "sha256sum -c {{ bastion_bundle_name }}.sha256"
  args:
    chdir: "{{ bastion_bundle_tarball_path | dirname }}"
  changed_when: false
  when: _bastion_bundle_checksum_stat.stat.exists | default(false)

- name: Ensure ~/.ssh exists for the relay key
  file:
    path: "~/.ssh"
    state: directory
    mode: '0700'

- name: Check whether the bundle shipped a relay key for the bastion's own return-trip pushes
  stat:
    path: "{{ bastion_bundle_dir }}/relay-key"
  register: _bundle_relay_key_stat

# ssh_private_key (from the resolved vars just loaded above) points at a fixed
# bastion-local path — package_staging_bundle's backup-export relay (§8) defaults its
# own transfer key to this var, so staging it here once covers that without the role
# needing to know this handoff exists.
- name: Stage the relay key at the path ssh_private_key points to
  copy:
    src: "{{ bastion_bundle_dir }}/relay-key"
    dest: "{{ ssh_private_key }}"
    remote_src: true
    mode: '0600'
  when: _bundle_relay_key_stat.stat.exists

# lookup('env', 'USER') rather than the ansible_user_id fact — see
# deploy_mirror_registry's tasks for why: this run's being this role's first task
# makes it the most exposed to a resume (--start-at-task mid-provision-sno.yaml)
# skipping the implicit "Gathering Facts" step entirely.
- name: Ensure the mirror content destination exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_archive_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

# Stat'd rather than copied unconditionally: a previous run of this same role already
# deletes these two directories out of the bundle right after copying them (see
# below) — so on any run after the first, the source is legitimately gone and that's
# fine, {{ mirror_archive_dir }} already has the real content from last time. Only a
# genuinely fresh bundle (first run, or the operator re-extracted a newer tar.gz)
# needs the copy to actually happen.
- name: Check whether the bundled mirror content is still present to copy
  stat:
    path: "{{ bastion_bundle_dir }}/mirror-content"
  register: _bundle_mirror_content_stat

# synchronize (rsync), not copy — this archive is tens of GB, and copy's per-file
# checksum comparison means every re-run re-hashes the entire tree just to find
# nothing's changed. rsync only transfers what's missing or different, so a retry
# after a partial/interrupted copy (e.g. the disk-full failure mode noted below)
# resumes cheaply instead of re-verifying everything from scratch. ansible.posix is
# already a required collection (requirements.yml) and rsync is already a direct
# dependency elsewhere in this repo (package_bastion_bundle's bastion transfer).
- name: Copy the bundled mirror content into place
  ansible.posix.synchronize:
    src: "{{ bastion_bundle_dir }}/mirror-content/"
    dest: "{{ mirror_archive_dir }}/"
    recursive: true
  when: _bundle_mirror_content_stat.stat.exists

- name: Check whether the destination already has content from a prior run
  find:
    paths: "{{ mirror_archive_dir }}"
  register: _mirror_archive_dir_listing
  when: not _bundle_mirror_content_stat.stat.exists

- name: Fail clearly if there's neither a fresh bundle copy nor a prior destination copy to fall back on
  fail:
    msg: >
      Neither {{ bastion_bundle_dir }}/mirror-content nor {{ mirror_archive_dir }}
      has any content. Re-extract a fresh staging-produced tar.gz into
      {{ bastion_bundle_dir }} before running this playbook.
  when:
    - not _bundle_mirror_content_stat.stat.exists
    - _mirror_archive_dir_listing.matched | default(0) == 0

# stage_mirror_content/package_bastion_bundle carry this because oc-mirror v2's
# archive doesn't include the actual blob content for the openshift/release repo's
# per-component synthetic tags (manifest/config/layers) — only the lightweight tag/
# revision pointer files. Without this, deploy_mirror_registry's disk-to-mirror step
# fails immediately with "manifest unknown" on the first release-component image,
# confirmed live, since a fresh --cache-dir has no other way to resolve that content.
# Merged into oc_mirror_cache_dir's own .oc-mirror cache layout (not replaced) so a
# bastion that's already run deploy_mirror_registry once keeps whatever else is
# there. Stat-gated and cleaned up after copying, same reasoning (and same disk-usage
# risk — this is tens of GB too) as mirror-content/mirror-installers below.
- name: Ensure the oc-mirror cache destination exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ oc_mirror_cache_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

- name: Check whether the bundled release-content cache handoff is still present to copy
  stat:
    path: "{{ bastion_bundle_dir }}/release-cache"
  register: _bundle_release_cache_stat

- name: Copy the release-content cache handoff into the oc-mirror cache directory
  ansible.posix.synchronize:
    src: "{{ bastion_bundle_dir }}/release-cache/"
    dest: "{{ oc_mirror_cache_dir }}/"
    recursive: true
  when: _bundle_release_cache_stat.stat.exists

- name: Ensure the installers destination exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

- name: Check whether the bundled installer tarballs/RPMs are still present to copy
  stat:
    path: "{{ bastion_bundle_dir }}/mirror-installers"
  register: _bundle_mirror_installers_stat

# synchronize, not copy — same reasoning as the mirror content copy above.
- name: Copy the bundled installer tarballs/RPMs into place
  ansible.posix.synchronize:
    src: "{{ bastion_bundle_dir }}/mirror-installers/"
    dest: "{{ mirror_installers_dir }}/"
    recursive: true
  when: _bundle_mirror_installers_stat.stat.exists

# The mirror content archive, installer tarballs/RPMs, and release-content cache
# handoff are all large (the content archive alone is tens of GB, the release-cache
# handoff tens more) and now exist twice — once just-copied into {{ mirror_archive_dir
# }}/{{ mirror_installers_dir }}/{{ oc_mirror_cache_dir }}, once still sitting in the
# extracted bundle under bastion_bundle_dir. Left alongside the original downloaded
# tar.gz (never cleaned up by anything, since that's a manual operator download step),
# this tripled the real disk footprint and filled the bastion's root volume entirely
# on a real run (confirmed live: "No space left on device" starting a later playbook
# run). Safe to remove here since nothing reads mirror-content/mirror-installers/
# release-cache out of bastion_bundle_dir again after this point —
# deploy_mirror_registry/configure_bastion_services only ever read from
# mirror_archive_dir/mirror_installers_dir/oc_mirror_cache_dir. Doesn't touch
# bastion_bundle_dir's bastion/ tree or bastion-resolved-vars.yaml, which this role
# still needs.
- name: Remove the now-redundant mirror content/installers/release-cache copy from the extracted bundle
  file:
    path: "{{ bastion_bundle_dir }}/{{ item }}"
    state: absent
  loop:
    - mirror-content
    - mirror-installers
    - release-cache

- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

# oc-mirror/mirror-registry are extracted from this same mirror_installers_dir
# directly by deploy_mirror_registry itself (unchanged behavior) — only
# openshift-install/oc are extracted here, since no other role does so for them.
- name: Extract openshift-install from the bundled tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/openshift-install-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'

- name: Extract the oc client from the bundled tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/openshift-client-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
