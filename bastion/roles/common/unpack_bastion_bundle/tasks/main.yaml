---
# Runs on the bastion (hosts: localhost), first thing in
# bastion/playbooks/provision-sno.yaml — lays down everything
# package_bastion_bundle assembled on staging: mirrored content, install-time
# binaries, and the flattened per-environment vars.
- name: Fail fast if the expected bundle contents aren't present
  stat:
    path: "{{ bastion_bundle_dir }}/bastion-resolved-vars.yaml"
  register: _bundle_vars_stat

- name: Fail with guidance if the bundle hasn't been extracted here yet
  fail:
    msg: >
      {{ bastion_bundle_dir }}/bastion-resolved-vars.yaml not found. Extract the
      staging-produced tar.gz (sno-bastion-bundle-*.tar.gz) into
      {{ bastion_bundle_dir }} before running this playbook — see
      package_bastion_bundle's README on the staging side.
  when: not _bundle_vars_stat.stat.exists

- name: Write the bundled resolved vars to bastion/group_vars/all.yaml
  copy:
    src: "{{ bastion_bundle_dir }}/bastion-resolved-vars.yaml"
    dest: "{{ playbook_dir }}/group_vars/all.yaml"
    remote_src: true
    mode: '0600'

# group_vars/all.yaml is only read once, when the playbook run starts — overwriting it
# above has no effect on THIS run (confirmed live: every var that only exists in the
# bundle, e.g. mirror_registry_quay_hostname, came back "undefined" in a later role,
# since this is the very first run ever to actually reach this point end-to-end).
# Explicitly loading it into the current play's vars makes every later role in this
# same run see the real values immediately, not just on the next invocation.
- name: Load the newly-written resolved vars into this run
  include_vars:
    file: "{{ playbook_dir }}/group_vars/all.yaml"

# lookup('env', 'USER') rather than the ansible_user_id fact — see
# deploy_mirror_registry's tasks for why: this run's being this role's first task
# makes it the most exposed to a resume (--start-at-task mid-provision-sno.yaml)
# skipping the implicit "Gathering Facts" step entirely.
- name: Ensure the mirror content destination exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_archive_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

# Stat'd rather than copied unconditionally: a previous run of this same role already
# deletes these two directories out of the bundle right after copying them (see
# below) — so on any run after the first, the source is legitimately gone and that's
# fine, {{ mirror_archive_dir }} already has the real content from last time. Only a
# genuinely fresh bundle (first run, or the operator re-extracted a newer tar.gz)
# needs the copy to actually happen.
- name: Check whether the bundled mirror content is still present to copy
  stat:
    path: "{{ bastion_bundle_dir }}/mirror-content"
  register: _bundle_mirror_content_stat

- name: Copy the bundled mirror content into place
  copy:
    src: "{{ bastion_bundle_dir }}/mirror-content/"
    dest: "{{ mirror_archive_dir }}/"
    remote_src: true
    mode: preserve
  when: _bundle_mirror_content_stat.stat.exists

- name: Check whether the destination already has content from a prior run
  find:
    paths: "{{ mirror_archive_dir }}"
  register: _mirror_archive_dir_listing
  when: not _bundle_mirror_content_stat.stat.exists

- name: Fail clearly if there's neither a fresh bundle copy nor a prior destination copy to fall back on
  fail:
    msg: >
      Neither {{ bastion_bundle_dir }}/mirror-content nor {{ mirror_archive_dir }}
      has any content. Re-extract a fresh staging-produced tar.gz into
      {{ bastion_bundle_dir }} before running this playbook.
  when:
    - not _bundle_mirror_content_stat.stat.exists
    - _mirror_archive_dir_listing.matched | default(0) == 0

- name: Ensure the installers destination exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: true

- name: Check whether the bundled installer tarballs/RPMs are still present to copy
  stat:
    path: "{{ bastion_bundle_dir }}/mirror-installers"
  register: _bundle_mirror_installers_stat

- name: Copy the bundled installer tarballs/RPMs into place
  copy:
    src: "{{ bastion_bundle_dir }}/mirror-installers/"
    dest: "{{ mirror_installers_dir }}/"
    remote_src: true
    mode: preserve
  when: _bundle_mirror_installers_stat.stat.exists

# The mirror content archive and installer tarballs/RPMs are large (the content
# archive alone is tens of GB) and now exist twice — once just-copied into {{
# mirror_archive_dir }}/{{ mirror_installers_dir }}, once still sitting in the
# extracted bundle under bastion_bundle_dir. Left alongside the original downloaded
# tar.gz (never cleaned up by anything, since that's a manual operator download step),
# this tripled the real disk footprint and filled the bastion's root volume entirely
# on a real run (confirmed live: "No space left on device" starting a later playbook
# run). Safe to remove here since nothing reads mirror-content/mirror-installers out
# of bastion_bundle_dir again after this point — deploy_mirror_registry/
# configure_bastion_services only ever read from mirror_archive_dir/
# mirror_installers_dir. Doesn't touch bastion_bundle_dir's bastion/ tree or
# bastion-resolved-vars.yaml, which this role still needs.
- name: Remove the now-redundant mirror content/installers copy from the extracted bundle
  file:
    path: "{{ bastion_bundle_dir }}/{{ item }}"
    state: absent
  loop:
    - mirror-content
    - mirror-installers

- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

# oc-mirror/mirror-registry are extracted from this same mirror_installers_dir
# directly by deploy_mirror_registry itself (unchanged behavior) — only
# openshift-install/oc are extracted here, since no other role does so for them.
- name: Extract openshift-install from the bundled tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/openshift-install-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'

- name: Extract the oc client from the bundled tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/openshift-client-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
