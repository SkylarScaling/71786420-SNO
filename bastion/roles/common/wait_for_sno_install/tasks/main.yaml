---
- name: Confirm kubeconfig was generated
  stat:
    path: "{{ sno_kubeconfig }}"
  register: kubeconfig_stat
  until: kubeconfig_stat.stat.exists
  retries: 30
  delay: 30

- name: Wait for the cluster API to come up and report a completed version
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
  register: cv_status
  # default([]) guards status.conditions not existing yet (ClusterVersion created
  # before the cluster-version-operator populates its status) — without it, piping
  # an undefined value into selectattr raises "'dict object' has no attribute
  # 'conditions'" and aborts the whole task instead of retrying.
  until: >
    cv_status.resources | length > 0
    and cv_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True')
      | list | length > 0
  retries: 40
  delay: 30
