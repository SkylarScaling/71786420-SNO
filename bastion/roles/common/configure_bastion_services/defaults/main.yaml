---
iso_serve_dir: /var/www/html/sno-iso

# Must match sync_bastion_rpms's mirror_installers_dir.
mirror_installers_dir: /opt/mirror-installers

# Must match sync_bastion_rpms's own copy — this is what dnf installs by name
# against the local repo it built.
bastion_packages:
  - dnsmasq
  - httpd
  - tmux
  # Provides `dig`, used by deploy_mirror_registry's DNS pre-flight check.
  - bind-utils
  # Provides nmstatectl, required by openshift-install agent create image.
  - nmstate

# Must match sync_bastion_rpms's own copy — the set of repoids staging synced, one
# local-only dnf repo enabled here per entry when bastion_rpm_sync_method is
# reposync (ignored for resolve, which produces a single combined repo instead).
bastion_required_repos:
  - rhel-10-for-x86_64-baseos-rpms
  - rhel-10-for-x86_64-appstream-rpms

# Must match sync_bastion_rpms's own copy — determines bastion-rpms/'s on-disk
# layout (one subdirectory per repoid for reposync, vs. a single flat repo for
# resolve). See sync_bastion_rpms's README.
bastion_rpm_sync_method: reposync
