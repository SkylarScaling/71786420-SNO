---
# Runs directly on the bastion (hosts: localhost).

# Installed from the local RPMs unpack_bastion_bundle already extracted here, not via
# the package module's online repo resolution — this host has no internet route at
# all, and a plain `package:`/`dnf install dnsmasq httpd` here fails with a RHUI
# mirrorlist timeout (confirmed against a real run).
#
# Confirmed against a real customer environment: installing by handing dnf a raw list
# of local RPM file paths (`dnf install <path1> <path2> ... --disablerepo='*'`, this
# role's original approach) isn't reliable — dnf's solver only considers exactly the
# files named on the command line, with none of the repo metadata it normally uses to
# work out a correct transaction across a larger closure. stage_mirror_content now
# runs createrepo_c against mirror_installers_dir/bastion-rpms before bundling it, so
# this directory is a real (local-only) dnf repo, not just a pile of RPM files —
# installing by package name against its actual metadata is what a repo-backed solve
# is supposed to look like, instead of working around the lack of one.
- name: Confirm the local bastion RPM repo's metadata is present
  stat:
    path: "{{ mirror_installers_dir }}/bastion-rpms/repodata"
  register: _bastion_repo_metadata

- name: Fail with guidance if the local bastion repo's metadata wasn't synced
  fail:
    msg: >
      {{ mirror_installers_dir }}/bastion-rpms/repodata not found. stage_mirror_content's
      "Generate repo metadata for the downloaded bastion RPMs" task (createrepo_c) must
      run on staging before this bundle is built — re-run stage_mirror_content with
      --tags bastion_prereqs, repackage with package_bastion_bundle, and resync.
  when: not _bastion_repo_metadata.stat.exists

- name: Add the synced bastion RPMs as a local-only dnf repo
  yum_repository:
    name: bastion-local-rpms
    description: Locally synced bastion RPM closure (stage_mirror_content)
    baseurl: "file://{{ mirror_installers_dir }}/bastion-rpms"
    gpgcheck: false
    enabled: true
  become: true

- name: Install bastion packages from the local repo
  dnf:
    name: "{{ bastion_packages }}"
    state: present
    disablerepo: '*'
    enablerepo: bastion-local-rpms
  become: true

- name: Configure DNS records for the SNO cluster (requires a known static node IP)
  template:
    src: dnsmasq-sno.conf.j2
    dest: /etc/dnsmasq.d/sno.conf
    mode: '0644'
  become: true
  notify: restart dnsmasq
  when: rendezvous_ip is defined

- name: Ensure ISO-hosting directory exists (for bare-metal BMC virtual media boot)
  file:
    path: "{{ iso_serve_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Enable and start dnsmasq
  service:
    name: dnsmasq
    state: started
    enabled: true
  become: true
  when: rendezvous_ip is defined

- name: Enable and start httpd (serves the agent ISO for BMC virtual media)
  service:
    name: httpd
    state: started
    enabled: true
  become: true
