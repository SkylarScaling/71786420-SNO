---
# Provider-agnostic — identical whether sno_kubeconfig landed here directly
# (bare metal: wait_for_sno_install) or via the AWS kubeconfig handback
# (unpack_kubeconfig_bundle). Runs as the last task of each provider's full
# day-2-configure playbook so a completed run ends with "how do I actually use this
# cluster" instead of just a PLAY RECAP.
- name: Fail fast if sno_kubeconfig doesn't exist yet
  stat:
    path: "{{ sno_kubeconfig }}"
  register: _print_connection_kubeconfig_stat

- name: Fail with guidance if the kubeconfig is missing
  fail:
    msg: >
      {{ sno_kubeconfig }} not found — this role expects to run after the cluster
      exists and its kubeconfig is in place (end of provision-sno-baremetal.yaml, or
      after unpack-cluster-access.yaml on AWS).
  when: not _print_connection_kubeconfig_stat.stat.exists

# The API server URL is embedded in the kubeconfig itself (clusters[0].cluster.server)
# — reading it here avoids hardcoding the api.<cluster>.<base_domain> pattern a
# second time, and stays correct even if that convention ever changes.
- name: Read the API server URL from the kubeconfig
  set_fact:
    _print_connection_api_server: "{{ (lookup('file', sno_kubeconfig) | from_yaml).clusters[0].cluster.server }}"

# ignore_errors here, not a hard dependency — this role may run standalone (e.g. a
# re-run just to print connection info) at a point where the console route isn't up
# for any other reason; better to print a partial summary than fail the whole task.
- name: Look up the web console Route
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: openshift-console
    name: console
  register: _print_connection_console_route
  ignore_errors: true

- name: Record the console URL (or a fallback note if the Route isn't up yet)
  set_fact:
    _print_connection_console_url: >-
      {{
        'https://' ~ _print_connection_console_route.resources[0].spec.host
        if (_print_connection_console_route is succeeded and _print_connection_console_route.resources | default([]) | length > 0)
        else '(console Route not found — check `oc get route console -n openshift-console`)'
      }}

# kubeadmin-password only ever exists on whichever host actually ran
# `openshift-install create cluster`. On bare metal that's this bastion
# (wait_for_sno_install runs here). On AWS that's staging (aws_provision_sno_ipi) —
# package_kubeconfig_bundle/unpack_kubeconfig_bundle deliberately bundle this file
# alongside sno_kubeconfig on the handback trip specifically so this role can print
# it here too (see that role's README: this is the one place in the repo this
# gitignored, normally host-local-only file is shipped off of the host that
# generated it — an acceptable tradeoff for a disposable test cluster, not a pattern
# to reuse for a production credential path). Check locally rather than assuming
# either provider's case, in case an older bundle predates this.
- name: Check whether kubeadmin-password exists on this host
  stat:
    path: "{{ install_dir }}/auth/kubeadmin-password"
  register: _print_connection_kubeadmin_stat

- name: Read kubeadmin's password
  set_fact:
    _print_connection_kubeadmin_password: "{{ lookup('file', install_dir ~ '/auth/kubeadmin-password') }}"
  when: _print_connection_kubeadmin_stat.stat.exists

- name: Report how to connect to the cluster
  debug:
    msg:
      - "=================================================================="
      - "Cluster is configured — connection info"
      - "=================================================================="
      - "API server:  {{ _print_connection_api_server }}"
      - "Web console: {{ _print_connection_console_url }}"
      - "kubeconfig:  {{ sno_kubeconfig }} (already on this host)"
      - "------------------------------------------------------------------"
      - "export KUBECONFIG={{ sno_kubeconfig }}"
      - "oc whoami --show-console"

# Prints the actual password, not just its file path — a deliberate choice for this
# repo's disposable test clusters (requested explicitly; see
# package_kubeconfig_bundle's README for the "don't reuse this for production"
# caveat). no_log is NOT set here: hiding it from Ansible's own output would defeat
# the point of printing it.
- name: Report kubeadmin's credentials (when present on this host)
  debug:
    msg:
      - "kubeadmin username: kubeadmin"
      - "kubeadmin password: {{ _print_connection_kubeadmin_password }}"
  when: _print_connection_kubeadmin_stat.stat.exists

- name: Note where to find kubeadmin's password when it isn't on this host
  debug:
    msg: >-
      kubeadmin password: not on this host — `openshift-install create cluster` ran
      on staging for this environment, and that file isn't in the bundle that landed
      here (an older bundle from before package_kubeconfig_bundle started including
      it, most likely). Retrieve it from staging's
      {{ install_dir }}/auth/kubeadmin-password if you need password (vs.
      token/cert) auth.
  when: not _print_connection_kubeadmin_stat.stat.exists

# AWS only: publish: External (see generate_install_config) makes the api load
# balancer internet-reachable directly, but aws_configure_manual_dns deliberately
# sets the default Ingress's ELB to scope: Internal (the SNO node itself has no
# internet route, so an internet-facing apps ELB would be unreachable from inside the
# cluster's own machine network) — confirmed live, the console hostname resolves
# publicly but only to an internal-*.elb.amazonaws.com with private IPs, so a laptop
# outside the VPC can't route to it directly the way it can the API. mirror-staging
# sits in the public subnet with a real route to that private ELB (same VPC), making
# it the natural SOCKS tunnel endpoint. Bare metal has no such split — the console is
# directly reachable on the customer's own LAN — so this block is AWS-only.
- name: Report the SOCKS tunnel command for reaching the console (AWS only)
  debug:
    msg:
      - "------------------------------------------------------------------"
      - "AWS only: the web console above is on a VPC-internal load balancer and"
      - "isn't reachable directly from outside the VPC. To reach it from your"
      - "local browser, open a SOCKS tunnel through mirror-staging (public subnet,"
      - "same VPC):"
      - "  ssh -D 8080 -N {{ mirror_staging_ssh_user }}@{{ mirror_staging_public_ip }}"
      - "Then point your browser at a SOCKS5 proxy on 127.0.0.1:8080 with 'Proxy DNS"
      - "when using SOCKS' enabled (the console hostname only resolves to something"
      - "routable from inside the VPC) and browse to the console URL above."
  when: infra_provider == 'aws'
