---
# Provider-agnostic — identical whether sno_kubeconfig landed here directly
# (bare metal: wait_for_sno_install) or via the AWS kubeconfig handback
# (unpack_kubeconfig_bundle). Runs as the last task of each provider's full
# day-2-configure playbook so a completed run ends with "how do I actually use this
# cluster" instead of just a PLAY RECAP.
- name: Fail fast if sno_kubeconfig doesn't exist yet
  stat:
    path: "{{ sno_kubeconfig }}"
  register: _print_connection_kubeconfig_stat

- name: Fail with guidance if the kubeconfig is missing
  fail:
    msg: >
      {{ sno_kubeconfig }} not found — this role expects to run after the cluster
      exists and its kubeconfig is in place (end of provision-sno-baremetal.yaml, or
      after unpack-cluster-access.yaml on AWS).
  when: not _print_connection_kubeconfig_stat.stat.exists

# The API server URL is embedded in the kubeconfig itself (clusters[0].cluster.server)
# — reading it here avoids hardcoding the api.<cluster>.<base_domain> pattern a
# second time, and stays correct even if that convention ever changes.
- name: Read the API server URL from the kubeconfig
  set_fact:
    _print_connection_api_server: "{{ (lookup('file', sno_kubeconfig) | from_yaml).clusters[0].cluster.server }}"

# ignore_errors here, not a hard dependency — this role may run standalone (e.g. a
# re-run just to print connection info) at a point where the console route isn't up
# for any other reason; better to print a partial summary than fail the whole task.
- name: Look up the web console Route
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: openshift-console
    name: console
  register: _print_connection_console_route
  ignore_errors: true

- name: Record the console URL (or a fallback note if the Route isn't up yet)
  set_fact:
    _print_connection_console_url: >-
      {{
        'https://' ~ _print_connection_console_route.resources[0].spec.host
        if (_print_connection_console_route is succeeded and _print_connection_console_route.resources | default([]) | length > 0)
        else '(console Route not found — check `oc get route console -n openshift-console`)'
      }}

# kubeadmin-password is deliberately NOT bundled alongside sno_kubeconfig by either
# provider's handback path (package_bastion_bundle, unpack_kubeconfig_bundle) — it's
# gitignored repo-wide (**/auth/kubeadmin-password) and treated as sensitive, so it
# only ever exists on whichever host actually ran `openshift-install create cluster`.
# On bare metal that's this bastion (wait_for_sno_install runs here); on AWS it's
# staging (aws_provision_sno_ipi), never copied over. Check locally rather than just
# assuming the bare-metal case.
- name: Check whether kubeadmin-password exists on this host
  stat:
    path: "{{ install_dir }}/auth/kubeadmin-password"
  register: _print_connection_kubeadmin_stat

- name: Report how to connect to the cluster
  debug:
    msg:
      - "=================================================================="
      - "Cluster is configured — connection info"
      - "=================================================================="
      - "API server:  {{ _print_connection_api_server }}"
      - "Web console: {{ _print_connection_console_url }}"
      - "kubeconfig:  {{ sno_kubeconfig }} (already on this host)"
      - "------------------------------------------------------------------"
      - "export KUBECONFIG={{ sno_kubeconfig }}"
      - "oc whoami --show-console"

- name: Report the kubeadmin password file location (when present on this host)
  debug:
    msg: "kubeadmin password file: {{ install_dir }}/auth/kubeadmin-password"
  when: _print_connection_kubeadmin_stat.stat.exists

- name: Note where to find kubeadmin's password when it isn't on this host
  debug:
    msg: >-
      kubeadmin password: not on this host — `openshift-install create cluster` ran
      on staging for this environment, and that file is deliberately not bundled
      alongside the kubeconfig. Retrieve it from staging's
      {{ install_dir }}/auth/kubeadmin-password if you need password (vs.
      token/cert) auth.
  when: not _print_connection_kubeadmin_stat.stat.exists
