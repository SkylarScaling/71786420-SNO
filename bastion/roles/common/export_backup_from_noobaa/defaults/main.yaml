---
# Buckets to export. Defaults to just the OADP/Velero backup bucket (configure_oadp_backup's
# backup_s3_bucket) — without it, OADP's own backups (including the stateful-workload
# PV data it captures via kopia) would never actually leave the node. Add
# application-created buckets per-environment (inventory vars block) if those also
# need exporting.
backup_export_buckets:
  - "{{ backup_s3_bucket }}"

backup_export_workspace: /opt/backup-export

# Same bin_dir convention used elsewhere in this repo (role defaults aren't shared
# across roles, so duplicated rather than centralized).
bin_dir: "~/.local/bin"
rclone_download_url: "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
