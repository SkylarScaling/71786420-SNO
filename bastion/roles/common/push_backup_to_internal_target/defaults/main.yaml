---
# Which rclone backend to push to: s3 (default) | smb | sftp | local. The backup
# target the customer already runs on the disconnected network (same private
# network/switch as the bastion and SNO node) doesn't have to be S3-compatible —
# this hop is this repo's own rclone invocation, not an OADP/Velero component.
backup_internal_target_type: s3

# All target vars below are deliberately left empty: genuinely per-environment, must
# be set in staging/inventory/inventory.yaml's vars: block, not here — Ansible's
# precedence puts group_vars/all ABOVE inline inventory-file vars, so a default here
# would silently win over any real per-environment override.

# backup_internal_target_type: s3
backup_internal_target_endpoint: ""
backup_internal_target_bucket: ""
backup_internal_target_access_key: ""
backup_internal_target_secret_key: ""

# backup_internal_target_type: smb
backup_internal_target_host: ""
backup_internal_target_share: ""
backup_internal_target_user: ""
backup_internal_target_password: ""
backup_internal_target_domain: ""

# backup_internal_target_type: sftp (host/user/password shared with smb above)
backup_internal_target_port: 22
backup_internal_target_ssh_key_file: ""

# backup_internal_target_type: local — an already-mounted filesystem path (NFS/CIFS
# mount, USB, etc.). This role does not manage the mount itself.
backup_internal_target_path: ""
