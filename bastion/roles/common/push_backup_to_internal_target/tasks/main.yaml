---
# Pushes the bastion's staged export (populated by export_backup_from_noobaa)
# straight to an S3-compatible backup target the customer already has on the
# disconnected network. Runs on the bastion itself — no relay through staging and no
# internet route needed at all, unlike push_backup_to_external_s3, since the target
# is already reachable on the same private network/switch as the bastion and SNO
# node. Only runs when backup_egress_mode is 'internal' (gated in
# bastion/playbooks/export-backup.yaml, not in this role itself).
- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for the rclone binary
  command: "{{ bin_dir }}/rclone version"
  register: rclone_check
  failed_when: false
  changed_when: false

# KNOWN GAP: same issue as export_backup_from_noobaa — this downloads rclone
# directly from the internet, but the bastion is supposed to be fully disconnected.
# Not fixed here (out of scope for the staging/bastion restructuring); the real fix
# is to add rclone to package_bastion_bundle/unpack_bastion_bundle's payload.
- name: Download and install rclone
  when: rclone_check.rc != 0
  block:
    - name: Download the rclone zip
      get_url:
        url: "{{ rclone_download_url }}"
        dest: /tmp/rclone.zip
        mode: '0644'

    - name: Extract the rclone binary (flatten the versioned subdirectory the zip contains)
      shell: "unzip -j -o /tmp/rclone.zip '*/rclone' -d {{ bin_dir }}"
      args:
        creates: "{{ bin_dir }}/rclone"

    - name: Make rclone executable
      file:
        path: "{{ bin_dir }}/rclone"
        mode: '0755'

- name: Push the staged backup data to the internal on-prem backup target
  no_log: true
  command: >
    {{ bin_dir }}/rclone sync
    "{{ backup_export_workspace }}"
    ":s3,provider=Other,env_auth=false,access_key_id={{ backup_internal_target_access_key }},secret_access_key={{ backup_internal_target_secret_key }},endpoint={{ backup_internal_target_endpoint }}:{{ backup_internal_target_bucket }}"
