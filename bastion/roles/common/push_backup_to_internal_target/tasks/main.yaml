---
# Pushes the bastion's staged export (populated by export_backup_from_noobaa)
# straight to an S3-compatible backup target the customer already has on the
# disconnected network. Runs on the bastion itself — no relay through staging and no
# internet route needed at all, unlike push_backup_to_external_target, since the target
# is already reachable on the same private network/switch as the bastion and SNO
# node. Only runs when backup_egress_mode is 'internal' (gated in
# bastion/playbooks/export-backup.yaml, not in this role itself).
- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for the rclone binary
  command: "{{ bin_dir }}/rclone version"
  register: rclone_check
  failed_when: false
  changed_when: false

# KNOWN GAP: same issue as export_backup_from_noobaa — this downloads rclone
# directly from the internet, but the bastion is supposed to be fully disconnected.
# Not fixed here (out of scope for the staging/bastion restructuring); the real fix
# is to add rclone to package_bastion_bundle/unpack_bastion_bundle's payload.
- name: Download and install rclone
  when: rclone_check.rc != 0
  block:
    - name: Download the rclone zip
      get_url:
        url: "{{ rclone_download_url }}"
        dest: /tmp/rclone.zip
        mode: '0644'

    - name: Extract the rclone binary (flatten the versioned subdirectory the zip contains)
      shell: "unzip -j -o /tmp/rclone.zip '*/rclone' -d {{ bin_dir }}"
      args:
        creates: "{{ bin_dir }}/rclone"

    - name: Make rclone executable
      file:
        path: "{{ bin_dir }}/rclone"
        mode: '0755'

- name: Obscure the SMB/SFTP password, if one was given
  command: "{{ bin_dir }}/rclone obscure {{ backup_internal_target_password }}"
  register: _backup_internal_obscured_password
  no_log: true
  when:
    - backup_internal_target_type in ['smb', 'sftp']
    - backup_internal_target_password | length > 0

# See roles/common/push_backup_to_external_target's matching task for the per-type rclone
# remote-spec shapes this dict mirrors.
- name: Resolve the rclone destination for the configured target type
  set_fact:
    _backup_internal_target_dest: >-
      {{
        {
          's3': ':s3,provider=Other,env_auth=false,access_key_id=' ~ backup_internal_target_access_key ~ ',secret_access_key=' ~ backup_internal_target_secret_key ~ ',endpoint=' ~ backup_internal_target_endpoint ~ ':' ~ backup_internal_target_bucket,
          'smb': ':smb,host=' ~ backup_internal_target_host ~ ',user=' ~ backup_internal_target_user ~ ',pass=' ~ (_backup_internal_obscured_password.stdout | default('')) ~ (',domain=' ~ backup_internal_target_domain if backup_internal_target_domain | length > 0 else '') ~ ':' ~ backup_internal_target_share,
          'sftp': ':sftp,host=' ~ backup_internal_target_host ~ ',user=' ~ backup_internal_target_user ~ ',port=' ~ backup_internal_target_port ~ (',key_file=' ~ backup_internal_target_ssh_key_file if backup_internal_target_ssh_key_file | length > 0 else ',pass=' ~ (_backup_internal_obscured_password.stdout | default(''))) ~ ':' ~ backup_internal_target_path,
          'local': backup_internal_target_path,
        }[backup_internal_target_type]
      }}
  no_log: true

- name: Push the staged backup data to the internal on-prem backup target
  no_log: true
  command: >
    {{ bin_dir }}/rclone sync
    "{{ backup_export_workspace }}"
    "{{ _backup_internal_target_dest }}"
