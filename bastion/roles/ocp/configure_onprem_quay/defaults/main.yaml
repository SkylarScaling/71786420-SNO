---
# MUST match staging/roles/common/stage_mirror_content/defaults/main.yaml's
# oc_mirror_operator_packages `quay-operator` entry's `channel` exactly — that entry
# was missing entirely until discovered alongside the loki-operator channel-mismatch
# issue (see that file's comment): this role's Subscription requested quay-operator
# at install time, but nothing had ever mirrored it, which on a disconnected cluster
# fails the same way any mismatched/missing channel does — the Subscription never
# resolves, with no obvious error pointing back at the mirror step.
quay_channel: stable-3.13
quay_storage_class: "{{ lvms_vg_name | default('vg1') }}"
quay_storage_size: 200Gi
# Single replica by default — no HA requirement at this scale, and keeping Quay
# lightweight matters more than registry availability on a true SNO. Bump this (and
# re-run) if that changes; horizontalpodautoscaler stays unmanaged either way (no
# autoscaling), so this is the only replica control.
quay_replicas: 1
