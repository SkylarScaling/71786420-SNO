---
- name: Refuse to run unless alert_smtp_host and alert_email_to are set
  fail:
    msg: >-
      alert_smtp_host and/or alert_email_to are not defined. Set both in
      staging/inventory/inventory.yaml's vars block (the customer's on-site SMTP
      relay hostname and the real alert recipient address) before running this role.
  when: alert_smtp_host is not defined or alert_smtp_host == '' or alert_email_to is not defined or alert_email_to == ''

- name: Overwrite the alertmanager-main Secret with the rendered alertmanager.yaml
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    template: alertmanager-config-secret.yaml.j2
