---
metallb_channel: stable
metallb_namespace: metallb-system

# metallb_address_pool is NOT defaulted here (same precedence reason as base_domain —
# see staging/inventory/inventory.yaml): it's a real customer-provided IP
# range carved out by their network team specifically for this cluster's LoadBalancer
# Services, so it must be set per-environment in staging/inventory/inventory.yaml's
# vars block, not given a generic value here that could silently be used in error.
# Accepts either a CIDR (e.g. "192.168.1.240/28") or an explicit range string (e.g.
# "192.168.1.240-192.168.1.250"), or a YAML list of either form.
