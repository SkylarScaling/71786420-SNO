---
# odf-operator's channel. "stable" (no major.minor suffix) doesn't exist on this
# package — confirmed live against the mirrored redhat-operator-index for
# openshift_version 4.22 (`oc get packagemanifest odf-operator -o
# jsonpath='{.status.channels[*].name}'` -> stable-4.21 stable-4.22), which left the
# Subscription permanently ConstraintsNotSatisfiable. Tied to openshift_version, same
# as configure_lvms's lvms_channel — re-verify with the same packagemanifest lookup
# when openshift_version changes.
mcg_channel: stable-4.22

# Sized to fit comfortably under the hardware RAID5 array's usable capacity, with
# headroom left for LVMS-backed PVs used by other workloads on the same volume group.
# Override per-environment in inventory — this default is a placeholder, not a sizing
# recommendation for any specific array.
mcg_backing_pvc_size: 500Gi

# Cross-role default reference, same pattern as configure_onprem_quay's
# quay_storage_class: fall back to configure_lvms's default VG name so this role
# "just works" against the default LVMS setup, but still override-able per-environment.
# "lvms-" prefix required — LVMS's own auto-created default-deviceClass StorageClass
# is named lvms-<vg name> (confirmed live: PVC stuck Pending with "storageclass
# \"vg1\" not found" until this was corrected to lvms-vg1), not the bare VG name.
mcg_backing_storage_class: "lvms-{{ lvms_vg_name | default('vg1') }}"
