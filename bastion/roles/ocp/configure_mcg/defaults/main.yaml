---
# odf-operator's channel — "stable" alone doesn't exist on this package (confirmed
# live: only stable-4.21/stable-4.22). Tied to openshift_version, same as
# configure_lvms's lvms_channel — re-verify on version bumps.
mcg_channel: stable-4.22

# Placeholder sized for the hardware RAID5 array with headroom for other LVMS PVs —
# override per-environment.
mcg_backing_pvc_size: 500Gi

# Retain, not the shared vg1 Delete default — holds every S3 bucket's actual bytes
# (OADP backups, app data), same reasoning as configure_postgres's
# postgres_storage_class. Confirmed live: previously fell back to Delete-policy vg1.
mcg_backing_storage_class: "{{ lvms_retain_storage_class_name | default((lvms_vg_name | default('vg1')) + '-retain') }}"
