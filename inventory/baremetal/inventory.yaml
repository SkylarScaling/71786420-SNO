---
# Fill in once the target environment's single bastion and node details are known.
# Per-environment overrides (base_domain, BMC details, etc.) go in this file's vars
# block rather than editing playbooks/group_vars/all.yaml, which holds shared defaults.
all:
  vars:
    infra_provider: baremetal
    base_domain: example.com     # TODO: override per environment

    # --- Dell iDRAC BMC (roles/baremetal/baremetal_boot_node_via_bmc) ---
    bmc_address: 192.168.1.20        # TODO: iDRAC address
    bmc_username: root               # TODO: iDRAC credentials
    bmc_password: changeme           # TODO: iDRAC credentials — move to ansible-vault before committing a real value
    iso_http_url: "http://192.168.1.10/sno-iso/agent.x86_64.iso"   # TODO: matches configure_bastion_services' iso_serve_dir on the bastion above

    # --- Agent-based install networking (roles/baremetal/baremetal_generate_agent_iso) ---
    rendezvous_ip: 192.168.1.30      # TODO: the SNO node's static IP
    sno_mac_address: "AA:BB:CC:DD:EE:FF"   # TODO: the SNO node's primary NIC MAC
    default_gateway: 192.168.1.1     # TODO: customer-provided gateway
    dns_server: 192.168.1.2          # TODO: customer-provided Windows DNS server — see README's "DNS records to request" section
    ntp_server: 192.168.1.3          # TODO: customer-provided NTP server

    # Single switch (default) — leave sno_network_topology unset/single_switch and
    # ignore the two vars below. Dual switch (opt-in, requires a second physical NIC
    # on the SNO node, cabled to a second ToR switch) — set sno_network_topology:
    # dual_switch and uncomment/fill these in. See
    # roles/baremetal/baremetal_generate_agent_iso/README.md — this does not extend
    # to the bastion, which isn't network-configured by this automation at all.
    # sno_network_topology: dual_switch
    # sno_interface_name_secondary: eno2
    # sno_mac_address_secondary: "AA:BB:CC:DD:EE:00"

    # --- Storage (roles/ocp/configure_lvms, roles/ocp/configure_mcg) ---
    # The RAID5 virtual disk presents as a single block device to the OS — point
    # LVMS at that device path once confirmed on the real hardware (RAID5 is the
    # redundancy layer; LVMS/MCG don't need their own replication on top of it).
    lvms_device_paths: []            # TODO: e.g. ["/dev/sda"] — the RAID5 VD, confirm actual device name on the real server

    # --- MetalLB (roles/ocp/configure_metallb) — non-HTTP TCP middleware only ---
    metallb_address_pool: "192.168.1.240-192.168.1.250"   # TODO: customer-provided range

    # --- Email alerting (roles/ocp/configure_alerting) ---
    alert_smtp_host: 192.168.1.4     # TODO: customer-provided mail server
    alert_email_to: "ocp-alerts@customer.example.com"   # TODO: real distribution list

    # --- Backup/log export egress (roles/ocp/configure_mcg_backup_export) ---
    # A separate concern from the in-cluster OADP target above: this relays staged
    # S3 data back OUT to a real external target via the mirror-staging host (the
    # only host with internet access), see docs/bare-metal-architecture.md §8.
    backup_egress_mode: both   # network | media | both — this customer wants both available
    backup_external_s3_endpoint: ""   # TODO: real external S3 target
    backup_external_s3_bucket: ""     # TODO
    backup_external_s3_access_key: "" # TODO — move to ansible-vault before committing a real value
    backup_external_s3_secret_key: "" # TODO — move to ansible-vault before committing a real value
  hosts:
    localhost:
      ansible_connection: local
  children:
    bastion:
      hosts:
        bastion1:
          ansible_host: 192.168.1.10   # TODO: real bastion IP
          ansible_user: root
    mirror_staging_host:
      hosts:
        mirror-staging1:
          ansible_host: 192.168.1.5    # TODO: internet-connected host used to stage mirror content
          ansible_user: root
