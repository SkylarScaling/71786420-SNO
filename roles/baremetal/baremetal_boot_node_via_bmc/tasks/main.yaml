---
- name: Fail fast if BMC details are not yet configured
  fail:
    msg: >
      baremetal_boot_node_via_bmc needs bmc_address, bmc_username, bmc_password and
      iso_http_url set (inventory/baremetal/inventory.yaml's vars block). See this
      role's README.md.
  when: bmc_address is not defined or bmc_username is not defined or bmc_password is not defined or iso_http_url is not defined

# Dell iDRAC9/10 implement standard Redfish — no vendor-specific payload needed
# beyond resource_id (iDRAC only ever exposes one Manager/System, but
# redfish_command still requires naming it on some firmware versions).
- name: Insert virtual media (agent ISO)
  community.general.redfish_command:
    category: Manager
    command: VirtualMediaInsert
    resource_id: "{{ bmc_manager_resource_id }}"
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    virtual_media:
      image_url: "{{ iso_http_url }}"
      media_types:
        - CD
        - DVD

- name: Set one-time boot to virtual media
  community.general.redfish_command:
    category: Systems
    command: SetOneTimeBoot
    resource_id: "{{ bmc_system_resource_id }}"
    bootdevice: Cd
    boot_override_mode: "{{ bmc_boot_mode }}"
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"

- name: Power cycle the node
  community.general.redfish_command:
    category: Systems
    command: PowerForceRestart
    resource_id: "{{ bmc_system_resource_id }}"
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"

# iDRAC needs a few seconds to act on the power command before PowerState reflects
# it — poll rather than assume the restart already completed by the time the next
# task runs.
- name: Wait for the node to report power state On
  community.general.redfish_info:
    category: Systems
    command: GetSystemInfo
    resource_id: "{{ bmc_system_resource_id }}"
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
  register: bmc_system_info
  until: bmc_system_info.redfish_facts.system.entries[0].PowerState == 'On'
  retries: 20
  delay: 15

# Agent-based install boots the ISO, applies agent-config.yaml/install-config.yaml,
# and starts the assisted-installer service — wait_for_sno_install (roles/ocp/)
# polls cluster-level install progress from there; this role's job ends once the
# node is confirmed powered on with the agent ISO mounted.
