---
# The bare-metal bastion is existing hardware, not something we provision — this just
# validates it's reachable. The bastion is the disconnected target (see
# docs/architectural-decisions.md #2): it gets its content exclusively via
# sync_mirror_to_bastion + deploy_mirror_registry, never directly from the internet.
- name: Verify bastion is reachable
  ping:

- name: Confirm the bastion cannot reach the public internet directly (expected — it's disconnected)
  uri:
    url: "https://{{ registry_reachability_check_host | default('registry.redhat.io') }}"
    method: HEAD
    validate_certs: true
  register: internet_check
  failed_when: false

- name: Warn if the bastion unexpectedly has direct internet access
  debug:
    msg: >
      WARNING: bastion reached {{ registry_reachability_check_host | default('registry.redhat.io') }}
      directly. This environment is treated as fully disconnected — all cluster content
      is expected to come from the mirror registry deployed by deploy_mirror_registry,
      not the public internet. Review the bastion's network path if this is unexpected.
  when: internet_check.status is defined and internet_check.status == 200
