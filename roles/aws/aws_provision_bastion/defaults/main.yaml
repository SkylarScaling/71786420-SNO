---
bastion_ami_id: ""          # "" = auto-detect the latest matching AMI below; set explicitly to pin/override
bastion_security_groups: []
# The RHEL AMI's default root volume (~10GB) isn't enough to hold both the synced
# mirror archive (sync_mirror_to_bastion) and the mirror-registry's own Quay storage
# for the same content pushed into it — bump it explicitly (see
# mirror_staging_root_volume_size_gb for the matching note on the staging host).
# 150 wasn't enough either, confirmed against a real run: two oc-mirror sequence
# archives synced here simultaneously (~56GB + ~30GB, the second a version-pin
# correction re-mirror — see stage_mirror_content's imageset-config.yaml.j2 comment)
# plus Quay's own on-disk storage for already-pushed content (~57GB and growing) blew
# through 150GB with "No space left on device" mid-rsync.
bastion_root_volume_size_gb: 300
# aws_key_pair is set per-environment in inventory/aws/<base_domain>.yaml by
# configure-aws-env.yaml, not defaulted here — see playbooks/group_vars/all.yaml.
bastion_ssh_user: ec2-user
# The mirror-staging host's SSH user, needed here to build the ProxyCommand jump
# through it (tasks/main.yaml) — duplicated from aws_provision_mirror_staging_host's
# default since role defaults aren't visible across roles.
mirror_staging_ssh_user: ec2-user

# Auto-detected RHEL 9 AMI lookup (see tasks/main.yaml) — 309956199498 is Red Hat's
# official AWS account ID for published RHEL AMIs.
rhel_ami_owner: "309956199498"
rhel_ami_name_filter: "RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3"
