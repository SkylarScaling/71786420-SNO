---
# Neither of these is tracked by openshift-install's own destroy — ccoctl's OIDC
# bucket/IAM roles live outside the CAPI-tracked infrastructure in metadata.json, and
# the apps wildcard CNAME in the PUBLIC zone was created directly by
# roles/aws/aws_configure_manual_dns, not by the installer (the private zone's own
# copy of this record is removed for free when `destroy cluster` below deletes that
# whole zone). Left alone, both leak permanently across every destroy/recreate cycle.
# ignore_errors throughout: the cluster may never have reached the point where either
# was created (e.g. failed before aws_configure_manual_credentials/_dns ran).
- name: Recompute the ccoctl resource name (must match aws_configure_manual_credentials' deterministic naming)
  set_fact:
    ccoctl_name: "{{ cluster_name }}-{{ (base_domain | hash('md5'))[:8] }}"

- name: Delete ccoctl-created IAM roles and the OIDC S3 bucket
  command: "{{ bin_dir | default('~/.local/bin') }}/ccoctl aws delete --name={{ ccoctl_name }} --region={{ aws_region }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  ignore_errors: true

- name: Find the public hosted zone for base_domain
  command: >
    aws route53 list-hosted-zones-by-name --dns-name {{ base_domain }}
    --query "HostedZones[?Config.PrivateZone==\`false\` && Name==\`{{ base_domain }}.\`].Id | [0]"
    --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  register: public_zone_lookup
  changed_when: false
  ignore_errors: true

- name: Look up the apps wildcard CNAME's current value in the public zone
  command: >
    aws route53 list-resource-record-sets --hosted-zone-id {{ public_zone_lookup.stdout | regex_replace('^/hostedzone/', '') }}
    --query "ResourceRecordSets[?Name==\`*.apps.{{ cluster_name }}.{{ base_domain }}.\` && Type==\`CNAME\`].ResourceRecords[0].Value | [0]"
    --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  register: apps_record_lookup
  changed_when: false
  ignore_errors: true
  when: public_zone_lookup is succeeded and public_zone_lookup.stdout | trim not in ['', 'None']

- name: Delete the apps wildcard CNAME from the public zone
  amazon.aws.route53:
    zone: "{{ base_domain }}"
    hosted_zone_id: "{{ public_zone_lookup.stdout | regex_replace('^/hostedzone/', '') }}"
    record: "*.apps.{{ cluster_name }}.{{ base_domain }}"
    type: CNAME
    value: "{{ apps_record_lookup.stdout }}"
    ttl: 30
    private_zone: false
    state: absent
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"
  ignore_errors: true
  when:
    - apps_record_lookup is succeeded
    - apps_record_lookup.stdout | trim not in ['', 'None']

- name: Destroy SNO cluster
  command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install --dir={{ install_dir }} destroy cluster --log-level=info"
  args:
    removes: "{{ install_dir }}/metadata.json"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"

- block:
    - name: Terminate bastion instance
      amazon.aws.ec2_instance:
        filters:
          "tag:Name": "{{ cluster_name }}-bastion"
        state: absent

    - name: Terminate mirror-staging instance
      amazon.aws.ec2_instance:
        filters:
          "tag:Name": "{{ cluster_name }}-mirror-staging"
        state: absent

    - name: Look up the VPC to destroy
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "{{ cluster_name }}-vpc"
      register: vpc_info

    # ec2_vpc_net with state=absent only removes the VPC itself and fails with a
    # DependencyViolation if anything still references it — tear those down first, in
    # dependency order: endpoints (and the ENIs they own) before the security groups
    # they use, then the IGW, route tables, and subnets.
    - name: Tear down everything inside the VPC before deleting it (skipped if already gone)
      when: vpc_info.vpcs | length > 0
      vars:
        destroy_vpc_id: "{{ vpc_info.vpcs[0].id }}"
      block:
        - name: Look up VPC endpoints
          amazon.aws.ec2_vpc_endpoint_info:
            filters:
              vpc-id: "{{ destroy_vpc_id }}"
          register: vpc_endpoints_info

        - name: Delete VPC endpoints
          amazon.aws.ec2_vpc_endpoint:
            vpc_endpoint_id: "{{ item.vpc_endpoint_id }}"
            state: absent
          loop: "{{ vpc_endpoints_info.vpc_endpoints }}"
          loop_control:
            label: "{{ item.vpc_endpoint_id }}"

        - name: Detach and delete the internet gateway
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ destroy_vpc_id }}"
            state: absent

        - name: Look up route tables
          amazon.aws.ec2_vpc_route_table_info:
            filters:
              vpc-id: "{{ destroy_vpc_id }}"
          register: route_tables_info

        - name: Delete non-main route tables (the main one is removed implicitly with the VPC)
          amazon.aws.ec2_vpc_route_table:
            vpc_id: "{{ destroy_vpc_id }}"
            route_table_id: "{{ item.id }}"
            lookup: id
            state: absent
          loop: "{{ route_tables_info.route_tables }}"
          loop_control:
            label: "{{ item.id }}"
          when: item.associations | selectattr('main', 'equalto', true) | list | length == 0

        - name: Look up subnets
          amazon.aws.ec2_vpc_subnet_info:
            filters:
              vpc-id: "{{ destroy_vpc_id }}"
          register: subnets_info

        # Deleting a VPC endpoint only schedules its ENI for deletion — AWS can take a
        # couple of minutes to actually release it, during which a subnet that ENI
        # sat in still looks "in use". Retry rather than fail on that race.
        - name: Delete subnets
          amazon.aws.ec2_vpc_subnet:
            vpc_id: "{{ destroy_vpc_id }}"
            cidr: "{{ item.cidr_block }}"
            state: absent
          loop: "{{ subnets_info.subnets }}"
          loop_control:
            label: "{{ item.id }}"
          register: subnet_delete_result
          until: subnet_delete_result is succeeded
          retries: 10
          delay: 15

        - name: Look up security groups created for this cluster (excludes the VPC's own default group)
          amazon.aws.ec2_security_group_info:
            filters:
              vpc-id: "{{ destroy_vpc_id }}"
              group-name: "{{ cluster_name }}-*"
          register: cluster_sgs_info

        - name: Delete security groups
          amazon.aws.ec2_security_group:
            group_id: "{{ item.group_id }}"
            state: absent
          loop: "{{ cluster_sgs_info.security_groups }}"
          loop_control:
            label: "{{ item.group_id }}"

        # Doesn't block VPC deletion (Route53 zones are independent resources), but
        # left alone it becomes an orphaned zone pointed at a vpc_id that no longer
        # exists — matched back up by aws_provision_bastion's route53_zone task via
        # {zone, vpc_id}, so clean it up here or repeated test runs accumulate stale
        # zones in the account. See aws_provision_bastion's task for why this zone
        # exists (mirror.{{ base_domain }} has no other DNS path in this environment).
        # Same region/identifier param collision as aws_provision_bastion's matching
        # task — amazon.aws.route53's own "region" option means latency-routing
        # region, not the AWS SDK connection region module_defaults sets below.
        - name: Delete the mirror.{{ base_domain }} record
          amazon.aws.route53:
            zone: "{{ base_domain }}"
            record: "mirror.{{ base_domain }}"
            type: A
            private_zone: true
            state: absent
            region: "{{ omit }}"
          ignore_errors: true

        - name: Delete the private Route53 hosted zone for base_domain
          amazon.aws.route53_zone:
            zone: "{{ base_domain }}"
            vpc_id: "{{ destroy_vpc_id }}"
            vpc_region: "{{ aws_region }}"
            state: absent
          ignore_errors: true

    - name: Destroy the VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ cluster_name }}-vpc"
        cidr_block: "{{ vpc_cidr | default('10.0.0.0/16') }}"
        state: absent
      register: vpc_delete_result
      until: vpc_delete_result is succeeded
      retries: 10
      delay: 15
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"
