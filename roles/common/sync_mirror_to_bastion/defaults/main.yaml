---
mirror_sync_method: rsync   # rsync | media — "media" means this role only prepares a tarball for manual transfer
mirror_sync_source_dir: "{{ oc_mirror_workspace | default('/opt/oc-mirror-workspace') }}/archive"
mirror_sync_dest_dir: /opt/mirror-content/archive

# Same default path as stage_mirror_content's mirror_installers_dir (role defaults
# aren't shared across roles) — carries the oc-mirror/mirror-registry tarballs it
# downloaded over to the same path on the bastion, which has no internet route to
# fetch them itself (see deploy_mirror_registry).
mirror_installers_dir: /opt/mirror-installers
