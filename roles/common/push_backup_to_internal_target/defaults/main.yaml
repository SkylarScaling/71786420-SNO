# S3-compatible backup target the customer already runs on the disconnected
# network (same private network/switch as the bastion and SNO node) — e.g. an
# existing on-prem backup appliance or object-storage system with an S3-compatible
# front end. Deliberately left empty: this is genuinely per-environment and must be
# set in inventory/<provider>/inventory.yaml's vars: block, not here and not in
# playbooks/group_vars/all.yaml (see CLAUDE.md's group_vars/all precedence gotcha).
backup_internal_target_endpoint: ""
backup_internal_target_bucket: ""
backup_internal_target_access_key: ""
backup_internal_target_secret_key: ""
