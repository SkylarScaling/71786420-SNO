---
- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for openshift-install
  command: "{{ bin_dir }}/openshift-install version"
  register: oinstall_check
  failed_when: false
  changed_when: false

# A plain existence check isn't enough — confirmed against a real run: a binary
# downloaded once (e.g. 4.22.8) silently never gets refreshed when openshift_version
# is later bumped (e.g. to 4.22.17), since this task only ever saw "it already runs,
# skip". The installer then uses ITS OWN baked-in release's images regardless of what
# openshift_version/stage_mirror_content's imageset-config.yaml.j2 pin says — so the
# mirror ends up with the right version's content, but the installer still demands a
# completely different (unmirrored) one, which manifests as every release-image pull
# on the node failing with "manifest unknown" and bootstrapping timing out, not a
# clear version-mismatch error.
- name: Download and extract openshift-install (missing, or version doesn't match openshift_version)
  unarchive:
    src: "{{ ocp_mirror_url }}/openshift-install-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
  when: oinstall_check.rc != 0 or openshift_version not in oinstall_check.stdout

- name: Check for oc client
  command: "{{ bin_dir }}/oc version --client"
  register: oc_check
  failed_when: false
  changed_when: false

- name: Download and extract oc client (missing, or version doesn't match openshift_version — see above)
  unarchive:
    src: "{{ ocp_mirror_url }}/openshift-client-linux.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
  when: oc_check.rc != 0 or openshift_version not in oc_check.stdout

- name: Install required Python modules
  pip:
    name:
      - kubernetes
      - openshift
      - boto3
    state: present
