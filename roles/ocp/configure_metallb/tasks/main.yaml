---
- name: Refuse to run unless metallb_address_pool is set
  fail:
    msg: >-
      metallb_address_pool is not defined. Set it in inventory/baremetal/inventory.yaml's
      vars block to the customer-provided LoadBalancer IP range (CIDR or explicit
      range string) before running this role.
  when: metallb_address_pool is not defined or metallb_address_pool == ''

- name: Install MetalLB operator (namespace, operator group, subscription)
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    template: metallb-subscription.yaml.j2

- name: Wait for MetalLB operator deployment to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ metallb_namespace }}"
    name: metallb-operator-controller-manager
  register: metallb_operator_deploy
  until: >
    metallb_operator_deploy.resources | length > 0
    and metallb_operator_deploy.resources[0].status.readyReplicas | default(0) | int > 0
  retries: 30
  delay: 20

- name: Create MetalLB CR (deploys controller + speaker)
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    template: metallb-instance.yaml.j2

- name: Wait for MetalLB controller deployment to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ metallb_namespace }}"
    name: controller
  register: metallb_controller_deploy
  until: >
    metallb_controller_deploy.resources | length > 0
    and metallb_controller_deploy.resources[0].status.readyReplicas | default(0) | int > 0
  retries: 30
  delay: 20

- name: Create IPAddressPool
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    template: ipaddresspool.yaml.j2

- name: Create L2Advertisement
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    template: l2advertisement.yaml.j2
