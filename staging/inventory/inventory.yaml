---
# Single source of per-environment config for both staging and the bastion — edit
# here only. package_bastion_bundle flattens this vars: block into the bundle;
# unpack_bastion_bundle writes it verbatim to bastion/group_vars/all.yaml.
#
# CAUTION: *_dir paths (oc_mirror_workspace, mirror_installers_dir,
# mirror_archive_dir, bastion_bundle_export_dir, bastion_bundle_dir,
# mirror_registry_install_dir, oc_mirror_cache_dir, etc.) are shared values
# evaluated independently on two separate physical machines with no per-host
# override — mount your large storage volume at the same path on both before
# overriding any of these.
all:
  vars:
    # --- Identity ---
    cluster_name: sno-test
    openshift_version: "4.22.17"
    infra_provider: baremetal   # This repo is bare-metal only.
    base_domain: example.com     # TODO: override per environment

    # --- Debugging ---
    # Prints resolved values of key vars at several points in both staging's and the
    # bastion's automation, to confirm what's actually in effect vs. what's expected.
    debug_vars: false

    # --- Credentials / keys ---
    ssh_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    ssh_private_key: "~/.ssh/id_ed25519"
    # Raw JSON text, not parsed — install-config.yaml.j2 embeds this as a literal string.
    pull_secret: "{{ lookup('file', '~/pull-secret.json') }}"

    # --- Working directories (bastion-side; meaningful once unpacked there) ---
    tmp_dir: "/tmp/{{ cluster_name }}"
    install_dir: "{{ tmp_dir }}/install"
    sno_kubeconfig: "{{ install_dir }}/auth/kubeconfig"

    # --- Single-switch / single-subnet network emulation ---
    machine_network_cidr: "10.0.0.0/24"
    cluster_network_cidr: "10.128.0.0/14"
    service_network_cidr: "172.30.0.0/16"

    # --- Dell iDRAC BMC (roles/baremetal/baremetal_boot_node_via_bmc) ---
    bmc_address: 192.168.1.20        # TODO: iDRAC address
    bmc_username: root               # TODO: iDRAC credentials
    bmc_password: changeme           # TODO: iDRAC credentials — move to ansible-vault before committing a real value
    iso_http_url: "http://192.168.1.10/sno-iso/agent.x86_64.iso"   # TODO: matches configure_bastion_services' iso_serve_dir on the bastion above

    # --- Agent-based install networking (roles/baremetal/baremetal_generate_agent_iso) ---
    rendezvous_ip: 192.168.1.30      # TODO: the SNO node's static IP
    sno_mac_address: "AA:BB:CC:DD:EE:FF"   # TODO: the SNO node's primary NIC MAC
    default_gateway: 192.168.1.1     # TODO: customer-provided gateway
    dns_server: 192.168.1.2          # TODO: customer-provided Windows DNS server — see docs/bare-metal-architecture.md §9 "DNS and NTP" for the DNS records to request
    ntp_server: 192.168.1.3          # TODO: customer-provided NTP server, or the bastion's own IP
                                      # with bastion_chrony_server_enabled: true (see
                                      # baremetal_configure_chrony_server's README)

    # Defaults (baremetal_generate_agent_iso) are sno-master-0/eno1 — override both to
    # match the real hardware.
    sno_hostname: sno-master-0       # TODO: real hardware's hostname
    sno_interface_name: eno1         # TODO: real hardware's primary NIC device name (e.g. eno17405np1)

    # Pins the install disk on multi-disk hardware. See baremetal_generate_agent_iso's README.
    sno_root_device: ""              # TODO: e.g. /dev/nvme0n1 — confirm on the real server

    # Single switch (default): leave sno_network_topology unset and ignore the two
    # vars below. Dual switch (opt-in, needs a 2nd NIC + 2nd ToR switch on the SNO
    # node only): set sno_network_topology: dual_switch and fill these in. See
    # bastion/roles/baremetal/baremetal_generate_agent_iso/README.md.
    # sno_network_topology: dual_switch
    # sno_interface_name_secondary: eno2
    # sno_mac_address_secondary: "AA:BB:CC:DD:EE:00"

    # --- Storage (roles/ocp/configure_lvms, roles/ocp/configure_mcg) ---
    # RAID5 VD presents as a single block device — point LVMS at it.
    lvms_device_paths: []            # TODO: e.g. ["/dev/sda"] — confirm on the real server

    # --- MetalLB (roles/ocp/configure_metallb) — non-HTTP TCP middleware only ---
    metallb_address_pool: "192.168.1.240-192.168.1.250"   # TODO: customer-provided range

    # --- Email alerting (roles/ocp/configure_alerting) ---
    alert_smtp_host: 192.168.1.4     # TODO: customer-provided mail server
    alert_email_to: "ocp-alerts@customer.example.com"   # TODO: real distribution list

    # --- Disconnected mirroring (always on — see docs/architectural-decisions.md #2) ---
    mirror_registry_quay_hostname: "mirror.{{ base_domain }}"
    mirror_registry_quay_port: 8443

    # --- Backup / DR target (in-cluster, via configure_mcg's NooBaa) ---
    backup_s3_bucket: "{{ cluster_name }}-oadp-backup"

    # --- Backup/log export egress (roles/ocp/configure_mcg_backup_export) ---
    # Relays staged S3 data out to a real external target via staging. See
    # docs/bare-metal-architecture.md §8.
    backup_egress_mode: both   # network | media | both — this customer wants both available
    backup_external_s3_endpoint: ""   # TODO: real external S3 target
    backup_external_s3_bucket: ""     # TODO
    backup_external_s3_access_key: "" # TODO — move to ansible-vault before committing a real value
    backup_external_s3_secret_key: "" # TODO — move to ansible-vault before committing a real value

    # --- Log forwarding target ---
    log_forward_endpoint: "https://siem.example.com:9200"

    # --- Operator catalog pins (single source for oc-mirror on staging AND every
    # Subscription on the bastion — see stage_mirror_content's and each
    # roles/ocp/configure_*'s README for how this is consumed). Update here only. ---
    operator_catalog:
      lvms:          { channel: stable-4.22 }                    # configure_lvms
      oadp:          { channel: stable }                         # configure_oadp_backup
      logging:       { channel: stable-6.7 }                     # configure_log_forwarding (cluster-logging)
      odf:           { channel: stable-4.22 }                    # configure_mcg (odf-operator + sub-packages below)
      loki:          { channel: stable-6.7 }                     # configure_lokistack
      grafana:       { channel: v5, catalog: community }         # configure_grafana
      opentelemetry: { channel: stable }                         # configure_opentelemetry (otel collector)
      tempo:         { channel: stable }                         # configure_opentelemetry (tempo)
      metallb:       { channel: stable }                         # configure_metallb
      rabbitmq:      { channel: stable, catalog: community }     # configure_rabbitmq
      postgres:      { channel: v5, catalog: certified }         # configure_postgres
      keycloak:      { channel: stable }                         # configure_keycloak
      quay:          { channel: stable-3.13 }                    # configure_onprem_quay

    # odf-operator's own fixed sub-package list — see configure_mcg's README ("Why
    # odf-operator needs so many sub-packages mirrored"). All pinned to
    # operator_catalog.odf.channel.
    odf_sub_packages:
      - ocs-operator
      - mcg-operator
      - rook-ceph-operator
      - odf-csi-addons-operator
      - cephcsi-operator
      - odf-dependencies
      - odf-prometheus-operator
      - recipe
      - ocs-client-operator
      - ocs-tls-profiles
      - odf-external-snapshotter-operator

    # --- Other version pins ---
    mirror_registry_version: "2.0.12"   # TODO: re-verify against https://mirror.openshift.com/pub/cgw/mirror-registry/
    pgadmin_image: "docker.io/dpage/pgadmin4:latest"
    redis_image: "registry.redhat.io/rhscl/redis-6-rhel7"

    # --- Bastion RPM lists (single source for sync_bastion_rpms and
    # configure_bastion_services — see sync_bastion_rpms' README) ---
    bastion_rpm_sync_method: reposync
    bastion_packages:
      - dnsmasq
      - httpd
      - tmux
      # Provides `dig`, used by deploy_mirror_registry's DNS pre-flight check.
      - bind-utils
      # Provides nmstatectl, required by openshift-install agent create image.
      - nmstate
      - chrony
    bastion_required_repos:
      - rhel-10-for-x86_64-baseos-rpms
      - rhel-10-for-x86_64-appstream-rpms
  hosts:
    localhost:
      ansible_connection: local
