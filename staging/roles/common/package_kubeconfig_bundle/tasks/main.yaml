---
# AWS-only. Runs on staging (hosts: localhost), after aws_provision_sno_ipi +
# wait_for_sno_install succeed. The cluster's kubeconfig only exists where
# `openshift-install create cluster` ran (staging, for AWS) — but every
# roles/ocp/* day-2 role needs to run on the bastion to stay identical across
# providers, so sno_kubeconfig has to travel out to the bastion too. Same
# single-file media/rsync pattern as package_install_config_bundle.
- name: Ensure the bundle export directory exists
  file:
    path: "{{ kubeconfig_bundle_export_dir }}"
    state: directory
    mode: '0755'

# kubeadmin-password is bundled alongside sno_kubeconfig so print_cluster_connection_info
# can print it directly on the bastion for test environments — this is the one place
# in the repo that deliberately ships this file off of staging (everywhere else it's
# treated as staging/bastion(bare-metal)-local-only and gitignored
# (**/auth/kubeadmin-password); fine for a disposable test loop, not something to
# reuse for a production credential path.
- name: Fail fast if kubeadmin-password doesn't exist yet
  stat:
    path: "{{ install_dir }}/auth/kubeadmin-password"
  register: _package_kubeconfig_kubeadmin_stat

- name: Fail with guidance if kubeadmin-password is missing
  fail:
    msg: >
      {{ install_dir }}/auth/kubeadmin-password not found — this role expects to run
      after `openshift-install create cluster` has finished writing it (same
      directory `wait_for_sno_install` already waits on for sno_kubeconfig).
  when: not _package_kubeconfig_kubeadmin_stat.stat.exists

# force_archive: true matters here — the archive module's default behavior for a
# single-file path is to gzip-compress it in place (no tar wrapper at all), which
# `unarchive` can't extract. Forcing a real tar is what makes this extractable.
# sno_kubeconfig and kubeadmin-password share the same parent directory
# ({{ install_dir }}/auth/), so archive's common_path() of the two is that directory,
# and the two archive members are named just "kubeconfig"/"kubeadmin-password" (not
# their full absolute paths) — unpack_kubeconfig_bundle relies on that to land both
# files directly in sno_kubeconfig's own parent directory.
- name: Archive sno_kubeconfig and kubeadmin-password into one tar.gz
  archive:
    path:
      - "{{ sno_kubeconfig }}"
      - "{{ install_dir }}/auth/kubeadmin-password"
    dest: "{{ kubeconfig_bundle_export_dir }}/{{ kubeconfig_bundle_name }}"
    format: gz
    force_archive: true

- name: Report the media-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "kubeconfig packaged"
      - "=================================================================="
      - "Location: {{ kubeconfig_bundle_export_dir }}/{{ kubeconfig_bundle_name }}"
      - "------------------------------------------------------------------"
      - "Next: get it to the bastion, then run unpack-cluster-access.yaml there"
      - "(which runs unpack_kubeconfig_bundle). If a network path to the bastion"
      - "exists (true for AWS's private-subnet VPC — set"
      - "kubeconfig_transfer_method: rsync in inventory.yaml to have this role"
      - "push it automatically instead of doing this by hand every run):"
      - "  scp -i {{ kubeconfig_transfer_ssh_key }} {{ kubeconfig_bundle_export_dir }}/{{ kubeconfig_bundle_name }} {{ kubeconfig_transfer_user }}@{{ kubeconfig_transfer_host }}:{{ kubeconfig_transfer_dest_dir }}/"
      - "Otherwise, carry it over on removable media and place it in"
      - "{{ kubeconfig_transfer_dest_dir }} on the bastion manually. Then, on the bastion:"
      - "  cd <bastion checkout>/playbooks"
      - "  ansible-playbook unpack-cluster-access.yaml -i ../inventory/inventory.yaml"
  when: kubeconfig_transfer_method == 'media'

- name: Stage the SSH private key here for the rsync push to the bastion
  copy:
    src: "{{ kubeconfig_transfer_ssh_key }}"
    dest: "/tmp/.kubeconfig_transfer_key"
    mode: '0600'
    remote_src: true
  when: kubeconfig_transfer_method == 'rsync'

- name: Fail fast if rsync transfer was requested without a target host
  fail:
    msg: "kubeconfig_transfer_method is 'rsync' but kubeconfig_transfer_host is unset."
  when:
    - kubeconfig_transfer_method == 'rsync'
    - not kubeconfig_transfer_host

- name: Rsync the kubeconfig bundle to the bastion
  command: >
    rsync -a
    --rsh="ssh -i /tmp/.kubeconfig_transfer_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    {{ kubeconfig_bundle_export_dir }}/{{ kubeconfig_bundle_name }}
    {{ kubeconfig_transfer_user }}@{{ kubeconfig_transfer_host }}:{{ kubeconfig_transfer_dest_dir }}/
  when: kubeconfig_transfer_method == 'rsync'

- name: Remove the staged relay key
  file:
    path: "/tmp/.kubeconfig_transfer_key"
    state: absent
  when: kubeconfig_transfer_method == 'rsync'

- name: Report the rsync-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "kubeconfig bundle pushed to the bastion"
      - "=================================================================="
      - "Destination: {{ kubeconfig_transfer_user }}@{{ kubeconfig_transfer_host }}:{{ kubeconfig_transfer_dest_dir }}/{{ kubeconfig_bundle_name }}"
      - "------------------------------------------------------------------"
      - "Next: on the bastion, run unpack-cluster-access.yaml (which runs"
      - "unpack_kubeconfig_bundle, laying sno_kubeconfig into place for the"
      - "shared roles/ocp/* day-2 roles):"
      - "  ssh -i {{ kubeconfig_transfer_ssh_key }} {{ kubeconfig_transfer_user }}@{{ kubeconfig_transfer_host }}"
      - "  cd <bastion checkout>/playbooks"
      - "  ansible-playbook unpack-cluster-access.yaml -i ../inventory/inventory.yaml"
  when: kubeconfig_transfer_method == 'rsync'
