---
# Must match package_bastion_bundle/package_bastion_rpms_bundle's mirror_installers_dir.
mirror_installers_dir: /opt/mirror-installers

# bastion_rpm_sync_method/bastion_packages/bastion_required_repos are pinned in
# staging/inventory/inventory.yaml (single source, shared with
# configure_bastion_services). reposync (default) mirrors bastion_required_repos
# wholesale; resolve downloads only bastion_packages' dependency closure. See this
# role's README.

# Scratch installroot used by the resolve method to resolve dependencies without
# staging's own packages masking the download. Wiped and recreated every run.
bastion_rpm_resolve_installroot: /tmp/bastion-rpm-resolve-root

# reposync's --setopt=max_parallel_downloads. Tune down if staging's own
# network/disk is the actual bottleneck.
bastion_rpm_reposync_max_parallel_downloads: 10
