---
# Mirrors the bastion's OS-level RPM dependencies on staging, for offline install on
# the bastion. See this role's README for the reposync/resolve methods.
- name: Ensure the installers directory exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  tags: [bastion_prereqs]

- name: Ensure the bastion-rpms directory exists
  file:
    path: "{{ mirror_installers_dir }}/bastion-rpms"
    state: directory
    mode: '0755'
  tags: [bastion_prereqs]

# reposync (default): mirrors bastion_required_repos wholesale.
- name: Mirror the full bastion-required repos for offline install on the bastion (reposync)
  vars:
    _bastion_repo_enable_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
    _bastion_repoid_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--repoid=\\1') | join(' ') }}"
  command: >
    dnf {{ _bastion_repo_enable_flags }} reposync
    {{ _bastion_repoid_flags }}
    --download-path={{ mirror_installers_dir }}/bastion-rpms
    --download-metadata
    --delete
    --setopt=max_parallel_downloads={{ bastion_rpm_reposync_max_parallel_downloads }}
    -y
  become: true
  when: bastion_rpm_sync_method == 'reposync'
  tags: [bastion_prereqs]

# resolve (opt-in): downloads only bastion_packages' own dependency closure. Resolves
# against a fresh installroot (below), not staging's own rpmdb, so an already-
# satisfied dependency on staging isn't silently skipped from the download.

# A custom mountpoint (e.g. a secondary data volume) has no file_contexts pattern of
# its own, so SELinux labels everything under it unlabeled_t/mnt_t — too restrictive
# for rpm --initdb/--installroot. Equivalence to / makes this path's contents get
# labeled as if they really were at that absolute path (the same technique mock's
# own SELinux policy uses for build roots), without needing the customer to relabel
# their whole volume. Skipped if semanage isn't installed, rather than failing.
- name: Check whether SELinux management tooling is available (resolve method only)
  command: which semanage
  register: _semanage_available
  changed_when: false
  failed_when: false
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Give the resolve installroot normal root-filesystem SELinux labeling (resolve method only)
  community.general.sefcontext:
    target: "{{ bastion_rpm_resolve_installroot }}"
    substitute: /
    ftype: a
    state: present
  become: true
  when:
    - bastion_rpm_sync_method == 'resolve'
    - _semanage_available.rc == 0
  tags: [bastion_prereqs]

- name: Wipe and recreate an empty installroot for dependency-closure resolution (resolve method only)
  file:
    path: "{{ bastion_rpm_resolve_installroot }}"
    state: "{{ item }}"
    mode: '0755'
  loop: [absent, directory]
  when: bastion_rpm_sync_method == 'resolve'
  become: true
  tags: [bastion_prereqs]

# Best-effort: the equivalence above should already label new content correctly at
# creation time, this just guards against a stale label surviving from before it was set.
- name: Relabel the installroot to pick up the equivalence (resolve method only)
  command: "restorecon -R {{ bastion_rpm_resolve_installroot }}"
  become: true
  changed_when: false
  failed_when: false
  when:
    - bastion_rpm_sync_method == 'resolve'
    - _semanage_available.rc == 0
  tags: [bastion_prereqs]

- name: Initialize an empty rpm database in the installroot (resolve method only)
  command: "rpm --root {{ bastion_rpm_resolve_installroot }} --initdb"
  when: bastion_rpm_sync_method == 'resolve'
  become: true
  tags: [bastion_prereqs]

- name: Ensure createrepo_c is installed on staging (resolve method only)
  dnf:
    name: createrepo_c
    state: present
    enablerepo: "{{ bastion_required_repos }}"
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Download bastion packages (with full dependency closure) for offline install on the bastion (resolve method only)
  vars:
    _bastion_repo_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
  command: >
    dnf download --resolve --destdir={{ mirror_installers_dir }}/bastion-rpms
    --installroot={{ bastion_rpm_resolve_installroot }}
    --releasever={{ ansible_distribution_major_version }}
    --setopt=reposdir=/etc/yum.repos.d
    {{ _bastion_repo_flags }}
    -y {{ bastion_packages | join(' ') }}
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Generate repo metadata for the downloaded bastion RPMs (resolve method only)
  command: createrepo_c {{ mirror_installers_dir }}/bastion-rpms
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

# Both methods download as root; fix ownership so package_bastion_rpms_bundle's
# hardlink-based bundling can link these files instead of falling back to a copy.
- name: Fix ownership of the downloaded RPMs to match the rest of mirror_installers_dir
  file:
    path: "{{ mirror_installers_dir }}/bastion-rpms"
    state: directory
    recurse: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
  become: true
  tags: [bastion_prereqs]
