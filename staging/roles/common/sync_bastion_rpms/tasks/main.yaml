---
# Split out of stage_mirror_content (2026-11-17) at customer request: the full
# reposync of bastion_required_repos can run 8+ hours on its own, and the customer
# wanted to be able to run/re-run it independently of the hours-long oc-mirror "mirror
# to disk" step — both via this role's own standalone playbook
# (staging/playbooks/sync-bastion-rpms.yaml) and via the bastion_prereqs tag on the
# combined stage-and-package.yaml flow, which still imports this role from
# stage_mirror_content so a normal full run is unaffected.
#
# The bastion has no internet route at all, so configure_bastion_services can't `dnf
# install` dnsmasq/httpd directly there either. Mirrored here instead, on the
# internet-connected staging host, the same way stage_mirror_content mirrors the
# oc-mirror/mirror-registry/openshift-install/oc tool tarballs under
# mirror_installers_dir — package_bastion_rpms_bundle carries this role's output to
# the bastion as its own tar.gz, separate from package_bastion_bundle's main bundle
# (see that role's README for why). Both hosts must run the same RHEL major.minor, so
# RPMs synced here install cleanly there with all other repos disabled.
#
# Two methods, picked by bastion_rpm_sync_method (default reposync) — see
# defaults/main.yaml. Tagged bastion_prereqs (same tag stage_mirror_content used to
# use for this block directly) so a combined stage-and-package.yaml run can still
# target just this role with `--tags bastion_prereqs` — e.g. after adding a new entry
# to bastion_packages, or after switching bastion_rpm_sync_method — without redoing
# the hour-plus oc-mirror run.
- name: Ensure the installers directory exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  tags: [bastion_prereqs]

- name: Ensure the bastion-rpms directory exists
  file:
    path: "{{ mirror_installers_dir }}/bastion-rpms"
    state: directory
    mode: '0755'
  tags: [bastion_prereqs]

# reposync (default): mirrors bastion_required_repos wholesale — every RPM in each
# repo, not just bastion_packages' own dependency closure. A deliberate customer
# choice (confirmed: they explicitly accepted the larger transfer size) after the
# `resolve` method below proved unreliable: `dnf download --resolve` resolves
# dependencies in the context of what's already installed on THIS staging host, so a
# dependency already satisfied here (even transitively) can be silently skipped from
# the download set, even with --resolve — producing an RPM closure that looks
# complete on staging but is missing something offline on the bastion, which starts
# with none of staging's pre-existing packages. reposync mirrors the repos' actual
# RPM sets independent of what's locally installed, so this class of gap can't
# happen — at the cost of pulling everything in both repos, most of which
# bastion_packages will never actually install.
#
# --download-metadata has reposync carry over each repo's own published repodata
# as-is, rather than needing createrepo_c to regenerate it afterward. --delete prunes
# RPMs dropped from the upstream repo on a re-run, so this doesn't just grow forever
# across repeated bastion_prereqs runs. One subdirectory per repoid under
# bastion-rpms/ (reposync's own layout), carried over by package_bastion_rpms_bundle —
# configure_bastion_services enables each as its own local repo on the bastion when
# bastion_rpm_sync_method is reposync (see that role's tasks).
- name: Mirror the full bastion-required repos for offline install on the bastion (reposync)
  vars:
    _bastion_repo_enable_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
    _bastion_repoid_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--repoid=\\1') | join(' ') }}"
  command: >
    dnf {{ _bastion_repo_enable_flags }} reposync
    {{ _bastion_repoid_flags }}
    --download-path={{ mirror_installers_dir }}/bastion-rpms
    --download-metadata
    --delete
    --setopt=max_parallel_downloads={{ bastion_rpm_reposync_max_parallel_downloads }}
    -y
  become: true
  when: bastion_rpm_sync_method == 'reposync'
  tags: [bastion_prereqs]

# resolve (opt-in): the original, narrower approach — downloads only
# bastion_packages' own dependency closure instead of each full repo. Smaller
# transfer than reposync, but confirmed live, twice, as unreliable in its original
# form: plain `dnf download --resolve` resolves dependencies against the rpmdb of
# the root it runs against — by default, THIS host's real one — so any dependency
# already satisfied on staging itself (even transitively, even by something
# unrelated already installed) is silently dropped from the download set. First
# confirmed with git-core; confirmed again with the full apr-util/libapr-1/
# libaprutil-1 chain httpd-core needs (httpd-2.4.63 depsolve failed on the bastion
# with "nothing provides apr-util-1(dbm)... / libapr-1.so.0()... /
# libaprutil-1.so.0()..." — all three already satisfied on staging by something
# else, so --resolve never considered them needed). The bastion starts with none of
# staging's pre-existing packages, so a closure that "resolved cleanly" here can
# still fail to install there.
#
# Fixed by resolving against a brand-new, empty installroot instead of staging's
# real one (below) — a standard dnf technique for exactly this class of problem.
# With no packages "already installed" in that root, nothing is ever treated as
# pre-satisfied, so the downloaded closure is complete regardless of what staging
# itself happens to have installed — the same correctness guarantee reposync gets
# structurally, without reposync's full-repo transfer size. Unverified against a
# live run yet; if a depsolve gap is ever confirmed again after this fix, suspect the
# installroot/releasever/reposdir flags below first, not the --resolve approach
# itself.
#
# `dnf download --resolve` (not `dnf install --downloadonly`, which only downloads
# what it would actually *install* and so skips already-installed packages even
# more aggressively) fetches the named packages and their full dependency closure
# as best it can into a single flat directory, which createrepo_c then turns into
# one real (local-only) dnf repo — configure_bastion_services expects this exact
# single-directory layout when bastion_rpm_sync_method is resolve, as opposed to
# reposync's one-subdirectory-per-repoid layout.
- name: Wipe and recreate an empty installroot for dependency-closure resolution (resolve method only)
  file:
    path: "{{ bastion_rpm_resolve_installroot }}"
    state: "{{ item }}"
    mode: '0755'
  loop: [absent, directory]
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Initialize an empty rpm database in the installroot (resolve method only)
  command: "rpm --root {{ bastion_rpm_resolve_installroot }} --initdb"
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Ensure createrepo_c is installed on staging (resolve method only)
  dnf:
    name: createrepo_c
    state: present
    enablerepo: "{{ bastion_required_repos }}"
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

# --installroot points dependency resolution at the empty rpmdb just initialized
# above instead of staging's real one. --setopt=reposdir keeps dnf reading THIS
# host's real repo definitions (and the entitlement certs those repo files
# reference) — dnf's own default once --installroot is set is to look for repo
# config *inside* the installroot instead, which doesn't exist here.
# --releasever must be set explicitly too, since an empty installroot has no
# /etc/os-release of its own for dnf to detect it from.
- name: Download bastion packages (with full dependency closure) for offline install on the bastion (resolve method only)
  vars:
    _bastion_repo_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
  command: >
    dnf download --resolve --destdir={{ mirror_installers_dir }}/bastion-rpms
    --installroot={{ bastion_rpm_resolve_installroot }}
    --releasever={{ ansible_distribution_major_version }}
    --setopt=reposdir=/etc/yum.repos.d
    {{ _bastion_repo_flags }}
    -y {{ bastion_packages | join(' ') }}
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Generate repo metadata for the downloaded bastion RPMs (resolve method only)
  command: createrepo_c {{ mirror_installers_dir }}/bastion-rpms
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

# Both methods above run with become: true, so every RPM (and, for reposync, each
# repo's repodata) lands owned by root — while everything else under
# mirror_installers_dir is downloaded as the connecting user. Confirmed live: that
# ownership mismatch made package_bastion_bundle's hardlink-based bundling (cp -al)
# fail with "Operation not permitted" on every RPM (the kernel's protected_hardlinks
# protection blocks a non-root user from hard-linking to a file it doesn't own), every
# single run — it still falls back to a real copy there, but fixing ownership here
# keeps package_bastion_rpms_bundle's own hardlink fast-path working for this subset
# too, instead of always paying for a full RPM re-copy on every bundle.
- name: Fix ownership of the downloaded RPMs to match the rest of mirror_installers_dir
  file:
    path: "{{ mirror_installers_dir }}/bastion-rpms"
    state: directory
    recurse: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
  become: true
  tags: [bastion_prereqs]
