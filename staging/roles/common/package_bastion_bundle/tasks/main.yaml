---
# Runs on staging (hosts: localhost), after stage_mirror_content. Builds the single
# self-sufficient artifact the bastion needs: mirrored registry content, the
# openshift-install/oc/oc-mirror/mirror-registry binaries (the bastion has no
# internet route to fetch any of this itself), the entire bastion/ automation tree
# (playbooks + roles — the bastion has no other way to get the code), and a flattened
# resolved-vars file carrying every per-environment value out of
# staging/inventory/inventory.yaml.
#
# This replaces the old sync_mirror_to_bastion role's rsync-with-cross-host-polling
# dance entirely. That complexity only existed because a single Ansible controller
# used to orchestrate both the mirror-staging host and the bastion in one play; now
# staging only ever acts on itself and (optionally) pushes outward, so there's no
# cross-host delegation left to manage.
- name: Ensure the bundle export directory exists
  file:
    path: "{{ bastion_bundle_export_dir }}"
    state: directory
    mode: '0755'

- name: Render the flattened per-environment vars file for the bastion
  template:
    src: bastion-resolved-vars.yaml.j2
    dest: "{{ bastion_bundle_export_dir }}/bastion-resolved-vars.yaml"
    mode: '0600'

- name: Confirm the bastion/ tree is present to bundle
  stat:
    path: "{{ bastion_tree_dir }}"
  register: _bastion_tree_stat

- name: Fail fast if the bastion/ tree can't be found
  fail:
    msg: >
      bastion_tree_dir ({{ bastion_tree_dir }}) doesn't exist. package_bastion_bundle
      needs the sibling bastion/ checkout to bundle it alongside the mirrored
      content — set bastion_tree_dir explicitly if staging/ and bastion/ aren't
      siblings in this checkout.
  when: not _bastion_tree_stat.stat.exists

# Staged into one directory first (rather than a multi-source `archive:` call) so the
# resulting tar.gz extracts cleanly at the bastion checkout's root with predictable
# top-level entries (bastion/, mirror-content/, mirror-installers/, release-cache/, relay-key,
# bastion-resolved-vars.yaml) regardless of each source's own absolute path.
#
# NOT wiped (state: absent) before re-populating, unlike an earlier version of this
# task — mirror-content alone is tens of GB, and wiping bundle-root first meant the
# copies below could never benefit from any idempotency at all: every single run
# recopied the entire archive from scratch, even using `copy`'s own per-file checksum
# skip, since the destination never had anything to compare against. Worse than the
# equivalent gap already fixed in unpack_bastion_bundle (confirmed by comparing the
# two): that one was merely slow to re-verify unchanged files; this one guaranteed a
# full re-copy by construction. ansible.posix.synchronize (rsync) below instead
# diffs against whatever's already in bundle-root from a previous run and only
# transfers what's missing/changed, with delete: true to prune anything stale (e.g.
# content removed from a refreshed mirror).
- name: Ensure the staging-root directory exists for assembling the bundle contents
  file:
    path: "{{ bastion_bundle_export_dir }}/bundle-root"
    state: directory
    mode: '0755'

- name: Copy the bastion/ automation tree into the bundle root
  ansible.posix.synchronize:
    src: "{{ bastion_tree_dir }}/"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/bastion/"
    recursive: true
    delete: true

# rsync_opts excludes stage_mirror_content's own "mirror to disk" scratch output up
# front, rather than copying it and deleting it from the copy afterward (the previous
# approach, forced by ansible.builtin.copy having no --exclude) — deploy_mirror_registry's
# "disk to mirror" push never reads it; it regenerates its own working-dir from the
# tar chunks. delete: true still prunes it from bundle-root if an older bundle (from
# before this exclusion existed) already has a copy sitting there.
- name: Copy the mirrored content archive into the bundle root
  ansible.posix.synchronize:
    src: "{{ mirror_sync_source_dir }}/"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/mirror-content/"
    recursive: true
    delete: true
    rsync_opts:
      - "--exclude=working-dir"

- name: Copy the installer tarballs (oc-mirror, mirror-registry, openshift-install, oc) into the bundle root
  ansible.posix.synchronize:
    src: "{{ mirror_installers_dir }}/"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/mirror-installers/"
    recursive: true
    delete: true

# stage_mirror_content's "Build the release-content cache handoff" task populates
# this — the minimal oc-mirror cache subset deploy_mirror_registry's disk-to-mirror
# step needs, since the archive above doesn't carry this content on its own (see that
# task's comment for the full "manifest unknown" story, confirmed live).
- name: Copy the release-content cache handoff into the bundle root
  ansible.posix.synchronize:
    src: "{{ release_cache_handoff_dir }}/"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/release-cache/"
    recursive: true
    delete: true

- name: Copy the flattened resolved-vars file into the bundle root
  copy:
    src: "{{ bastion_bundle_export_dir }}/bastion-resolved-vars.yaml"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/bastion-resolved-vars.yaml"
    mode: '0600'
    remote_src: true

# The bastion needs its own copy of the operator's private key for the one
# return-trip rsync push it can originate (package_staging_bundle's backup-export
# relay, §8) — unlike the bastion_transfer_* push below, which runs FROM staging,
# where this key already lives on disk. unpack_bastion_bundle copies this to the
# path bastion-resolved-vars.yaml's ssh_private_key points at.
- name: Stage the SSH private key into the bundle root for the bastion's own return-trip pushes
  copy:
    src: "{{ ssh_private_key }}"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/relay-key"
    mode: '0600'
    remote_src: true

- name: Archive the assembled bundle root into one tar.gz
  archive:
    path: "{{ bastion_bundle_export_dir }}/bundle-root/*"
    dest: "{{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}"
    format: gz

# A physical-media (or even rsync, over an imperfect link) transfer of a tens-of-GB
# file has no inherent integrity check of its own — `tar -xzf` on a truncated or
# bit-flipped archive can fail loudly, but can also partially succeed with silently
# corrupted content depending on where the damage lands. Computed with `chdir` (not
# an absolute path) so the checksum file records just the bare filename, matching
# what `sha256sum -c` expects to find next to it on the bastion regardless of
# whatever absolute path it lands at there. unpack_bastion_bundle verifies this
# automatically before trusting the extracted contents — see that role's README.
- name: Compute a sha256 checksum of the bundle for the bastion to verify after transfer
  command: "sha256sum {{ bastion_bundle_name }}"
  args:
    chdir: "{{ bastion_bundle_export_dir }}"
  register: _bastion_bundle_checksum
  changed_when: false

- name: Write the checksum file alongside the bundle
  copy:
    content: "{{ _bastion_bundle_checksum.stdout }}\n"
    dest: "{{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256"
    mode: '0644'

- name: Report the media-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "Bundle packaged"
      - "=================================================================="
      - "Location: {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}"
      - "Checksum: {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256"
      - "------------------------------------------------------------------"
      - "Next: copy BOTH files to removable media (unpack_bastion_bundle verifies the"
      - "tar.gz against the .sha256 file automatically, but only if it's present"
      - "alongside the tar.gz), carry them to the bastion, and extract into an empty"
      - "working directory there:"
      - "  mkdir -p ~/sno-deploy"
      - "  tar -xzf {{ bastion_bundle_name }} -C ~/sno-deploy"
      - "It unpacks to bastion/, mirror-content/, mirror-installers/, release-cache/, relay-key, and"
      - "bastion-resolved-vars.yaml — a complete, self-sufficient checkout. Then:"
      - "  cd ~/sno-deploy/bastion/playbooks"
      - "  ansible-playbook provision-sno.yaml -i ../inventory/inventory.yaml"
      - "Once that completes, delete the tar.gz itself (rm ~/{{ bastion_bundle_name }}) —"
      - "unpack_bastion_bundle already cleans up its own extracted copy, but not the"
      - "original archive, which is tens of GB and can fill the bastion's disk on repeat runs."
  when: bastion_transfer_method == 'media'

- name: Stage the SSH private key here for the rsync push to the bastion
  copy:
    src: "{{ bastion_transfer_ssh_key }}"
    dest: "/tmp/.bastion_bundle_transfer_key"
    mode: '0600'
    remote_src: true
  when: bastion_transfer_method == 'rsync'

- name: Fail fast if rsync transfer was requested without a target host
  fail:
    msg: "bastion_transfer_method is 'rsync' but bastion_transfer_host is unset."
  when:
    - bastion_transfer_method == 'rsync'
    - not bastion_transfer_host

# One-directional push FROM staging (the only side acting) — no delegate_to dance
# needed, unlike the old sync_mirror_to_bastion role: there's no single controller
# spanning both hosts anymore for the module to get confused about which side is
# "local".
- name: Rsync the bundle (and its checksum file) to the bastion
  command: >
    rsync -a
    --rsh="ssh -i /tmp/.bastion_bundle_transfer_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}
    {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256
    {{ bastion_transfer_user }}@{{ bastion_transfer_host }}:{{ bastion_transfer_dest_dir }}/
  when: bastion_transfer_method == 'rsync'

- name: Remove the staged relay key
  file:
    path: "/tmp/.bastion_bundle_transfer_key"
    state: absent
  when: bastion_transfer_method == 'rsync'

- name: Report the rsync-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "Bundle pushed to the bastion"
      - "=================================================================="
      - "Destination: {{ bastion_transfer_user }}@{{ bastion_transfer_host }}:{{ bastion_transfer_dest_dir }}/{{ bastion_bundle_name }}"
      - "(.sha256 checksum file pushed alongside it — unpack_bastion_bundle verifies"
      - "the tar.gz against it automatically, but only if it's still present"
      - "alongside the tar.gz when the playbook runs.)"
      - "------------------------------------------------------------------"
      - "Next: SSH to the bastion, extract the bundle into an empty working"
      - "directory, and run the provision playbook:"
      - "  ssh -i {{ bastion_transfer_ssh_key }} {{ bastion_transfer_user }}@{{ bastion_transfer_host }}"
      - "  mkdir -p ~/sno-deploy"
      - "  tar -xzf ~/{{ bastion_bundle_name }} -C ~/sno-deploy"
      - "  cd ~/sno-deploy/bastion/playbooks"
      - "  ansible-playbook provision-sno.yaml -i ../inventory/inventory.yaml"
      - "Once that completes, delete the tar.gz itself (rm ~/{{ bastion_bundle_name }}) —"
      - "unpack_bastion_bundle already cleans up its own extracted copy, but not the"
      - "original archive, which is tens of GB and can fill the bastion's disk on repeat runs."
  when: bastion_transfer_method == 'rsync'
