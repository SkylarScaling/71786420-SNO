---
# Runs on staging (hosts: localhost), after stage_mirror_content. Builds the single
# self-sufficient artifact the bastion needs: mirrored registry content, the
# openshift-install/oc/oc-mirror/mirror-registry binaries (the bastion has no
# internet route to fetch any of this itself), the entire bastion/ automation tree
# (playbooks + roles — the bastion has no other way to get the code), and a flattened
# resolved-vars file carrying every per-environment value out of
# staging/inventory/inventory.yaml.
#
# This replaces the old sync_mirror_to_bastion role's rsync-with-cross-host-polling
# dance entirely. That complexity only existed because a single Ansible controller
# used to orchestrate both the mirror-staging host and the bastion in one play; now
# staging only ever acts on itself and (optionally) pushes outward, so there's no
# cross-host delegation left to manage.
- name: Ensure the bundle export directory exists
  file:
    path: "{{ bastion_bundle_export_dir }}"
    state: directory
    mode: '0755'

# The intent is still that bastion-resolved-vars.yaml.j2's hand-listed vars (plus
# _stage_mirror_bastion_facing_vars below) are kept up to date as the actual,
# reviewable, complete list of what's supposed to reach the bastion — this task isn't
# a substitute for that upkeep. _stage_mirror_bastion_facing_vars IS that permanent
# list for stage_mirror_content specifically: when a new stage_mirror_content var
# becomes a real, permanent part of the bastion contract (not a staging-local path —
# see below), add its name there deliberately, the same way you'd add a new var to
# the hand-listed set above.
#
# What this task actually solves is the *testing* gap confirmed live: a customer's
# bastion_rpm_sync_method override had no effect on the bastion at all, because
# nobody had yet added it to that permanent list — exactly the lag this is meant to
# cover for, not replace. Separately, _inventory_only_vars exists purely so an
# operator can add a brand-new ad-hoc var directly to inventory.yaml for
# one-off/iterative testing (no role default anywhere yet) and have it reach the
# bastion immediately, without a code change — if that var turns out to be a
# permanent fixture rather than a one-off test, it should still be migrated into the
# explicit list (template or _stage_mirror_bastion_facing_vars) afterward rather than
# left to ride along on this fallback indefinitely.
#
# Deliberately NOT a whole-file dump of stage_mirror_content's defaults: most of that
# file is staging-local storage paths/URLs that must stay independent per host (see
# the CAUTION comment at the top of inventory.yaml) — stage_mirror_content's own
# oc_mirror_workspace/mirror_installers_dir/etc. have their own independent defaults
# on the bastion side by design, and auto-including those would silently push
# staging's absolute paths onto the bastion. _explicit_template_vars excludes
# anything bastion-resolved-vars.yaml.j2 already hand-lists below, so nothing gets
# emitted twice.
- name: Determine which extra vars need to reach the bastion beyond the hand-listed ones
  vars:
    _stage_mirror_bastion_facing_vars:
      - bastion_rpm_sync_method
      - bastion_packages
      - bastion_required_repos
    _explicit_template_vars:
      - cluster_name
      - openshift_version
      - infra_provider
      - base_domain
      - ssh_key
      - ssh_private_key
      - pull_secret
      - tmp_dir
      - install_dir
      - sno_kubeconfig
      - machine_network_cidr
      - cluster_network_cidr
      - service_network_cidr
      - bmc_address
      - bmc_username
      - bmc_password
      - iso_http_url
      - rendezvous_ip
      - sno_mac_address
      - default_gateway
      - dns_server
      - ntp_server
      - sno_network_topology
      - sno_interface_name_secondary
      - sno_mac_address_secondary
      - lvms_device_paths
      - metallb_address_pool
      - alert_smtp_host
      - alert_email_to
      - mirror_registry_quay_hostname
      - mirror_registry_quay_port
      - backup_s3_bucket
      - backup_egress_mode
      - backup_external_s3_endpoint
      - backup_external_s3_bucket
      - backup_external_s3_access_key
      - backup_external_s3_secret_key
      - log_forward_endpoint
    _inventory_only_vars: "{{ (lookup('file', inventory_file) | from_yaml).all.vars.keys() | list }}"
  set_fact:
    _bastion_extra_var_names: >-
      {{
        (_stage_mirror_bastion_facing_vars + _inventory_only_vars)
        | difference(_explicit_template_vars)
        | unique
      }}

# lookup('vars', ...), not the vars[item] dict-subscript form — the latter is
# deprecated as of ansible-core 2.21 (confirmed live, "The internal 'vars' dictionary
# is deprecated... Use the `vars` and `varnames` lookups instead") and removed
# entirely in 2.24.
- name: Resolve the actual (precedence-correct) value for each extra var
  set_fact:
    _bastion_extra_vars: "{{ _bastion_extra_vars | default({}) | combine({item: lookup('vars', item)}) }}"
  loop: "{{ _bastion_extra_var_names }}"
  loop_control:
    label: "{{ item }}"
  when: lookup('vars', item, default=None) is not none

- name: Render the flattened per-environment vars file for the bastion
  template:
    src: bastion-resolved-vars.yaml.j2
    dest: "{{ bastion_bundle_export_dir }}/bastion-resolved-vars.yaml"
    mode: '0600'

- name: Confirm the bastion/ tree is present to bundle
  stat:
    path: "{{ bastion_tree_dir }}"
  register: _bastion_tree_stat

- name: Fail fast if the bastion/ tree can't be found
  fail:
    msg: >
      bastion_tree_dir ({{ bastion_tree_dir }}) doesn't exist. package_bastion_bundle
      needs the sibling bastion/ checkout to bundle it alongside the mirrored
      content — set bastion_tree_dir explicitly if staging/ and bastion/ aren't
      siblings in this checkout.
  when: not _bastion_tree_stat.stat.exists

# Staged into one directory first (rather than a multi-source `archive:` call) so the
# resulting tar.gz extracts cleanly at the bastion checkout's root with predictable
# top-level entries (bastion/, mirror-content/, mirror-installers/, release-cache/, relay-key,
# bastion-resolved-vars.yaml) regardless of each source's own absolute path.
- name: Ensure a clean staging-root directory for assembling the bundle contents
  file:
    path: "{{ bastion_bundle_export_dir }}/bundle-root"
    state: "{{ item }}"
    mode: '0755'
  loop: [absent, directory]

# Hardlinked, not copied: bastion_tree_dir/mirror_sync_source_dir/mirror_installers_dir/
# release_cache_handoff_dir and bastion_bundle_export_dir are all expected to be on the
# same root filesystem (confirmed on this host — single storage device, no separate
# mounts for these paths). Confirmed live: a real run's mirrored content alone was
# ~100GiB — a second physical copy of that into bundle-root via rsync, on top of the
# oc-mirror workspace it was copied from, was what actually exhausted a 250GB volume
# before the final tar.gz was even written. `cp -al` costs ~0 extra disk since this
# content is read-only mirror/installer output never modified in place, and is cheap
# enough to redo from scratch every run (wiping bundle-root above first) instead of
# needing rsync's incremental diff/--delete to stay fast — the previous approach's
# "don't wipe, diff instead" trade-off existed specifically because a real copy of
# tens of GB was too slow to redo every run; that constraint doesn't apply once the
# copy is just hardlinks.
#
# Falls back to a real copy (`cp -an`, not `cp -a`) for whatever `cp -al` couldn't
# hardlink — either because it's run across a mount boundary (e.g.
# bastion_bundle_export_dir or oc_mirror_workspace overridden onto a different
# filesystem), or because the source has mixed ownership (bastion-rpms/*.rpm can end
# up root-owned since stage_mirror_content downloads them with `become: true`, and the
# kernel's protected_hardlinks protection blocks hard-linking to a file you don't own
# even on the same filesystem). `-n`/--no-clobber, not plain `-a`, matters here: `cp
# -al` processes every file before reporting one combined failure, so by the time the
# fallback runs, some files are often already correctly hardlinked — plain `cp -a`
# would then refuse with "are the same file" (source and destination are the same
# inode) and fail the whole fallback too; `-n` skips those silently and only actually
# copies what's still missing.
- name: Copy the bastion/ automation tree into the bundle root
  shell: >
    mkdir -p "{{ bastion_bundle_export_dir }}/bundle-root/bastion" &&
    (cp -al "{{ bastion_tree_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/bastion/"
    || cp -an "{{ bastion_tree_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/bastion/")
  changed_when: true

# Same exclusion the old rsync-based copy applied: stage_mirror_content's own "mirror
# to disk" scratch output, which deploy_mirror_registry's "disk to mirror" push never
# reads (it regenerates its own working-dir from the tar chunks) — `cp` has no
# --exclude, so this is removed right after instead. Hardlinked, not copied — see the
# comment above the bastion/ tree copy for why.
- name: Copy the mirrored content archive into the bundle root
  shell: >
    mkdir -p "{{ bastion_bundle_export_dir }}/bundle-root/mirror-content" &&
    (cp -al "{{ mirror_sync_source_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/mirror-content/"
    || cp -an "{{ mirror_sync_source_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/mirror-content/")
  changed_when: true

- name: Remove the oc-mirror working-dir scratch output from the bundled copy (not needed on the bastion)
  file:
    path: "{{ bastion_bundle_export_dir }}/bundle-root/mirror-content/working-dir"
    state: absent

# Hardlinked, not copied — see the comment above the bastion/ tree copy for why.
- name: Copy the installer tarballs (oc-mirror, mirror-registry, openshift-install, oc) into the bundle root
  shell: >
    mkdir -p "{{ bastion_bundle_export_dir }}/bundle-root/mirror-installers" &&
    (cp -al "{{ mirror_installers_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/mirror-installers/"
    || cp -an "{{ mirror_installers_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/mirror-installers/")
  changed_when: true

# stage_mirror_content's "Build the cache handoff" task populates
# this — the minimal oc-mirror cache subset deploy_mirror_registry's disk-to-mirror
# step needs, since the archive above doesn't carry this content on its own (see that
# task's comment for the full "manifest unknown" story, confirmed live). Hardlinked,
# not copied — see the comment above the bastion/ tree copy for why.
- name: Copy the release-content cache handoff into the bundle root
  shell: >
    mkdir -p "{{ bastion_bundle_export_dir }}/bundle-root/release-cache" &&
    (cp -al "{{ release_cache_handoff_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/release-cache/"
    || cp -an "{{ release_cache_handoff_dir }}/." "{{ bastion_bundle_export_dir }}/bundle-root/release-cache/")
  changed_when: true

- name: Copy the flattened resolved-vars file into the bundle root
  copy:
    src: "{{ bastion_bundle_export_dir }}/bastion-resolved-vars.yaml"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/bastion-resolved-vars.yaml"
    mode: '0600'
    remote_src: true

# The bastion needs its own copy of the operator's private key for the one
# return-trip rsync push it can originate (package_staging_bundle's backup-export
# relay, §8) — unlike the bastion_transfer_* push below, which runs FROM staging,
# where this key already lives on disk. unpack_bastion_bundle copies this to the
# path bastion-resolved-vars.yaml's ssh_private_key points at.
- name: Stage the SSH private key into the bundle root for the bastion's own return-trip pushes
  copy:
    src: "{{ ssh_private_key }}"
    dest: "{{ bastion_bundle_export_dir }}/bundle-root/relay-key"
    mode: '0600'
    remote_src: true

- name: Archive the assembled bundle root into one tar.gz
  archive:
    path: "{{ bastion_bundle_export_dir }}/bundle-root/*"
    dest: "{{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}"
    format: gz

# A physical-media (or even rsync, over an imperfect link) transfer of a tens-of-GB
# file has no inherent integrity check of its own — `tar -xzf` on a truncated or
# bit-flipped archive can fail loudly, but can also partially succeed with silently
# corrupted content depending on where the damage lands. Computed with `chdir` (not
# an absolute path) so the checksum file records just the bare filename, matching
# what `sha256sum -c` expects to find next to it on the bastion regardless of
# whatever absolute path it lands at there. unpack_bastion_bundle verifies this
# automatically before trusting the extracted contents — see that role's README.
- name: Compute a sha256 checksum of the bundle for the bastion to verify after transfer
  command: "sha256sum {{ bastion_bundle_name }}"
  args:
    chdir: "{{ bastion_bundle_export_dir }}"
  register: _bastion_bundle_checksum
  changed_when: false

- name: Write the checksum file alongside the bundle
  copy:
    content: "{{ _bastion_bundle_checksum.stdout }}\n"
    dest: "{{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256"
    mode: '0644'

- name: Report the media-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "Bundle packaged"
      - "=================================================================="
      - "Location: {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}"
      - "Checksum: {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256"
      - "------------------------------------------------------------------"
      - "Next: copy BOTH files to removable media (unpack_bastion_bundle verifies the"
      - "tar.gz against the .sha256 file automatically, but only if it's present"
      - "alongside the tar.gz), carry them to the bastion, and extract into an empty"
      - "working directory there:"
      - "  mkdir -p ~/sno-deploy"
      - "  tar -xzf {{ bastion_bundle_name }} -C ~/sno-deploy"
      - "It unpacks to bastion/, mirror-content/, mirror-installers/, release-cache/, relay-key, and"
      - "bastion-resolved-vars.yaml — a complete, self-sufficient checkout. Then:"
      - "  cd ~/sno-deploy/bastion/playbooks"
      - "  ansible-playbook provision-sno.yaml -i ../inventory/inventory.yaml"
      - "Once that completes, delete the tar.gz itself (rm ~/{{ bastion_bundle_name }}) —"
      - "unpack_bastion_bundle already cleans up its own extracted copy, but not the"
      - "original archive, which is tens of GB and can fill the bastion's disk on repeat runs."
  when: bastion_transfer_method == 'media'

- name: Stage the SSH private key here for the rsync push to the bastion
  copy:
    src: "{{ bastion_transfer_ssh_key }}"
    dest: "/tmp/.bastion_bundle_transfer_key"
    mode: '0600'
    remote_src: true
  when: bastion_transfer_method == 'rsync'

- name: Fail fast if rsync transfer was requested without a target host
  fail:
    msg: "bastion_transfer_method is 'rsync' but bastion_transfer_host is unset."
  when:
    - bastion_transfer_method == 'rsync'
    - not bastion_transfer_host

# One-directional push FROM staging (the only side acting) — no delegate_to dance
# needed, unlike the old sync_mirror_to_bastion role: there's no single controller
# spanning both hosts anymore for the module to get confused about which side is
# "local".
- name: Rsync the bundle (and its checksum file) to the bastion
  command: >
    rsync -a
    --rsh="ssh -i /tmp/.bastion_bundle_transfer_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}
    {{ bastion_bundle_export_dir }}/{{ bastion_bundle_name }}.sha256
    {{ bastion_transfer_user }}@{{ bastion_transfer_host }}:{{ bastion_transfer_dest_dir }}/
  when: bastion_transfer_method == 'rsync'

- name: Remove the staged relay key
  file:
    path: "/tmp/.bastion_bundle_transfer_key"
    state: absent
  when: bastion_transfer_method == 'rsync'

- name: Report the rsync-transfer next step
  debug:
    msg:
      - "=================================================================="
      - "Bundle pushed to the bastion"
      - "=================================================================="
      - "Destination: {{ bastion_transfer_user }}@{{ bastion_transfer_host }}:{{ bastion_transfer_dest_dir }}/{{ bastion_bundle_name }}"
      - "(.sha256 checksum file pushed alongside it — unpack_bastion_bundle verifies"
      - "the tar.gz against it automatically, but only if it's still present"
      - "alongside the tar.gz when the playbook runs.)"
      - "------------------------------------------------------------------"
      - "Next: SSH to the bastion, extract the bundle into an empty working"
      - "directory, and run the provision playbook:"
      - "  ssh -i {{ bastion_transfer_ssh_key }} {{ bastion_transfer_user }}@{{ bastion_transfer_host }}"
      - "  mkdir -p ~/sno-deploy"
      - "  tar -xzf ~/{{ bastion_bundle_name }} -C ~/sno-deploy"
      - "  cd ~/sno-deploy/bastion/playbooks"
      - "  ansible-playbook provision-sno.yaml -i ../inventory/inventory.yaml"
      - "Once that completes, delete the tar.gz itself (rm ~/{{ bastion_bundle_name }}) —"
      - "unpack_bastion_bundle already cleans up its own extracted copy, but not the"
      - "original archive, which is tens of GB and can fill the bastion's disk on repeat runs."
  when: bastion_transfer_method == 'rsync'
