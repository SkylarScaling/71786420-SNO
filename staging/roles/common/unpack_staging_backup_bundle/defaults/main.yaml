---
# Where the bastion-produced backup bundle lands on staging once physically copied
# (or rsynced) over. Default assumes the operator extracted (or will extract) the
# tar.gz into this directory — point this at the actual tar.gz path if extracting
# manually isn't desired; this role extracts it itself when given a file.
staging_backup_bundle_path: "~/sno-staging-backup-bundle.tar.gz"

# Same default path push_backup_to_external_s3 reads from (role defaults aren't
# shared across roles, so duplicated rather than centralized).
backup_push_source_dir: /opt/backup-export-staged
