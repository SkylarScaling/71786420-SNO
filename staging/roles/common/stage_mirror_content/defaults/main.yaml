---
# CAUTION: every *_dir path here is overridden (if at all) from
# staging/inventory/inventory.yaml, evaluated on staging — a separate machine from
# the bastion with a possibly different storage layout. See inventory.yaml's own
# caution comment before overriding.

# Produces an oc-mirror archive ("mirror to disk") on the internet-connected staging
# host; no registry runs here.
oc_mirror_workspace: /opt/oc-mirror-workspace

# Minimal oc-mirror cache subset deploy_mirror_registry needs on the bastion to
# resolve release-component images during its "disk to mirror" step. Same default
# path duplicated in package_bastion_bundle (role defaults aren't shared).
release_cache_handoff_dir: "{{ oc_mirror_workspace }}/release-cache-handoff"

# openshift/<name> repos always force-included in the cache handoff — 100%
# reproducible gaps, not the intermittent defect the archive-gap scan/retry exists
# to catch. See tasks/main.yaml's "Build the cache handoff" task and this role's
# README.
release_cache_repo_names:
  - release
  - release-images

bin_dir: "~/.local/bin"
ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}"

# oc-mirror/mirror-registry tarballs land here so package_bastion_bundle can carry
# them to the bastion — it has no internet route to fetch them itself. Same default
# path duplicated in package_bastion_bundle/unpack_bastion_bundle/
# deploy_mirror_registry (role defaults aren't shared).
mirror_installers_dir: /opt/mirror-installers

# Hard kill timeout for the async "mirror to disk" job. Raised from 14400 (4h) after
# a real customer run needed to double it — likely because the self-heal retry below
# reuses this same ceiling, so a run that triggers it pays for two oc-mirror
# invocations against one timeout sized for one.
oc_mirror_job_timeout: 28800

# Retry/timeout tuning for transient pull failures mid-mirror — confirmed live fix.
# Applied to both the primary run and the self-heal retry below.
oc_mirror_retry_times: 5
oc_mirror_retry_delay: 30s
oc_mirror_image_timeout: 30m

# Async-job poll interval (seconds) — safe to keep short now that polling is a
# bounded loop, not the old self-recursive include_tasks that hit Ansible's max
# recursion depth on a real multi-hour run. See tasks/main.yaml.
oc_mirror_poll_interval: 60

# Red Hat moved mirror-registry behind developers.redhat.com/content-gateway with an
# architecture-qualified filename; the old mirror.openshift.com URL 404s and the
# gateway's "latest" alias 400s without a cookie. Pin the version and re-verify
# against https://mirror.openshift.com/pub/cgw/mirror-registry/ periodically.
mirror_registry_version: "2.0.12"
mirror_registry_url: "https://developers.redhat.com/content-gateway/file/pub/cgw/mirror-registry/{{ mirror_registry_version }}/mirror-registry-amd64.tar.gz"

# Bare string = default catalog/channel; dict = { name, channel?, catalog? }
# (redhat|certified|community|marketplace, default redhat).
#
# EVERY pinned `channel` here MUST be updated together with the matching
# roles/ocp/configure_*'s own `*_channel` default — this list controls what
# oc-mirror fetches on staging, that default controls what the Subscription
# requests on the bastion. A mismatch doesn't fail obviously: if the role's channel
# was never mirrored, the Subscription just sits pending; if this file's pin goes
# stale first, oc-mirror itself fails (confirmed live: loki-operator's stable-6.6).
# Treat every pinned entry as a two-file edit.
#
# loki-operator/grafana-operator/rabbitmq-cluster-operator/crunchy-postgres-operator
# channels confirmed via `oc-mirror list operators --v1 --catalog <index>[:vX.Y]
# [--package <name>]` for openshift_version 4.22 — these drift with catalog
# refreshes even without a version bump; re-verify periodically, don't assume a pin
# still exists.
#
# imageset-config.yaml.j2 also sets `defaultChannel` alongside `channels` — oc-mirror
# v2 otherwise validates the catalog's current default channel even when it isn't
# being mirrored, so a catalog-side default move alone broke mirroring outright.
# `defaultChannel` only needs to be one of the kept channels, not the catalog's
# actual default.
oc_mirror_operator_packages:
  - lvms-operator
  - redhat-oadp-operator
  - cluster-logging
  # odf-operator is a meta-operator that installs these sub-packages via its own
  # generated Subscriptions — all must be mirrored explicitly, each pinned to the
  # same channel odf-operator itself requests. Don't trim, even the Ceph-sounding
  # ones — see configure_mcg's README ("Why odf-operator needs so many sub-packages
  # mirrored") for the full explanation and live-confirmed error.
  - { name: odf-operator, channel: stable-4.22 }                              # configure_mcg
  - { name: ocs-operator, channel: stable-4.22 }                              # configure_mcg — odf-operator sub-package
  - { name: mcg-operator, channel: stable-4.22 }                              # configure_mcg — odf-operator sub-package
  - { name: rook-ceph-operator, channel: stable-4.22 }                        # configure_mcg — odf-operator sub-package
  - { name: odf-csi-addons-operator, channel: stable-4.22 }                   # configure_mcg — odf-operator sub-package
  - { name: cephcsi-operator, channel: stable-4.22 }                          # configure_mcg — odf-operator sub-package
  - { name: odf-dependencies, channel: stable-4.22 }                         # configure_mcg — odf-operator sub-package
  - { name: odf-prometheus-operator, channel: stable-4.22 }                   # configure_mcg — odf-operator sub-package
  - { name: recipe, channel: stable-4.22 }                                   # configure_mcg — odf-operator sub-package
  - { name: ocs-client-operator, channel: stable-4.22 }                       # configure_mcg — odf-operator sub-package
  - { name: ocs-tls-profiles, channel: stable-4.22 }                         # configure_mcg — odf-operator sub-package
  - { name: odf-external-snapshotter-operator, channel: stable-4.22 }        # configure_mcg — odf-operator sub-package
  - { name: loki-operator, channel: stable-6.7 }                              # configure_lokistack — pinned for openshift_version 4.22, re-verify on upgrade
  - { name: grafana-operator, catalog: community, channel: v5 }               # configure_grafana — not in redhat-operator-index
  - opentelemetry-product                                                     # configure_opentelemetry
  - tempo-product                                                             # configure_opentelemetry
  - metallb-operator                                                          # configure_metallb
  - { name: rabbitmq-cluster-operator, catalog: community, channel: stable }  # configure_rabbitmq — not in redhat-operator-index
  - { name: crunchy-postgres-operator, catalog: certified, channel: v5 }      # configure_postgres — not in redhat-operator-index
  - rhbk-operator                                                             # configure_keycloak
  - { name: quay-operator, channel: stable-3.13 }                             # configure_onprem_quay — pinned, not catalog default

# Plain (non-operator) images mirrored alongside the operator catalogs above —
# rendered into imageset-config.yaml's additionalImages list verbatim, one `name:`
# entry per image. Override/extend per-environment.
oc_mirror_additional_images:
  - registry.redhat.io/rhel10/support-tools:1786467197
  - registry.redhat.io/rhel10/rhel-guest-image:latest
  - registry.access.redhat.com/ubi9/python-312:9.8-1786510252
