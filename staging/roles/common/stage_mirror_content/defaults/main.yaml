---
# CAUTION: every *_dir path here is overridden (if at all) from
# staging/inventory/inventory.yaml, evaluated on staging — a separate machine from
# the bastion with a possibly different storage layout. See inventory.yaml's own
# caution comment before overriding.

# Produces an oc-mirror archive ("mirror to disk") on the internet-connected staging
# host; no registry runs here.
oc_mirror_workspace: /opt/oc-mirror-workspace

# Minimal oc-mirror cache subset deploy_mirror_registry needs on the bastion to
# resolve release-component images during its "disk to mirror" step. Same default
# path duplicated in package_bastion_bundle (role defaults aren't shared).
release_cache_handoff_dir: "{{ oc_mirror_workspace }}/release-cache-handoff"

# openshift/<name> repos always force-included in the cache handoff — 100%
# reproducible gaps, not the intermittent defect the archive-gap scan/retry exists
# to catch. See tasks/main.yaml's "Build the cache handoff" task and this role's
# README.
release_cache_repo_names:
  - release
  - release-images

bin_dir: "~/.local/bin"
ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}"

# oc-mirror/mirror-registry tarballs land here so package_bastion_bundle can carry
# them to the bastion — it has no internet route to fetch them itself. Same default
# path duplicated in package_bastion_bundle/unpack_bastion_bundle/
# deploy_mirror_registry (role defaults aren't shared).
mirror_installers_dir: /opt/mirror-installers

# Hard kill timeout for the async "mirror to disk" job. Raised from 14400 (4h) after
# a real customer run needed to double it — likely because the self-heal retry below
# reuses this same ceiling, so a run that triggers it pays for two oc-mirror
# invocations against one timeout sized for one.
oc_mirror_job_timeout: 28800

# Retry/timeout tuning for transient pull failures mid-mirror — confirmed live fix.
# Applied to both the primary run and the self-heal retry below.
oc_mirror_retry_times: 5
oc_mirror_retry_delay: 30s
oc_mirror_image_timeout: 30m

# Async-job poll interval (seconds) — safe to keep short now that polling is a
# bounded loop, not the old self-recursive include_tasks that hit Ansible's max
# recursion depth on a real multi-hour run. See tasks/main.yaml.
oc_mirror_poll_interval: 60

# Red Hat moved mirror-registry behind developers.redhat.com/content-gateway with an
# architecture-qualified filename; the old mirror.openshift.com URL 404s and the
# gateway's "latest" alias 400s without a cookie. mirror_registry_version is pinned in
# staging/inventory/inventory.yaml (single source, re-verify against
# https://mirror.openshift.com/pub/cgw/mirror-registry/ periodically).
mirror_registry_url: "https://developers.redhat.com/content-gateway/file/pub/cgw/mirror-registry/{{ mirror_registry_version }}/mirror-registry-amd64.tar.gz"

# Bare string = default catalog/channel; dict = { name, channel?, catalog? }
# (redhat|certified|community|marketplace, default redhat).
#
# Channel/catalog values come from staging/inventory/inventory.yaml's
# operator_catalog/odf_sub_packages — single source shared with each matching
# roles/ocp/configure_*'s own `*_channel`/`*_catalog_source` default. Update
# inventory.yaml only; don't reintroduce a literal pin here.
#
# imageset-config.yaml.j2 also sets `defaultChannel` alongside `channels` — oc-mirror
# v2 otherwise validates the catalog's current default channel even when it isn't
# being mirrored, so a catalog-side default move alone broke mirroring outright.
# `defaultChannel` only needs to be one of the kept channels, not the catalog's
# actual default.
oc_mirror_operator_packages: >-
  {{
    [
      'lvms-operator', 'redhat-oadp-operator', 'cluster-logging',
    ]
    +
    [
      { 'name': 'odf-operator', 'channel': operator_catalog.odf.channel },
    ]
    +
    (
      odf_sub_packages
      | map('community.general.dict_kv', 'name')
      | map('combine', { 'channel': operator_catalog.odf.channel })
      | list
    )
    +
    [
      { 'name': 'loki-operator', 'channel': operator_catalog.loki.channel },
      { 'name': 'grafana-operator', 'catalog': operator_catalog.grafana.catalog, 'channel': operator_catalog.grafana.channel },
      { 'name': 'opentelemetry-product', 'channel': operator_catalog.opentelemetry.channel },
      { 'name': 'tempo-product', 'channel': operator_catalog.tempo.channel },
      { 'name': 'metallb-operator', 'channel': operator_catalog.metallb.channel },
      { 'name': 'rabbitmq-cluster-operator', 'catalog': operator_catalog.rabbitmq.catalog, 'channel': operator_catalog.rabbitmq.channel },
      { 'name': 'crunchy-postgres-operator', 'catalog': operator_catalog.postgres.catalog, 'channel': operator_catalog.postgres.channel },
      { 'name': 'rhbk-operator', 'channel': operator_catalog.keycloak.channel },
      { 'name': 'quay-operator', 'channel': operator_catalog.quay.channel },
    ]
  }}
