---
# Runs on the internet-connected staging host (hosts: localhost in staging/'s own
# playbooks). Produces an oc-mirror archive ("mirror to disk"); no registry needs to
# run on this host.
oc_mirror_workspace: /opt/oc-mirror-workspace

bin_dir: "~/.local/bin"
ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}"

# Raw tool tarballs (oc-mirror, mirror-registry) are downloaded here, not extracted
# directly from the URL — kept on disk so package_bastion_bundle can carry them to
# the bastion inside the bundle, alongside the content archive. The bastion has no
# internet route at all, so deploy_mirror_registry can't fetch either tool itself the
# way this role does; it unarchives from the bundled copy instead. Same default path
# duplicated in package_bastion_bundle/unpack_bastion_bundle/deploy_mirror_registry's
# defaults (role defaults aren't shared across roles).
mirror_installers_dir: /opt/mirror-installers

# mirror.openshift.com/pub/cgw/mirror-registry/latest/mirror-registry.tar.gz (the
# previous URL here) 404s — Red Hat moved this distribution behind
# developers.redhat.com/content-gateway and the filename is now
# architecture-qualified (mirror-registry-amd64.tar.gz, not mirror-registry.tar.gz).
# The content-gateway's own "latest" alias 400s under a plain get_url (it needs a
# cookie carried across its redirect chain); a pinned version number redirects
# cleanly instead, so pin like oc_mirror_operator_packages' channels and re-verify
# against https://mirror.openshift.com/pub/cgw/mirror-registry/ periodically (newer
# patch versions appear there as subdirectories).
mirror_registry_version: "2.0.12"
mirror_registry_url: "https://developers.redhat.com/content-gateway/file/pub/cgw/mirror-registry/{{ mirror_registry_version }}/mirror-registry-amd64.tar.gz"

# RPM packages configure_bastion_services needs installed on the bastion, which has
# no internet route to reach RHUI/dnf repos itself — downloaded here (with their full
# dependency closure, not just these names) and synced over the same way as the tool
# tarballs above. configure_bastion_services doesn't hardcode this list itself — it
# just installs whatever RPMs ended up synced into bastion-rpms/, so this is the only
# place that actually controls what's included.
#
# ansible-core/python3-pip are here for a different reason than dnsmasq/httpd: the
# bastion has no Ansible on it at all until bootstrap-bastion-host.sh installs these
# two from the bundled RPMs (bare-metal bastions are assumed to already have this
# baked into their base image — see baremetal_prepare_bastion's README — but the AWS
# bastion starts as a blank, fully disconnected EC2 instance with nothing on it,
# confirmed as a real blocker: `ansible-playbook: command not found` on a fresh
# bastion). dnsmasq/httpd get installed later, idempotently, by
# configure_bastion_services once Ansible exists — installing them this early via
# bootstrap-bastion-host.sh too is harmless, just means that later step is a no-op.
#
# git-core is listed explicitly even though it's "just" an ansible-core dependency:
# `dnf install --downloadonly` only downloads packages not already satisfied on THIS
# host, and staging already has git-core installed (confirmed live) — so without
# listing it here, the RPM set silently omits it, and the offline install on the
# bastion (which has nothing) fails with "nothing provides git-core needed by
# ansible-core". Listing it directly forces it into the download set regardless of
# staging's own installed state.
bastion_packages:
  - dnsmasq
  - httpd
  - ansible-core
  - python3-pip
  - git-core

# The standard set this repo's feature roles install: LVM Storage (configure_lvms —
# true-SNO storage), OADP (configure_oadp_backup), cluster logging
# (configure_log_forwarding), and the ODF operator in standalone MCG mode
# (configure_mcg — not full ODF/Ceph, which is the scale-out alternative to LVMS and
# not applicable to true SNO). Override in staging/inventory/inventory.yaml's vars
# block to mirror a different set, or trim this down if you're not exercising every
# feature. [] mirrors the ENTIRE redhat-operator-index catalog instead — large and
# slow, so size the mirror-staging host's and bastion's disks accordingly.
#
# Entries can be a bare string (default catalog, default channel) or a dict with
# `name`, optional `channel` (pin a non-default channel), and optional `catalog`
# (redhat|certified|community|marketplace, default redhat — which index this
# package actually ships from). Keep each entry's channel/catalog in sync with the
# matching roles/ocp/configure_* role's own *_channel/*_catalog_source default
# vars; this list only controls what's mirrored, the role's Subscription template
# is what actually requests that channel/CatalogSource at install time.
#
# Catalog/channel values below for loki-operator, grafana-operator,
# rabbitmq-cluster-operator, and crunchy-postgres-operator are confirmed via
# `oc-mirror list operators --v1 --catalog <index>[:vX.Y] [--package <name>]`
# against the redhat/certified/community operator indexes for the openshift_version
# actually configured for this environment (4.22 as of this writing) — these are
# NOT catalog-version-independent. loki-operator's default channel in particular
# moves with every OCP minor (stable-6.4 on 4.18, stable-6.6 on 4.22) — re-verify
# with the same command against the new version's index whenever openshift_version
# changes, don't assume the pinned channel here still exists.
oc_mirror_operator_packages:
  - lvms-operator
  - redhat-oadp-operator
  - cluster-logging
  - odf-operator                                                              # configure_mcg
  - { name: loki-operator, channel: stable-6.6 }                              # configure_lokistack — pinned for openshift_version 4.22, re-verify on upgrade
  - { name: grafana-operator, catalog: community, channel: v5 }               # configure_grafana — not in redhat-operator-index
  - opentelemetry-product                                                     # configure_opentelemetry
  - tempo-product                                                             # configure_opentelemetry
  - metallb-operator                                                          # configure_metallb
  - { name: rabbitmq-cluster-operator, catalog: community, channel: stable }  # configure_rabbitmq — not in redhat-operator-index
  - { name: crunchy-postgres-operator, catalog: certified, channel: v5 }      # configure_postgres — not in redhat-operator-index
  - rhbk-operator                                                             # configure_keycloak
