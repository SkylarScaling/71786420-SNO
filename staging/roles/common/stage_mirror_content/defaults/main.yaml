---
# Runs on the internet-connected staging host (hosts: localhost in staging/'s own
# playbooks). Produces an oc-mirror archive ("mirror to disk"); no registry needs to
# run on this host.
oc_mirror_workspace: /opt/oc-mirror-workspace

# Where this role assembles the minimal oc-mirror cache subset deploy_mirror_registry
# needs on the bastion for its disk-to-mirror step to resolve release-component
# images — see the "Build the release-content cache handoff" task below for why this
# exists at all. Same default path duplicated in package_bastion_bundle's defaults
# (role defaults aren't shared across roles).
release_cache_handoff_dir: "{{ oc_mirror_workspace }}/release-cache-handoff"

bin_dir: "~/.local/bin"
ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}"

# Raw tool tarballs (oc-mirror, mirror-registry) are downloaded here, not extracted
# directly from the URL — kept on disk so package_bastion_bundle can carry them to
# the bastion inside the bundle, alongside the content archive. The bastion has no
# internet route at all, so deploy_mirror_registry can't fetch either tool itself the
# way this role does; it unarchives from the bundled copy instead. Same default path
# duplicated in package_bastion_bundle/unpack_bastion_bundle/deploy_mirror_registry's
# defaults (role defaults aren't shared across roles).
mirror_installers_dir: /opt/mirror-installers

# Ceiling for the async "mirror to disk" job (seconds) — generous for a full mirror
# of the release + operator catalogs, not an expected duration.
oc_mirror_job_timeout: 14400

# How often (seconds) to check the async job and report progress — see
# tasks/main.yaml's "Poll and report oc-mirror progress" task for why this can now
# safely be short: polling used to be self-recursive include_tasks, which hit
# Ansible's "maximum recursion depth exceeded" on a real multi-hour run at a 15s
# interval (confirmed live); it's now a bounded loop with constant stack depth
# regardless of how many times it fires, so this is free to tune for responsiveness
# vs. log noise without reintroducing that failure mode.
oc_mirror_poll_interval: 60

# mirror.openshift.com/pub/cgw/mirror-registry/latest/mirror-registry.tar.gz (the
# previous URL here) 404s — Red Hat moved this distribution behind
# developers.redhat.com/content-gateway and the filename is now
# architecture-qualified (mirror-registry-amd64.tar.gz, not mirror-registry.tar.gz).
# The content-gateway's own "latest" alias 400s under a plain get_url (it needs a
# cookie carried across its redirect chain); a pinned version number redirects
# cleanly instead, so pin like oc_mirror_operator_packages' channels and re-verify
# against https://mirror.openshift.com/pub/cgw/mirror-registry/ periodically (newer
# patch versions appear there as subdirectories).
mirror_registry_version: "2.0.12"
mirror_registry_url: "https://developers.redhat.com/content-gateway/file/pub/cgw/mirror-registry/{{ mirror_registry_version }}/mirror-registry-amd64.tar.gz"

# RPM packages configure_bastion_services needs installed on the bastion, which has
# no internet route to reach RHUI/dnf repos itself — downloaded here (with their full
# dependency closure, not just these names) and synced over the same way as the tool
# tarballs above. Same default list duplicated in configure_bastion_services's
# defaults (role defaults aren't shared across roles) purely for documentation; only
# this role's copy is actually used to drive the download. tmux is an operator
# convenience (long-running oc-mirror/mirror-registry sessions on the bastion), not a
# functional dependency of any role.
bastion_packages:
  - dnsmasq
  - httpd
  - tmux
  # Provides `dig`, used by deploy_mirror_registry's DNS pre-flight check — `getent`
  # (NSS-based) was found live to keep reporting success off a stale /etc/hosts
  # entry even after the customer deleted the actual DNS record; `dig` bypasses
  # /etc/hosts/NSS entirely and queries the configured nameserver directly.
  - bind-utils

# Repo IDs `dnf download` must be able to resolve bastion_packages (and their
# dependency closure) against — this staging host's subscription must already have
# these attached, just not necessarily enabled by default. Passed as --enablerepo on
# the download command itself (below) rather than toggled host-wide via
# subscription-manager, so this role doesn't leave the staging host's own repo
# configuration changed as a side effect. Keep in sync with whatever RHEL major
# version staging and the bastion are actually provisioned from (see this role's
# README: both must match).
bastion_required_repos:
  - rhel-10-for-x86_64-baseos-rpms
  - rhel-10-for-x86_64-appstream-rpms

# The standard set this repo's feature roles install: LVM Storage (configure_lvms —
# true-SNO storage), OADP (configure_oadp_backup), cluster logging
# (configure_log_forwarding), and the ODF operator in standalone MCG mode
# (configure_mcg — not full ODF/Ceph, which is the scale-out alternative to LVMS and
# not applicable to true SNO). Override in staging/inventory/inventory.yaml's vars
# block to mirror a different set, or trim this down if you're not exercising every
# feature. [] mirrors the ENTIRE redhat-operator-index catalog instead — large and
# slow, so size the mirror-staging host's and bastion's disks accordingly.
#
# Entries can be a bare string (default catalog, default channel) or a dict with
# `name`, optional `channel` (pin a non-default channel), and optional `catalog`
# (redhat|certified|community|marketplace, default redhat — which index this
# package actually ships from).
#
# EVERY pinned `channel` here MUST be updated together with the matching
# roles/ocp/configure_*'s own `*_channel`/`*_catalog_source` default — these are two
# independently-maintained values for the same actual requirement, read by two
# different tools at two different times:
#   - This list controls what oc-mirror actually fetches to disk, on staging,
#     potentially hours/days before install.
#   - The role's own `*_channel` default controls what its Subscription template
#     requests at install time, on the bastion/cluster.
# A mismatch doesn't fail at either single point in an obvious way:
#   - If the role's value names a channel that was never mirrored, the Subscription/
#     CatalogSource just never resolves — no clear error, it sits pending.
#   - If THIS file's pin goes stale first — i.e. the channel it names no longer
#     exists in the live catalog by the time staging actually runs — oc-mirror itself
#     fails outright (confirmed live: this happened to loki-operator's stable-6.6 pin,
#     which existed when first set and was gone from the catalog by a later run; see
#     the "Fail if the oc-mirror run itself failed" task in tasks/main.yaml for the
#     error-message improvement that followed).
# Bumping one without the other is the most likely way to hit either failure mode —
# treat every entry below with a pinned channel as a two-file edit, not one.
#
# Catalog/channel values below for loki-operator, grafana-operator,
# rabbitmq-cluster-operator, and crunchy-postgres-operator are confirmed via
# `oc-mirror list operators --v1 --catalog <index>[:vX.Y] [--package <name>]`
# against the redhat/certified/community operator indexes for the openshift_version
# actually configured for this environment (4.22 as of this writing) — these are
# NOT catalog-version-independent, and can drift even without an openshift_version
# bump (a catalog refresh can drop an older channel on its own, as above).
# loki-operator's channel in particular moves with every OCP minor (stable-6.4 on
# 4.18, stable-6.7 on 4.22 as of this writing, previously stable-6.6 on the same
# 4.22 until the catalog refresh above) — re-verify with the same command whenever
# openshift_version changes, AND periodically even without one; don't assume a
# pinned channel here still exists just because it did last time this was run.
#
# The template (imageset-config.yaml.j2) also sets `defaultChannel` to this same
# value alongside `channels`, not just `channels` alone — oc-mirror v2 otherwise
# validates the package's CATALOG default channel even though it isn't being
# mirrored, so a catalog-side default-channel move alone (with no change to the
# channel actually pinned/mirrored here) was enough to break mirroring outright.
# `defaultChannel` only needs to be *one of* the channels being kept, not the
# catalog's actual current default, which decouples this pin from that kind of
# drift entirely — it no longer needs to track the catalog's live default, only to
# keep being a real channel.
oc_mirror_operator_packages:
  - lvms-operator
  - redhat-oadp-operator
  - cluster-logging
  - odf-operator                                                              # configure_mcg
  - { name: loki-operator, channel: stable-6.7 }                              # configure_lokistack — pinned for openshift_version 4.22, re-verify on upgrade
  - { name: grafana-operator, catalog: community, channel: v5 }               # configure_grafana — not in redhat-operator-index
  - opentelemetry-product                                                     # configure_opentelemetry
  - tempo-product                                                             # configure_opentelemetry
  - metallb-operator                                                          # configure_metallb
  - { name: rabbitmq-cluster-operator, catalog: community, channel: stable }  # configure_rabbitmq — not in redhat-operator-index
  - { name: crunchy-postgres-operator, catalog: certified, channel: v5 }      # configure_postgres — not in redhat-operator-index
  - rhbk-operator                                                             # configure_keycloak
  - { name: quay-operator, channel: stable-3.13 }                             # configure_onprem_quay — was missing entirely (requested by that role's Subscription but never mirrored); add here, not as a bare entry, since its install-time channel is pinned (stable-3.13, not the catalog default)
