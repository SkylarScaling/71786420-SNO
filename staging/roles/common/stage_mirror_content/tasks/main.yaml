---
# oc-mirror's "mirror to disk" run can go quiet for long stretches with no stdout
# while pulling large blobs; left at sshd defaults, idle NAT/firewall state between
# here and the control node can get dropped mid-run, killing the task with "Shared
# connection to X closed" even though the host itself is healthy (confirmed via
# dmesg/journalctl showing no OOM kill and no sshd crash). ClientAliveInterval makes
# sshd actively probe the client so it notices and keeps the session alive instead of
# silently timing out. Paired with the client-side ServerAliveInterval/ControlPersist
# in playbooks/ansible.cfg.
- name: Harden sshd keepalives against long-running oc-mirror sessions dropping
  block:
    - name: Configure sshd ClientAliveInterval/ClientAliveCountMax
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\b"
        line: "{{ item.key }} {{ item.value }}"
      loop:
        - { key: ClientAliveInterval, value: 60 }
        - { key: ClientAliveCountMax, value: 30 }
      register: sshd_keepalive_config

    - name: Restart sshd to apply keepalive settings
      service:
        name: sshd
        state: restarted
      when: sshd_keepalive_config.changed
  become: true

- name: Ensure the oc-mirror workspace exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ oc_mirror_workspace }}"
    state: directory
    mode: '0700'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for the oc-mirror binary
  command: "{{ bin_dir }}/oc-mirror version"
  register: oc_mirror_check
  failed_when: false
  changed_when: false

# The bastion (where deploy_mirror_registry runs) has no internet route at all, so it
# can't fetch oc-mirror or mirror-registry itself — both are downloaded here instead
# (this host is internet-connected) as raw tarballs under mirror_installers_dir, which
# package_bastion_bundle/unpack_bastion_bundle carries over alongside the content archive. oc-mirror is also
# extracted locally here since this role needs to run it itself.
- name: Ensure the installers directory exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

# Unconditional (not gated on oc_mirror_check) — package_bastion_bundle/unpack_bastion_bundle needs this
# tarball present every run regardless of whether the binary is already extracted
# into bin_dir here. Gating this on oc_mirror_check used to mean a mirror-staging
# host that already had the binary extracted from an earlier run would never
# (re-)download the tarball at all, leaving nothing to sync — confirmed as the actual
# cause of a real "Source '.../oc-mirror.tar.gz' does not exist" failure on
# deploy_mirror_registry's side. get_url is idempotent (won't needlessly re-fetch an
# unchanged file), so this is cheap on repeat runs.
- name: Download the oc-mirror tarball
  get_url:
    url: "{{ ocp_mirror_url }}/oc-mirror.tar.gz"
    dest: "{{ mirror_installers_dir }}/oc-mirror.tar.gz"
    mode: '0644'

- name: Download the mirror-registry tarball
  get_url:
    url: "{{ mirror_registry_url }}"
    dest: "{{ mirror_installers_dir }}/mirror-registry.tar.gz"
    mode: '0644'

# baremetal_generate_agent_iso needs openshift-install, and the agent ISO's
# bootstrap/day-1 oc usage needs oc — both run on the bastion now, which has no
# internet route to fetch them itself. Downloaded here as raw tarballs (not
# unarchived directly, same reasoning as oc-mirror/mirror-registry above) so
# package_bastion_bundle can carry them into the bastion bundle; unpack_bastion_bundle
# extracts them into the bastion's own bin_dir.
- name: Download the openshift-install tarball
  get_url:
    url: "{{ ocp_mirror_url }}/openshift-install-linux.tar.gz"
    dest: "{{ mirror_installers_dir }}/openshift-install-linux.tar.gz"
    mode: '0644'

- name: Download the oc client tarball
  get_url:
    url: "{{ ocp_mirror_url }}/openshift-client-linux.tar.gz"
    dest: "{{ mirror_installers_dir }}/openshift-client-linux.tar.gz"
    mode: '0644'

# The bastion has no internet route at all, so configure_bastion_services can't
# `dnf install` dnsmasq/httpd directly there either. Mirrored here instead, same
# pattern as the oc-mirror/mirror-registry tarballs above into mirror_installers_dir,
# which package_bastion_bundle/unpack_bastion_bundle already carries over wholesale.
# Both hosts must run the same RHEL major.minor, so RPMs synced here install cleanly
# there with all other repos disabled.
#
# Two methods, picked by bastion_rpm_sync_method (default reposync) — see
# defaults/main.yaml. Tagged bastion_prereqs separately from the rest of this role
# so either can be re-run on its own (e.g. after adding a new entry to
# bastion_packages, or after switching bastion_rpm_sync_method) without redoing the
# hour-plus oc-mirror run below (`--tags bastion_prereqs`, then `--tags package` on
# package_bastion_bundle to re-bundle with the refreshed RPM content included).
- name: Ensure the bastion-rpms directory exists
  file:
    path: "{{ mirror_installers_dir }}/bastion-rpms"
    state: directory
    mode: '0755'
  tags: [bastion_prereqs]

# reposync (default): mirrors bastion_required_repos wholesale — every RPM in each
# repo, not just bastion_packages' own dependency closure. A deliberate customer
# choice (confirmed: they explicitly accepted the larger transfer size) after the
# `resolve` method below proved unreliable: `dnf download --resolve` resolves
# dependencies in the context of what's already installed on THIS staging host, so a
# dependency already satisfied here (even transitively) can be silently skipped from
# the download set, even with --resolve — producing an RPM closure that looks
# complete on staging but is missing something offline on the bastion, which starts
# with none of staging's pre-existing packages. reposync mirrors the repos' actual
# RPM sets independent of what's locally installed, so this class of gap can't
# happen — at the cost of pulling everything in both repos, most of which
# bastion_packages will never actually install.
#
# --download-metadata has reposync carry over each repo's own published repodata
# as-is, rather than needing createrepo_c to regenerate it afterward. --delete prunes
# RPMs dropped from the upstream repo on a re-run, so this doesn't just grow forever
# across repeated bastion_prereqs runs. One subdirectory per repoid under
# bastion-rpms/ (reposync's own layout), carried over wholesale by
# package_bastion_bundle/unpack_bastion_bundle the same as everything else under
# mirror_installers_dir — configure_bastion_services enables each as its own local
# repo on the bastion when bastion_rpm_sync_method is reposync (see that role's
# tasks).
- name: Mirror the full bastion-required repos for offline install on the bastion (reposync)
  vars:
    _bastion_repo_enable_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
    _bastion_repoid_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--repoid=\\1') | join(' ') }}"
  command: >
    dnf {{ _bastion_repo_enable_flags }} reposync
    {{ _bastion_repoid_flags }}
    --download-path={{ mirror_installers_dir }}/bastion-rpms
    --download-metadata
    --delete
    -y
  become: true
  when: bastion_rpm_sync_method == 'reposync'
  tags: [bastion_prereqs]

# resolve (opt-in): the original, narrower approach — downloads only
# bastion_packages' own dependency closure instead of each full repo. Smaller
# transfer, but see the reposync comment above for the gap this can hit: a
# dependency already satisfied on staging itself can be silently omitted even with
# --resolve. `dnf download --resolve` (not `dnf install --downloadonly`, which only
# downloads what it would actually *install* and so skips already-installed
# packages even more aggressively) fetches the named packages and their full
# dependency closure as best it can into a single flat directory, which createrepo_c
# then turns into one real (local-only) dnf repo — configure_bastion_services
# expects this exact single-directory layout when bastion_rpm_sync_method is
# resolve, as opposed to reposync's one-subdirectory-per-repoid layout.
- name: Ensure createrepo_c is installed on staging (resolve method only)
  dnf:
    name: createrepo_c
    state: present
    enablerepo: "{{ bastion_required_repos }}"
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Download bastion packages (with full dependency closure) for offline install on the bastion (resolve method only)
  vars:
    _bastion_repo_flags: "{{ bastion_required_repos | map('regex_replace', '^(.*)$', '--enablerepo=\\1') | join(' ') }}"
  command: >
    dnf download --resolve --destdir={{ mirror_installers_dir }}/bastion-rpms
    {{ _bastion_repo_flags }}
    -y {{ bastion_packages | join(' ') }}
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Generate repo metadata for the downloaded bastion RPMs (resolve method only)
  command: createrepo_c {{ mirror_installers_dir }}/bastion-rpms
  become: true
  when: bastion_rpm_sync_method == 'resolve'
  tags: [bastion_prereqs]

- name: Extract the oc-mirror binary from the downloaded tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/oc-mirror.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
  when: oc_mirror_check.rc != 0

# oc-mirror --v2's "disk to mirror" push (deploy_mirror_registry) needs this same
# ImageSetConfiguration again, unlike v1 where --from alone was enough since the
# archive was fully self-describing. Rendered directly into the archive dir (created
# here since oc-mirror itself only creates it on first invocation, below) so it rides
# along automatically when package_bastion_bundle/unpack_bastion_bundle rsyncs mirror_sync_source_dir —
# no separate sync path needed.
- name: Ensure the archive directory exists for the rendered config to land in
  file:
    path: "{{ oc_mirror_workspace }}/archive"
    state: directory
    mode: '0700'

- name: Render the oc-mirror ImageSetConfiguration
  template:
    src: imageset-config.yaml.j2
    dest: "{{ oc_mirror_workspace }}/archive/imageset-config.yaml"
    mode: '0600'

- name: Ensure ~/.docker exists
  file:
    path: "~/.docker"
    state: directory
    mode: '0700'

- name: Write pull_secret here so oc-mirror can authenticate to registry.redhat.io/quay.io
  copy:
    content: "{{ pull_secret }}"
    dest: "~/.docker/config.json"
    mode: '0600'
  no_log: true

# Launched async/poll:0 (fire-and-forget) purely so this play can poll its progress
# in between — the command module itself still blocks until oc-mirror exits either
# way, and oc-mirror's own stdout is bursty/silent for long stretches (see the
# sshd-keepalive comment above). v2 writes its logs under
# oc_mirror_workspace/archive/working-dir/logs/ instead of v1's single
# .oc-mirror.log — the poll loop below reports growth of the destination directory's
# total size instead of tailing a specific log file, since v2's exact log filenames
# aren't verified against a real run yet. oc_mirror_job_timeout is a generous ceiling
# for a full mirror of the release + operator catalogs, not an expected duration.
- name: Mirror release and operator content to disk (requires internet access + the real pull secret)
  command: >
    {{ bin_dir }}/oc-mirror --v2 --config {{ oc_mirror_workspace }}/archive/imageset-config.yaml
    --cache-dir {{ oc_mirror_workspace }}/cache
    file://{{ oc_mirror_workspace }}/archive
  args:
    chdir: "{{ oc_mirror_workspace }}"
  async: "{{ oc_mirror_job_timeout }}"
  poll: 0
  register: _stage_mirror_job

# oc-mirror gives no advance total size to measure progress against (unlike
# package_bastion_bundle/unpack_bastion_bundle's rsync, where the source archive size
# is known up front) — this reports archive bytes written so far instead of a
# percentage.
#
# Looped from here (bounded, fixed iteration count) rather than _poll_oc_mirror_progress.yml
# recursively include_tasks-ing itself, which is what this used to do — confirmed
# against a real run: with the original 15s poll interval, a multi-hour oc-mirror job
# recursed deeply enough to hit Ansible's "maximum recursion depth exceeded" (each
# recursive include_tasks call adds its own stack frame; a 4-hour job at 15s/poll is
# ~960 levels deep). Looping the include_tasks call itself from here instead keeps
# stack depth constant regardless of iteration count — each iteration is a fresh,
# non-nested invocation of the same file. oc_mirror_poll_interval can safely be set
# back to a short interval now; the previous 15-minute interval was only ever a
# workaround for the recursion limit, not a fix for it.
#
# | list on the range() call — confirmed live against a customer environment: Ansible
# core's loop handling there rejected a bare range object outright (loop needs a real
# list, not a lazy range), even though it works fine on other Ansible/Jinja
# combinations. Forcing it to a list here is harmless everywhere else and fixes the
# incompatible ones.
- name: Poll and report oc-mirror progress until it completes
  include_tasks: _poll_oc_mirror_progress.yml
  loop: "{{ range(0, (oc_mirror_job_timeout / oc_mirror_poll_interval) | round(0, 'ceil') | int + 1) | list }}"
  loop_control:
    loop_var: _poll_iteration
    label: "poll {{ _poll_iteration }}"
  when: _stage_mirror_status is not defined or not _stage_mirror_status.finished

# A bare rc/stderr dump here previously left the operator to go digging through
# {{ oc_mirror_workspace }}/archive/working-dir/logs/ by hand to find the actual
# reason — confirmed against a real run: a pinned operator channel that no longer
# existed in the catalog (oc_mirror_operator_packages) surfaced as a failure whose
# real cause (a "channel not found"-style line) was buried in oc-mirror's own
# per-component logs, not in stderr/rc. grep those logs for likely-relevant lines and
# fold them into the failure message directly, plus a pointer at the most common
# cause, so the first error seen is enough to act on without a manual log hunt.
- name: Collect likely-relevant error lines from oc-mirror's own logs
  shell: >
    grep -rihE "error|not found|invalid|failed|unauthorized" {{ oc_mirror_workspace }}/archive/working-dir/logs/*.log 2>/dev/null | tail -n 30
  register: _stage_mirror_error_lines
  changed_when: false
  failed_when: false
  when: _stage_mirror_status.rc | default(0) != 0

- name: Fail if the oc-mirror run itself failed
  fail:
    msg: |-
      oc-mirror failed (rc={{ _stage_mirror_status.rc }}).
      stderr: {{ _stage_mirror_status.stderr | default('(none)') }}
      Likely-relevant lines from {{ oc_mirror_workspace }}/archive/working-dir/logs/*.log:
      {{ _stage_mirror_error_lines.stdout | default('') | trim | default('(none matched — inspect that directory directly)', true) }}
      Full stdout/logs are under {{ oc_mirror_workspace }}/archive/working-dir/logs/ if the
      above isn't enough context. A common cause: an operator package/channel pinned in
      oc_mirror_operator_packages (staging/roles/common/stage_mirror_content/defaults/main.yaml)
      no longer exists in the current catalog — see that file's comments and this role's
      README ("Updating a mirrored operator's channel") for the two places a channel bump
      needs to land together.
  when: _stage_mirror_status.rc | default(0) != 0

# oc-mirror v2's exported mirror_NNNNNN.tar archive never includes the actual
# manifest/config/layer blob content for two synthetic openshift/ repos — only
# lightweight tag/revision "link" pointer files:
#   - openshift/release: the per-component tags (e.g.
#     openshift/release:4.22.17-x86_64-cluster-kube-apiserver-operator)
#   - openshift/release-images: the top-level release payload tag itself (e.g.
#     openshift/release-images:4.22.20-x86_64, what `ocp-release` actually resolves
#     to) — confirmed live as a SEPARATE gap from the one above: fixing
#     openshift/release alone got 188/192 release images mirroring successfully, but
#     the release payload image itself still failed with "manifest unknown" against
#     openshift/release-images, since the handoff only ever scanned openshift/release.
# Confirmed live (real bastion, same-host no-transfer reproduction, and direct
# `tar tvf` inspection of the archive): deploy_mirror_registry's disk-to-mirror step
# fails with "manifest unknown" on these, since a fresh --cache-dir on a separate
# bastion machine has no other way to reconstruct that content from the archive
# alone. Operator bundle content IS fully archived — this gap is specific to these
# two synthetic repos. The fix: for each, compute the minimal blob subset this
# cache's own repo metadata actually references (digests reachable from each tag's
# manifest: config + layers + any nested manifests for multi-arch), hardlink just
# those into a handoff directory laid out exactly like oc-mirror's own --cache-dir
# structure, and ship that alongside the bundle (package_bastion_bundle) for
# unpack_bastion_bundle to merge into the bastion's own --cache-dir before
# deploy_mirror_registry runs. Confirmed ~20GiB for this subset vs ~60GiB for the
# full cache in a real run — see this role's README for the full investigation. If a
# third "manifest unknown" surfaces against yet another openshift/* synthetic repo,
# add it to release_cache_repo_names below rather than assuming these two are the
# complete set — nothing here enumerates oc-mirror's own synthetic repos up front.
- name: Build the release-content cache handoff for the bastion's disk-to-mirror step
  vars:
    release_registry_v2_dir: "{{ oc_mirror_workspace }}/cache/.oc-mirror/.cache/docker/registry/v2"
    release_cache_repo_names:
      - release
      - release-images
  shell: |
    python3 - "{{ release_registry_v2_dir }}" "{{ release_cache_handoff_dir }}/.oc-mirror/.cache/docker/registry/v2" {{ release_cache_repo_names | join(' ') }} << 'PYEOF'
    import json, os, shutil, sys

    registry_v2_dir, handoff_v2_dir = sys.argv[1:3]
    repo_names = sys.argv[3:]

    digests = set()
    for repo_name in repo_names:
        repo_src = os.path.join(registry_v2_dir, "repositories/openshift", repo_name)
        revisions_dir = os.path.join(repo_src, "_manifests/revisions/sha256")
        if not os.path.isdir(revisions_dir):
            continue
        for rev in os.listdir(revisions_dir):
            digests.add(rev)
            blob_path = os.path.join(registry_v2_dir, "blobs/sha256", rev[:2], rev, "data")
            if not os.path.exists(blob_path):
                continue
            with open(blob_path) as f:
                try:
                    manifest = json.load(f)
                except ValueError:
                    continue
            if "config" in manifest:
                digests.add(manifest["config"]["digest"].split(":")[1])
            for layer in manifest.get("layers", []):
                digests.add(layer["digest"].split(":")[1])
            for sub in manifest.get("manifests", []):
                digests.add(sub["digest"].split(":")[1])

    linked = 0
    for digest in digests:
        src = os.path.join(registry_v2_dir, "blobs/sha256", digest[:2], digest, "data")
        if not os.path.exists(src):
            continue
        dst_dir = os.path.join(handoff_v2_dir, "blobs/sha256", digest[:2], digest)
        os.makedirs(dst_dir, exist_ok=True)
        dst = os.path.join(dst_dir, "data")
        if os.path.exists(dst):
            continue
        try:
            os.link(src, dst)
        except OSError:
            shutil.copy2(src, dst)
        linked += 1

    for repo_name in repo_names:
        repo_src = os.path.join(registry_v2_dir, "repositories/openshift", repo_name)
        if not os.path.isdir(repo_src):
            continue
        repo_dst = os.path.join(handoff_v2_dir, "repositories/openshift", repo_name)
        if os.path.exists(repo_dst):
            shutil.rmtree(repo_dst)
        shutil.copytree(repo_src, repo_dst)

    print(f"release-cache-handoff: {len(digests)} referenced digests, {linked} blobs linked, repos: {', '.join(repo_names)}")
    PYEOF
  args:
    executable: /bin/bash
  changed_when: true
