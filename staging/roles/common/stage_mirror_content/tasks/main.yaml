---
# Keeps long-idle oc-mirror sessions from getting dropped by idle NAT/firewall state
# ("Shared connection to X closed") — confirmed live. Paired with client-side
# ServerAliveInterval/ControlPersist in playbooks/ansible.cfg.
- name: Harden sshd keepalives against long-running oc-mirror sessions dropping
  block:
    - name: Configure sshd ClientAliveInterval/ClientAliveCountMax
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\b"
        line: "{{ item.key }} {{ item.value }}"
      loop:
        - { key: ClientAliveInterval, value: 60 }
        - { key: ClientAliveCountMax, value: 30 }
      register: sshd_keepalive_config

    - name: Restart sshd to apply keepalive settings
      service:
        name: sshd
        state: restarted
      when: sshd_keepalive_config.changed
  become: true

- name: Ensure the oc-mirror workspace exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ oc_mirror_workspace }}"
    state: directory
    mode: '0700'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

- name: Check for the oc-mirror binary
  command: "{{ bin_dir }}/oc-mirror version"
  register: oc_mirror_check
  failed_when: false
  changed_when: false

# The bastion has no internet route, so oc-mirror/mirror-registry are downloaded here
# as raw tarballs for package_bastion_bundle/unpack_bastion_bundle to carry over.
- name: Ensure the installers directory exists, owned by the connecting user (/opt requires root to create)
  file:
    path: "{{ mirror_installers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

# Unconditional, not gated on oc_mirror_check — gating it previously left nothing to
# sync on a host that already had the binary extracted, confirmed as a real
# deploy_mirror_registry failure ("Source '.../oc-mirror.tar.gz' does not exist").
# get_url is idempotent, so this is cheap on repeat runs.
- name: Download the oc-mirror tarball
  get_url:
    url: "{{ ocp_mirror_url }}/oc-mirror.tar.gz"
    dest: "{{ mirror_installers_dir }}/oc-mirror.tar.gz"
    mode: '0644'

- name: Download the mirror-registry tarball
  get_url:
    url: "{{ mirror_registry_url }}"
    dest: "{{ mirror_installers_dir }}/mirror-registry.tar.gz"
    mode: '0644'

# openshift-install/oc run on the bastion, which has no internet route — downloaded
# here as raw tarballs for package_bastion_bundle to carry over, same as above.
- name: Download the openshift-install tarball
  get_url:
    url: "{{ ocp_mirror_url }}/openshift-install-linux.tar.gz"
    dest: "{{ mirror_installers_dir }}/openshift-install-linux.tar.gz"
    mode: '0644'

- name: Download the oc client tarball
  get_url:
    url: "{{ ocp_mirror_url }}/openshift-client-linux.tar.gz"
    dest: "{{ mirror_installers_dir }}/openshift-client-linux.tar.gz"
    mode: '0644'

# Split into sync_bastion_rpms (2026-11-17) so its 8+ hour RPM sync can run/re-run
# independently of this role's own hour-plus oc-mirror step — still imported here so
# a combined stage-and-package.yaml run produces both in one pass. See that role's
# README.
- import_role:
    name: sync_bastion_rpms
  tags: [bastion_prereqs]

- name: Extract the oc-mirror binary from the downloaded tarball
  unarchive:
    src: "{{ mirror_installers_dir }}/oc-mirror.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: true
    mode: '0755'
  when: oc_mirror_check.rc != 0

# deploy_mirror_registry's "disk to mirror" push needs this same config again (v2,
# unlike v1, isn't fully self-describing from --from alone). Rendered into the
# archive dir so it rides along automatically with the rest of the synced content.
- name: Ensure the archive directory exists for the rendered config to land in
  file:
    path: "{{ oc_mirror_workspace }}/archive"
    state: directory
    mode: '0700'

- name: Render the oc-mirror ImageSetConfiguration
  template:
    src: imageset-config.yaml.j2
    dest: "{{ oc_mirror_workspace }}/archive/imageset-config.yaml"
    mode: '0600'

- name: Ensure ~/.docker exists
  file:
    path: "~/.docker"
    state: directory
    mode: '0700'

- name: Write pull_secret here so oc-mirror can authenticate to registry.redhat.io/quay.io
  copy:
    content: "{{ pull_secret }}"
    dest: "~/.docker/config.json"
    mode: '0600'
  no_log: true

# async/poll:0 so this play can report progress while oc-mirror's own stdout stays
# silent for long stretches — oc_mirror_job_timeout is a generous ceiling, not an
# expected duration. --retry-times/--retry-delay/--image-timeout: confirmed-live fix
# for transient pull failures mid-mirror, see defaults/main.yaml.
- name: Mirror release and operator content to disk (requires internet access + the real pull secret)
  command: >
    {{ bin_dir }}/oc-mirror --v2 --config {{ oc_mirror_workspace }}/archive/imageset-config.yaml
    --retry-times={{ oc_mirror_retry_times }} --retry-delay={{ oc_mirror_retry_delay }}
    --image-timeout={{ oc_mirror_image_timeout }}
    --cache-dir {{ oc_mirror_workspace }}/cache
    file://{{ oc_mirror_workspace }}/archive
  args:
    chdir: "{{ oc_mirror_workspace }}"
  async: "{{ oc_mirror_job_timeout }}"
  poll: 0
  register: _stage_mirror_job

# No advance total size to measure against, so progress is reported as bytes written
# so far, not a percentage. Looped (bounded, fixed count) rather than
# _poll_oc_mirror_progress.yml recursively include_tasks-ing itself — the old
# self-recursive version hit Ansible's max recursion depth on a real multi-hour job;
# looping from here keeps stack depth constant. | list on range() — confirmed live:
# some Ansible/Jinja combinations reject a bare range object in a loop.
- name: Poll and report oc-mirror progress until it completes
  include_tasks: _poll_oc_mirror_progress.yml
  loop: "{{ range(0, (oc_mirror_job_timeout / oc_mirror_poll_interval) | round(0, 'ceil') | int + 1) | list }}"
  loop_control:
    loop_var: _poll_iteration
    label: "poll {{ _poll_iteration }}"
  when: _stage_mirror_status is not defined or not _stage_mirror_status.finished

# A bare rc/stderr dump left the operator to dig through the logs by hand — confirmed
# live, a pinned operator channel no longer in the catalog surfaced this way. Grep for
# likely-relevant lines so the failure message is actionable on its own.
- name: Collect likely-relevant error lines from oc-mirror's own logs
  shell: >
    grep -rihE "error|not found|invalid|failed|unauthorized" {{ oc_mirror_workspace }}/archive/working-dir/logs/*.log 2>/dev/null | tail -n 30
  register: _stage_mirror_error_lines
  changed_when: false
  failed_when: false
  when: _stage_mirror_status.rc | default(0) != 0

# oc-mirror v2's exit code alone isn't reliable (Red Hat KB 7062641/OCPBUGS-49880) —
# check mirroring_errors_*.txt instead. Confirmed live: this previously failed the
# play outright on rc!=0 alone, before the archive-gap scan below ever ran, on a run
# that had actually succeeded. See this role's README.
- name: Check for oc-mirror's own generated error-summary file(s)
  find:
    paths: "{{ oc_mirror_workspace }}/archive/working-dir"
    patterns: "mirroring_errors_*.txt"
    recurse: true
  register: _stage_mirror_error_files
  when: _stage_mirror_status.rc | default(0) != 0

- name: Read oc-mirror's own error-summary file(s), if any were written
  slurp:
    src: "{{ item.path }}"
  loop: "{{ _stage_mirror_error_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _stage_mirror_error_file_contents
  when: _stage_mirror_status.rc | default(0) != 0 and _stage_mirror_error_files.matched | default(0) > 0

- name: Warn (don't fail) if oc-mirror exited nonzero but wrote no real error content
  debug:
    msg: |-
      oc-mirror exited nonzero (rc={{ _stage_mirror_status.rc }}) but wrote no
      mirroring_errors_*.txt content under {{ oc_mirror_workspace }}/archive/working-dir/ —
      per Red Hat KB 7062641/OCPBUGS-49880, oc-mirror v2's exit code alone isn't a
      reliable signal. Continuing; the archive-gap scan below is the real check for
      whether this mirror is actually usable.
  when:
    - _stage_mirror_status.rc | default(0) != 0
    - (_stage_mirror_error_file_contents.results | default([]) | map(attribute='content') | map('b64decode') | map('trim') | select('ne', '') | list | length) == 0

- name: Fail if oc-mirror's own error-summary file reports real failures
  fail:
    msg: |-
      oc-mirror reported real failures (mirroring_errors_*.txt under
      {{ oc_mirror_workspace }}/archive/working-dir/):
      {{ (_stage_mirror_error_file_contents.results | map(attribute='content') | map('b64decode') | join('\n---\n')) }}
      Likely-relevant lines from {{ oc_mirror_workspace }}/archive/working-dir/logs/*.log:
      {{ _stage_mirror_error_lines.stdout | default('') | trim | default('(none matched)', true) }}
      A common cause: an operator package/channel pinned in oc_mirror_operator_packages
      (staging/roles/common/stage_mirror_content/defaults/main.yaml) no longer exists
      in the current catalog — see that file's comments and this role's README
      ("Updating a mirrored operator's channel") for the two places a channel bump
      needs to land together.
  when:
    - _stage_mirror_status.rc | default(0) != 0
    - (_stage_mirror_error_file_contents.results | default([]) | map(attribute='content') | map('b64decode') | map('trim') | select('ne', '') | list | length) > 0

# oc-mirror v2's exported archive can leave blob content out for a repo while still
# writing its tag/revision pointer files — deploy_mirror_registry then fails with
# "manifest unknown". Confirmed live, broadly, across many operator repos — see this
# role's README ("Known oc-mirror --v2 defect" sections). scan_archive_gaps.py checks
# every repo in the cache; a found gap triggers one automatic self-heal retry below
# before surfacing the failure to the operator.
- name: Scan the mirrored archive for any repository with missing blobs
  vars:
    _registry_v2_dir: "{{ oc_mirror_workspace }}/cache/.oc-mirror/.cache/docker/registry/v2"
    _archive_dir: "{{ oc_mirror_workspace }}/archive"
  command: "python3 {{ role_path }}/files/scan_archive_gaps.py {{ _registry_v2_dir }} {{ _archive_dir }}"
  register: _archive_gap_scan_1
  changed_when: false

- name: Report archive gaps found on the first scan
  debug:
    msg: >-
      Archive gap scan found {{ (_archive_gap_scan_1.stdout | from_json).gap_repos | length }}
      repo(s) with missing blobs: {{ (_archive_gap_scan_1.stdout | from_json).gap_repos | join(', ') }}.
      Re-running oc-mirror once against the existing cache to self-heal (known
      oc-mirror --v2 defect — see this role's README).
  when: (_archive_gap_scan_1.stdout | from_json).gap_repos | length > 0

# Rare best-effort self-heal path, so a plain synchronous async/poll wait here (not
# the full progress-reporting dance above) is an acceptable trade-off. Same
# retry/timeout flags as the primary run.
- name: Re-run oc-mirror once in place to self-heal archive gaps
  command: >
    {{ bin_dir }}/oc-mirror --v2 --config {{ oc_mirror_workspace }}/archive/imageset-config.yaml
    --retry-times={{ oc_mirror_retry_times }} --retry-delay={{ oc_mirror_retry_delay }}
    --image-timeout={{ oc_mirror_image_timeout }}
    --cache-dir {{ oc_mirror_workspace }}/cache
    file://{{ oc_mirror_workspace }}/archive
  args:
    chdir: "{{ oc_mirror_workspace }}"
  async: "{{ oc_mirror_job_timeout }}"
  poll: "{{ oc_mirror_poll_interval }}"
  when: (_archive_gap_scan_1.stdout | from_json).gap_repos | length > 0
  changed_when: true

- name: Re-scan the archive after the self-heal retry
  vars:
    _registry_v2_dir: "{{ oc_mirror_workspace }}/cache/.oc-mirror/.cache/docker/registry/v2"
    _archive_dir: "{{ oc_mirror_workspace }}/archive"
  command: "python3 {{ role_path }}/files/scan_archive_gaps.py {{ _registry_v2_dir }} {{ _archive_dir }}"
  register: _archive_gap_scan_2
  changed_when: false
  when: (_archive_gap_scan_1.stdout | from_json).gap_repos | length > 0

- name: Determine the final set of repos needing the cache handoff
  set_fact:
    _cache_handoff_repo_names: >-
      {{
        (release_cache_repo_names | map('regex_replace', '^', 'openshift/') | list)
        | union((_archive_gap_scan_2.stdout | default(_archive_gap_scan_1.stdout) | from_json).gap_repos)
      }}

# Always includes release_cache_repo_names — that gap is 100% reproducible every run
# (see README), never left to chance. Hardlinked (same filesystem), falling back to a
# real copy otherwise. Carried to the bastion alongside mirror-content/installers,
# merged into deploy_mirror_registry's own cache before the disk-to-mirror push.
- name: Build the cache handoff for the bastion's disk-to-mirror step
  vars:
    _registry_v2_dir: "{{ oc_mirror_workspace }}/cache/.oc-mirror/.cache/docker/registry/v2"
    _handoff_v2_dir: "{{ release_cache_handoff_dir }}/.oc-mirror/.cache/docker/registry/v2"
  command: >-
    python3 {{ role_path }}/files/build_cache_handoff.py
    {{ _registry_v2_dir }} {{ _handoff_v2_dir }} {{ _cache_handoff_repo_names | join(' ') }}
  register: _cache_handoff_result
  changed_when: true

# If the self-heal retry didn't fully recover, these repos were never written to this
# host's cache at all — no re-bundling/re-running helps, only a fresh oc-mirror run.
# Failing here surfaces this in minutes instead of hours later on the bastion.
- name: Fail clearly if any repo's blobs are still unrecoverable after the self-heal retry and handoff
  vars:
    _handoff_result: "{{ _cache_handoff_result.stdout | from_json }}"
  fail:
    msg: |-
      The cache handoff still can't recover blobs for {{ _handoff_result.unrecoverable | length }}
      repo(s) even after a self-heal retry — these were never written to this host's
      own oc-mirror cache, so re-bundling or re-running stage_mirror_content again
      won't help on their own:
      {{ _handoff_result.unrecoverable | to_nice_json }}
      This usually means registry.redhat.io/quay.io didn't have (or temporarily
      couldn't serve) one of these images during the mirror run. Re-run
      stage_mirror_content once connectivity/availability is confirmed for the
      repos listed above.
  when: (_cache_handoff_result.stdout | from_json).unrecoverable | length > 0
