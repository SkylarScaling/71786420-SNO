---
# Included from aws_provision_sno_ipi's rescue block, after `create cluster` has
# already failed on degraded authentication/console/ingress operators (expected —
# tasks/main.yaml set dnsManagementPolicy: Unmanaged specifically so the
# ingress-operator never tries this itself). By the time that failure happens, the
# router's LoadBalancer Service already has its ELB (ELB creation goes through
# EC2/ELB APIs, which DO have VPC endpoints — only Route53 itself doesn't), so this
# only has to read its hostname and publish the DNS record from the controller, the
# same way openshift-install itself already does for api/api-int.
- name: Wait for the default router's LoadBalancer Service to get an ELB hostname
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: v1
    kind: Service
    name: router-default
    namespace: openshift-ingress
  register: router_service
  until: >
    router_service.resources | length > 0
    and router_service.resources[0].status.loadBalancer.ingress | default([]) | length > 0
  retries: 20
  delay: 15

- name: Extract the router ELB hostname
  set_fact:
    ingress_elb_hostname: "{{ router_service.resources[0].status.loadBalancer.ingress[0].hostname }}"

# openshift-install auto-discovers the account's PUBLIC hosted zone matching
# base_domain for api's own external record the same way (confirmed by inspecting the
# real zones/records this produced) — replicated here rather than requiring an
# explicit hostedZone var, since one already has to exist for publish: External to
# work at all.
#
# Uses amazon.aws.route53_info rather than shelling out to the `aws` CLI binary
# (as an earlier version of this task did) — nothing in this repo's bootstrapping
# installs the standalone AWS CLI, only the amazon.aws collection + boto3/botocore
# (see requirements.yml/requirements.txt); confirmed live: "[Errno 2] No such file
# or directory: b'aws'".
- name: Find the public hosted zone for base_domain
  amazon.aws.route53_info:
    query: hosted_zone
    dns_name: "{{ base_domain }}"
  register: public_zone_lookup
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Extract the public hosted zone ID
  set_fact:
    public_hosted_zone_id: >-
      {{ (public_zone_lookup.HostedZones
          | selectattr('Config.PrivateZone', 'equalto', false)
          | selectattr('Name', 'equalto', base_domain ~ '.')
          | map(attribute='Id')
          | first) | regex_replace('^/hostedzone/', '') }}

# The cluster's own private hosted zone (created by openshift-install for
# api-int/api, see roles/common/generate_install_config's publish: External comment)
# — distinct from the separate base_domain-level private zone aws_provision_bastion
# creates for mirror.{{ base_domain }}. Matched by exact name, not just "associated
# with our VPC", since that mirror zone is ALSO associated with the same VPC.
- name: Find the cluster's own private hosted zone
  amazon.aws.route53_info:
    query: hosted_zone
    dns_name: "{{ cluster_name }}.{{ base_domain }}"
  register: private_zone_lookup
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Extract the cluster's private hosted zone ID
  set_fact:
    private_hosted_zone_id: >-
      {{ (private_zone_lookup.HostedZones
          | selectattr('Config.PrivateZone', 'equalto', true)
          | selectattr('Name', 'equalto', cluster_name ~ '.' ~ base_domain ~ '.')
          | map(attribute='Id')
          | first) | regex_replace('^/hostedzone/', '') }}

# Written to both zones: the public one so the record resolves from outside AWS
# (the controller, and anyone else reaching the cluster externally under
# publish: External), the private one so in-cluster CoreDNS's upstream resolution via
# the VPC's own DNS resolver also finds it — exactly mirroring where api/api-int
# already got written (see this role's README).
- name: Create/update the apps wildcard CNAME in the public zone
  amazon.aws.route53:
    zone: "{{ base_domain }}"
    hosted_zone_id: "{{ public_hosted_zone_id }}"
    record: "*.apps.{{ cluster_name }}.{{ base_domain }}"
    type: CNAME
    value: "{{ ingress_elb_hostname }}"
    ttl: 30
    overwrite: true
    private_zone: false
    state: present
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Create/update the apps wildcard CNAME in the cluster's private zone
  amazon.aws.route53:
    zone: "{{ cluster_name }}.{{ base_domain }}"
    hosted_zone_id: "{{ private_hosted_zone_id }}"
    record: "*.apps.{{ cluster_name }}.{{ base_domain }}"
    type: CNAME
    value: "{{ ingress_elb_hostname }}"
    ttl: 30
    overwrite: true
    private_zone: true
    state: present
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"
