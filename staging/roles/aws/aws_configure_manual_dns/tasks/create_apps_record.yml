---
# Included from aws_provision_sno_ipi's rescue block, after `create cluster` has
# already failed on degraded authentication/console/ingress operators (expected —
# tasks/main.yaml set dnsManagementPolicy: Unmanaged specifically so the
# ingress-operator never tries this itself). By the time that failure happens, the
# router's LoadBalancer Service already has its ELB (ELB creation goes through
# EC2/ELB APIs, which DO have VPC endpoints — only Route53 itself doesn't), so this
# only has to read its hostname and publish the DNS record from the controller, the
# same way openshift-install itself already does for api/api-int.
#
# Patched here directly rather than relying solely on tasks/main.yaml's pre-create
# extra manifest — confirmed live that the manifest (correctly rendered and present
# in <install_dir>/manifests/ before `create cluster` ran) did NOT take effect: the
# live IngressController's spec had no endpointPublishingStrategy at all afterward
# (installer defaults: scope External, dnsManagementPolicy Managed), even though
# nothing in .openshift_install.log indicated it was rejected. The newer
# Cluster-API-based installer may process pre-seeded operator-owned CRs (CRDs that
# don't exist until their own operator installs, unlike core/CVO-owned types)
# differently than the manifest preseed pattern historically documented for the
# Terraform-based installer. Patching directly against the live API, after the
# cluster is already up, has no such ambiguity. The extra manifest in
# tasks/main.yaml is left in place as a harmless best-effort (no-op if superseded by
# this patch, useful if some other path reads it successfully).
- name: Patch the default IngressController to scope Internal and dnsManagementPolicy Unmanaged
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    definition:
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        endpointPublishingStrategy:
          type: LoadBalancerService
          loadBalancer:
            scope: Internal
            dnsManagementPolicy: Unmanaged

# Captured BEFORE deleting so the wait below can tell a genuinely NEW Service apart
# from the old one by identity (UID), not just by existence/ingress-populated —
# existence-based checks race in BOTH directions: kubernetes.core.k8s: state: absent
# returns once the delete call is accepted, not once the object is actually gone (the
# API server keeps serving the Terminating object, with its OLD ingress hostname
# still populated, for a while after) — confirmed live, an existence-based wait
# matched that still-dying old Service on its first poll. But the opposite race is
# just as real: the ingress-operator sometimes recreates the Service fast enough that
# a separate "wait until truly gone" poll never observes an empty-resources moment at
# all — also confirmed live, that wait exhausted its retries having only ever seen
# *a* Service object (actually the already-recreated new one, mistaken for the
# lingering old one). Comparing UIDs sidesteps both races entirely, regardless of
# which order the API server happens to reflect them in.
#
# Also used to decide whether the delete below is even necessary: this task
# (aws_configure_manual_dns's whole flow) can run more than once per cluster — e.g.
# if `wait-for install-complete` fails again afterward for an unrelated reason and
# gets retried. Unconditionally deleting an already-correct, already-Internal
# Service on every such retry would force needless ELB churn (and a few minutes of
# avoidable ingress downtime) for no benefit.
- name: Capture the current router Service before deciding whether to recreate it
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: v1
    kind: Service
    name: router-default
    namespace: openshift-ingress
  register: _old_router_service

- name: Set facts for the old Service's UID and whether it's already internal
  set_fact:
    _old_router_service_uid: "{{ _old_router_service.resources[0].metadata.uid | default('') }}"
    _router_service_already_internal: >-
      {{ (_old_router_service.resources | length > 0)
         and (_old_router_service.resources[0].metadata.annotations
              | default({}) | dict2items
              | selectattr('key', 'equalto', 'service.beta.kubernetes.io/aws-load-balancer-internal')
              | map(attribute='value') | first | default('false')) == 'true' }}

# The ingress-operator deliberately does NOT delete/recreate the Service on its own
# when scope changes — confirmed live, it leaves the old (still internet-facing)
# Service/ELB running and just reports LoadBalancerProgressing with an explicit
# message telling the operator to run `oc -n openshift-ingress delete svc/router-default`
# themselves ("Direct updates to the service annotations are not supported."). Without
# this, the "wait for ELB hostname" task below would just see the OLD external ELB's
# already-populated ingress field and succeed immediately, publishing a CNAME to the
# same unreachable internet-facing ELB all over again — exactly what happened the
# first time this patch was added, before this delete step existed.
- name: Delete the router Service so the ingress-operator recreates it with the new scope
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: absent
    api_version: v1
    kind: Service
    name: router-default
    namespace: openshift-ingress
  when: not _router_service_already_internal

# Recreation (new Service + new ELB) takes several minutes, hence the longer retry
# budget than a simple readiness wait would otherwise need. Only requires a
# different UID than before when a delete actually happened above — if the Service
# was already Internal, this just waits on its existing (unchanged) ingress field.
- name: Wait for the router Service to get an ELB hostname (new UID if recreated)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sno_kubeconfig }}"
    api_version: v1
    kind: Service
    name: router-default
    namespace: openshift-ingress
  register: router_service
  until: >
    router_service.resources | length > 0
    and (_router_service_already_internal
         or router_service.resources[0].metadata.uid != _old_router_service_uid)
    and router_service.resources[0].status.loadBalancer.ingress | default([]) | length > 0
  retries: 40
  delay: 15

- name: Extract the router ELB hostname
  set_fact:
    ingress_elb_hostname: "{{ router_service.resources[0].status.loadBalancer.ingress[0].hostname }}"

# openshift-install auto-discovers the account's PUBLIC hosted zone matching
# base_domain for api's own external record the same way (confirmed by inspecting the
# real zones/records this produced) — replicated here rather than requiring an
# explicit hostedZone var, since one already has to exist for publish: External to
# work at all.
#
# Uses amazon.aws.route53_info rather than shelling out to the `aws` CLI binary
# (as an earlier version of this task did) — nothing in this repo's bootstrapping
# installs the standalone AWS CLI, only the amazon.aws collection + boto3/botocore
# (see requirements.yml/requirements.txt); confirmed live: "[Errno 2] No such file
# or directory: b'aws'".
- name: Find the public hosted zone for base_domain
  amazon.aws.route53_info:
    query: hosted_zone
    dns_name: "{{ base_domain }}"
  register: public_zone_lookup
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Extract the public hosted zone ID
  set_fact:
    public_hosted_zone_id: >-
      {{ (public_zone_lookup.HostedZones
          | selectattr('Config.PrivateZone', 'equalto', false)
          | selectattr('Name', 'equalto', base_domain ~ '.')
          | map(attribute='Id')
          | first) | regex_replace('^/hostedzone/', '') }}

# The cluster's own private hosted zone (created by openshift-install for
# api-int/api, see roles/common/generate_install_config's publish: External comment)
# — distinct from the separate base_domain-level private zone aws_provision_bastion
# creates for mirror.{{ base_domain }}. Matched by exact name, not just "associated
# with our VPC", since that mirror zone is ALSO associated with the same VPC.
- name: Find the cluster's own private hosted zone
  amazon.aws.route53_info:
    query: hosted_zone
    dns_name: "{{ cluster_name }}.{{ base_domain }}"
  register: private_zone_lookup
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Extract the cluster's private hosted zone ID
  set_fact:
    private_hosted_zone_id: >-
      {{ (private_zone_lookup.HostedZones
          | selectattr('Config.PrivateZone', 'equalto', true)
          | selectattr('Name', 'equalto', cluster_name ~ '.' ~ base_domain ~ '.')
          | map(attribute='Id')
          | first) | regex_replace('^/hostedzone/', '') }}

# Written to both zones: the public one so the record resolves from outside AWS
# (the controller, and anyone else reaching the cluster externally under
# publish: External), the private one so in-cluster CoreDNS's upstream resolution via
# the VPC's own DNS resolver also finds it — exactly mirroring where api/api-int
# already got written (see this role's README).
#
# Deliberately NOT using module_defaults: group/aws here (unlike every other AWS
# task in this repo) — amazon.aws.route53's own `region` parameter means something
# completely different (the Route53 latency-based-routing region a record is
# associated with, mutually exclusive with weight/failover and requiring
# `identifier` when set) from the connection region every other module/group/aws
# default assumes. Confirmed live: group/aws's region default got interpreted as
# that latency-routing field, producing "missing parameter(s) required by
# 'region': identifier". Route53 is a global service with no per-request region
# anyway, so access_key/secret_key alone are both necessary and sufficient here.
- name: Create/update the apps wildcard CNAME in the public zone
  amazon.aws.route53:
    zone: "{{ base_domain }}"
    hosted_zone_id: "{{ public_hosted_zone_id }}"
    record: "*.apps.{{ cluster_name }}.{{ base_domain }}"
    type: CNAME
    value: "{{ ingress_elb_hostname }}"
    ttl: 30
    overwrite: true
    private_zone: false
    state: present
    access_key: "{{ aws_access_key_id }}"
    secret_key: "{{ aws_secret_access_key }}"

- name: Create/update the apps wildcard CNAME in the cluster's private zone
  amazon.aws.route53:
    zone: "{{ cluster_name }}.{{ base_domain }}"
    hosted_zone_id: "{{ private_hosted_zone_id }}"
    record: "*.apps.{{ cluster_name }}.{{ base_domain }}"
    type: CNAME
    value: "{{ ingress_elb_hostname }}"
    ttl: 30
    overwrite: true
    private_zone: true
    state: present
    access_key: "{{ aws_access_key_id }}"
    secret_key: "{{ aws_secret_access_key }}"
