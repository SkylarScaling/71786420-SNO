---
# Runs on the controller (localhost), between generate_install_config and
# `openshift-install create cluster` in aws_provision_sno_ipi — sets the default
# IngressController's DNS management to Unmanaged as an extra manifest, so the
# ingress-operator never even attempts to write the *.apps wildcard record itself.
#
# Confirmed against a real run: it can't succeed anyway — Route53 has no VPC endpoint
# at all (same category as IAM: a global control-plane API with no PrivateLink
# support, unlike EC2/S3/ELB/STS which aws_provision_network already has endpoints
# for), so the ingress-operator always times out trying to reach
# route53.amazonaws.com from the node's route-less private subnet, regardless of
# whether it has valid credentials (see aws_configure_manual_credentials — that fixes
# the OTHER CredentialsRequests, but can't fix this one, since the problem here is
# network reachability, not credentials). Left Managed, this manifested as
# `DNSReady=False (NoZones: The record isn't present in any zones.)` on the default
# ingresscontroller, which cascaded into console/authentication never becoming
# Available and `create cluster` timing out waiting for cluster operators.
#
# This mirrors how api/api-int already work: openshift-install creates those DNS
# records from the CONTROLLER (which has real internet access), not from inside the
# cluster. tasks/create_apps_record.yml does the equivalent for the apps wildcard,
# included from aws_provision_sno_ipi's rescue block once the ingress ELB exists.
- name: Ensure the install directory's extra-manifests dir exists
  file:
    path: "{{ install_dir }}/manifests"
    state: directory
    mode: '0755'

- name: Render the Unmanaged-DNS IngressController manifest
  template:
    src: ingresscontroller-unmanaged-dns.yaml.j2
    dest: "{{ install_dir }}/manifests/cluster-ingress-default-unmanaged-dns.yaml"
    mode: '0644'
