---
# Included from aws_provision_sno_ipi's rescue block, after `create cluster` has
# already failed and the cluster API is reachable (same rescue timing as
# aws_configure_manual_dns's create_apps_record.yml).
#
# tasks/main.yaml's copy of these Secret manifests into <install_dir>/manifests/ is
# NOT sufficient on its own — confirmed live: extra manifests are only consumed ONCE,
# very early during bootstrap, and the target namespace has to already exist at that
# exact moment for the apply to land. Core/early namespaces (openshift-ingress,
# openshift-machine-api, openshift-cloud-credential-operator) exist early enough and
# got their credential Secrets fine; openshift-image-registry and
# openshift-cluster-csi-drivers — whose operators initialize later — did not: `oc get
# secrets -n openshift-image-registry`/`-n openshift-cluster-csi-drivers` showed
# nothing, even though the correct Secret manifests were sitting on disk with the
# right namespace/name/role_arn the whole time. No error or warning was logged
# anywhere for the silently-dropped ones.
#
# Re-applying all of ccoctl's generated manifests directly against the live API here
# sidesteps the bootstrap-timing dependency entirely — by the time this rescue block
# runs, every operator's namespace already exists, so there's nothing left to race.
# Safe to repeat: these are the exact same Secret contents tasks/main.yaml already
# wrote to disk, just applied a second time via a path that doesn't depend on
# openshift-install's one-shot extra-manifests consumption.
- name: Find ccoctl's generated credential Secret manifests
  find:
    paths: "{{ install_dir }}/ccoctl-output/manifests"
    patterns: "*.yaml"
  register: _ccoctl_manifests

# Best-effort: some of ccoctl's generated Secrets target namespaces that are only
# transiently present during the Cluster-API-based bootstrap itself (e.g.
# openshift-cluster-api, used by the capa-manager-bootstrap CredentialsRequest) and
# are gone by the time this rescue block runs — confirmed live: "namespaces
# \"openshift-cluster-api\" not found". That credential isn't needed post-bootstrap
# anyway, so a missing namespace here is expected for some manifests, not a sign the
# re-apply itself is broken. Only treat a missing TARGET NAMESPACE as non-fatal —
# any other failure (bad YAML, RBAC, API server unreachable, etc.) still fails the
# play, since those would indicate a real problem worth stopping for.
- name: Re-apply each credential Secret directly against the live cluster API
  kubernetes.core.k8s:
    kubeconfig: "{{ sno_kubeconfig }}"
    state: present
    src: "{{ item.path }}"
  loop: "{{ _ccoctl_manifests.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: _reapply_result
  failed_when:
    - _reapply_result is failed
    - "'not found' not in (_reapply_result.msg | default(''))"
