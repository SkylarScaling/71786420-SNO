---
# Confirmed against a real run: with the default "Mint" credentialsMode,
# cloud-credential-operator tries to call iam.amazonaws.com directly from inside the
# cluster to create a scoped IAM user per CredentialsRequest — but the SNO node has no
# internet route (see CLAUDE.md's "always fully disconnected"), and IAM has no VPC
# endpoint at all (unlike EC2/S3/ELB/STS, which aws_provision_network already
# provisions interface/gateway endpoints for). Every CredentialsRequest failed
# identically with "dial tcp ...:443: i/o timeout" against iam.amazonaws.com.
#
# Manual mode + ccoctl-issued STS/OIDC roles avoids this: cloud-credential-operator
# never calls IAM at runtime at all under Manual mode — it just hands operators a
# pre-provisioned role ARN + web-identity token path, and the AWS SDK's
# AssumeRoleWithWebIdentity call goes to STS, which DOES have a VPC endpoint
# (aws_provision_network's vpc_interface_endpoint_services already includes it,
# apparently anticipating exactly this). This resolves every CredentialsRequest whose
# underlying API has a VPC endpoint (EBS CSI driver, machine-api, image-registry,
# cloud-network-config-controller — all EC2/S3/ELB). It does NOT resolve the
# ingress-operator's Route53 DNS management specifically, since Route53 itself has no
# VPC endpoint regardless of credentials mode — see aws_configure_manual_dns for that
# separate half of the fix.
- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir }}"
    state: directory
    mode: '0755'

# A plain registry-config file, not ~/.docker/config.json — oc adm/ccoctl's -a flag
# wants an explicit path, and this runs on the controller (localhost), separate from
# where stage_mirror_content already wrote pull_secret into ~/.docker/config.json on
# the mirror-staging host.
- name: Write the pull secret to a file for oc adm/ccoctl's registry auth
  copy:
    content: "{{ pull_secret }}"
    dest: "{{ tmp_dir }}/pull-secret.json"
    mode: '0600'
  no_log: true

- name: Check for the ccoctl binary
  command: "{{ bin_dir }}/ccoctl version"
  register: ccoctl_check
  failed_when: false
  changed_when: false

# ccoctl is versioned alongside each OCP release (it ships inside the
# cloud-credential-operator image) — same stale-binary risk install_ocp_prerequisites
# already guards against for openshift-install/oc, so the same existence-OR-version-
# mismatch condition is used here rather than a plain existence check.
- name: Resolve the cloud-credential-operator image reference for this release
  command: >
    {{ bin_dir }}/oc adm release info --image-for=cloud-credential-operator
    -a {{ tmp_dir }}/pull-secret.json {{ release_image }}
  register: cco_image
  changed_when: false
  when: ccoctl_check.rc != 0 or openshift_version not in ccoctl_check.stdout

# oc image extract's --path destination is passed straight through to the oc binary,
# which (unlike the command module's own argv[0] handling) does no "~" expansion of
# its own — confirmed against a real run: it treated "~/.local/bin" as a literal
# relative path off the playbook's cwd and failed with "destination path does not
# exist". Expand it ourselves rather than relying on bin_dir's raw value here.
- name: Extract ccoctl from the cloud-credential-operator image
  command: >
    {{ bin_dir }}/oc image extract {{ cco_image.stdout }}
    --path /usr/bin/ccoctl:{{ bin_dir | regex_replace('^~', ansible_env.HOME) }}
    -a {{ tmp_dir }}/pull-secret.json --confirm
  when: ccoctl_check.rc != 0 or openshift_version not in ccoctl_check.stdout

- name: Make ccoctl executable
  file:
    path: "{{ bin_dir }}/ccoctl"
    mode: '0755'
  when: ccoctl_check.rc != 0 or openshift_version not in ccoctl_check.stdout

- name: Remove any stale CredentialsRequests from a previous attempt
  file:
    path: "{{ install_dir }}/credrequests"
    state: absent

- name: Extract the CredentialsRequests this release actually needs for AWS
  command: >
    {{ bin_dir }}/oc adm release extract --credentials-requests --cloud=aws
    --to={{ install_dir }}/credrequests -a {{ tmp_dir }}/pull-secret.json {{ release_image }}

# Reentrant by design (ccoctl's own documented behavior): detects and reuses an
# already-existing OIDC bucket/IAM roles under the same --name rather than erroring or
# duplicating, which is exactly why ccoctl_name is deterministic per environment
# rather than randomly generated per run — a retried install after a prior failed
# attempt reuses the same identity provider instead of minting a new one and orphaning
# the old one.
- name: Create the OIDC identity provider and per-CredentialsRequest IAM roles
  command: >
    {{ bin_dir }}/ccoctl aws create-all --name={{ ccoctl_name }} --region={{ aws_region }}
    --credentials-requests-dir={{ install_dir }}/credrequests
    --output-dir={{ install_dir }}/ccoctl-output
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"

- name: Ensure the install directory's extra-manifests dir exists
  file:
    path: "{{ install_dir }}/manifests"
    state: directory
    mode: '0755'

# openshift-install picks up any manifests already present under <install_dir>/manifests
# before generating its own, same mechanism as any other "extra manifests" — no special
# flag needed, just needs to exist before `create cluster` runs.
- name: Copy ccoctl's generated credential Secret manifests into the install directory
  shell: "cp {{ install_dir }}/ccoctl-output/manifests/*.yaml {{ install_dir }}/manifests/"
  args:
    warn: false

# Required so in-cluster service-account token signing matches what the OIDC identity
# provider ccoctl just created actually trusts — without this, AssumeRoleWithWebIdentity
# calls fail even though the Secret manifests above look correct, since the tokens
# presented wouldn't validate against the provider's published JWKS. This exact path
# (<install_dir>/tls/bound-service-account-signing-key.key) is what openshift-install
# looks for; not just "a manifests dir convention" like the Secrets above.
- name: Ensure the install directory's tls dir exists
  file:
    path: "{{ install_dir }}/tls"
    state: directory
    mode: '0755'

- name: Copy ccoctl's generated bound-service-account signing key into the install directory
  copy:
    src: "{{ install_dir }}/ccoctl-output/tls/bound-service-account-signing-key.key"
    dest: "{{ install_dir }}/tls/bound-service-account-signing-key.key"
    remote_src: true
    mode: '0600'
