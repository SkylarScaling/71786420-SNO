---
# stage_mirror_content downloads the openshift-install tarball here for the BASTION's
# benefit (unpack_bastion_bundle extracts it there) but never extracts it on staging
# itself — this role is the first thing that actually needs openshift-install to exist
# on staging (aws_configure_manual_credentials's own fix extracts oc the same way,
# included further below). Idempotent, safe to run every time.
- name: Ensure bin_dir exists
  file:
    path: "{{ bin_dir | default('~/.local/bin') }}"
    state: directory
    mode: '0755'

- name: Check for the openshift-install binary
  command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install version"
  register: _openshift_install_check
  failed_when: false
  changed_when: false

- name: Extract openshift-install from the already-downloaded tarball
  unarchive:
    src: "{{ mirror_installers_dir | default('/opt/mirror-installers') }}/openshift-install-linux.tar.gz"
    dest: "{{ bin_dir | default('~/.local/bin') }}"
    remote_src: true
    mode: '0755'
  when: _openshift_install_check.rc != 0

# A retried/re-run `create cluster` after any prior failed attempt refuses to
# proceed ("local infrastructure provisioning artifacts already exist. There may
# already be a running cluster") as soon as metadata.json exists from that prior
# attempt, confirmed against a real run — even when install-config.yaml itself
# changed since. Since this role only ever targets a fresh/throwaway install_dir (see
# staging/inventory/inventory.yaml's tmp_dir), self-heal here rather than requiring a
# manual `openshift-install destroy cluster` + `rm -rf` between every retry: destroy
# whatever that prior attempt actually created in AWS (IAM roles, Route53 zone, EC2
# instances, ...) using its own metadata.json, then wipe the directory so the
# unpacked install-config.yaml has somewhere clean to land.
- name: Check for leftover install artifacts from a previous attempt
  stat:
    path: "{{ install_dir }}/metadata.json"
  register: _stale_install_metadata

- name: Destroy any infrastructure a previous failed/partial attempt already created
  command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install --dir={{ install_dir }} destroy cluster --log-level=info"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  when: _stale_install_metadata.stat.exists

# Deliberately does NOT wipe install_dir itself (unlike main's original version of
# this role) — install-config.yaml already arrived there via unpack_install_config_bundle
# before this role runs, and generate_install_config isn't re-included here (it ran on
# the bastion, colocated with deploy_mirror_registry's facts — see
# bastion/playbooks/provision-sno-aws.yaml). Only clear the leftover metadata/state a
# prior attempt left behind, not the config this run actually needs.
- name: Remove leftover state from a previous attempt, keeping install-config.yaml
  shell: >
    find {{ install_dir }} -mindepth 1 -maxdepth 1
    ! -name install-config.yaml -exec rm -rf {} +
  args:
    warn: false
  when: _stale_install_metadata.stat.exists

# Both of these render extra manifests into {{ install_dir }}/manifests before
# `create cluster` runs — see each role's README for why Mint-mode credentials and
# ingress-operator-managed DNS can never work from a node with no internet route and
# no VPC endpoint for IAM/Route53.
- name: Provision Manual-mode cloud credentials via ccoctl (STS/OIDC)
  include_role:
    name: aws_configure_manual_credentials

- name: Set the default ingress controller's DNS management to Unmanaged
  include_role:
    name: aws_configure_manual_dns

# Expected to fail here on a real run: with ingress DNS management Unmanaged, the
# default ingresscontroller/console/authentication operators won't converge until the
# apps wildcard record exists, which nothing creates until the rescue block below runs
# — openshift-install's own error output for this exact situation suggests the
# recovery path taken here ("The 'wait-for install-complete' subcommand can then be
# used to continue the installation").
- block:
    - name: Install SNO cluster via IPI (single control-plane node, zero workers)
      command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install --dir={{ install_dir }} create cluster --log-level=info"
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: sno_install
  rescue:
    - name: Create the apps wildcard DNS record now that the ingress ELB exists
      include_role:
        name: aws_configure_manual_dns
        tasks_from: create_apps_record.yml

    - name: Resume waiting for cluster initialization now that DNS resolves
      command: "{{ bin_dir | default('~/.local/bin') }}/openshift-install --dir={{ install_dir }} wait-for install-complete --log-level=info"
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      register: sno_install

- name: Record install result
  debug:
    msg: "{{ sno_install.stdout_lines | default([]) }}"
