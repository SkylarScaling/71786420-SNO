---
# One-time (or once-per-test-environment) setup: prompts for AWS credentials and
# base_domain, imports/reuses an EC2 key pair derived from the local SSH public key,
# then writes:
#   - ~/tmp/<base_domain>-creds: a per-environment JSON credentials file, read by the
#     generated inventories via lookup('file', ...) — the same pattern used for
#     pull_secret/ssh_key elsewhere in this repo. This (not ~/.aws/credentials or
#     AWS_PROFILE) is what lets multiple AWS test environments run in parallel, each
#     with its own credentials file keyed by domain, with no shared global AWS
#     credential state.
#   - aws-infra/inventory/inventory.yaml: this tree's own inventory, used by
#     provision-hosts.yaml/destroy-hosts.yaml.
#
# staging/inventory/inventory.yaml is deliberately NOT rendered here — it needs
# VPC/subnet facts (sno_vpc_id, sno_private_subnet_id, ...) that don't exist until
# provision-hosts.yaml actually creates the VPC. provision-hosts.yaml renders it
# (from the same staging/inventory/inventory-aws.yaml.j2 template) once those facts
# are available, and copies it — along with this playbook's credentials file, since
# the lookup('file', ...) in that template is evaluated wherever staging/ actually
# runs, not here — to the mirror-staging host's $HOME as its last step.
- name: Configure per-environment AWS credentials and inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: aws_base_domain
      prompt: "Base domain for this test environment (e.g. sandbox123.opentlc.com)"
      private: false

    - name: aws_access_key_id
      prompt: "AWS Access Key ID"
      private: true

    - name: aws_secret_access_key
      prompt: "AWS Secret Access Key"
      private: true

    - name: aws_credentials_region
      prompt: "AWS region for this environment"
      default: us-east-2
      private: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"
    aws_key_pair: "{{ aws_base_domain }}-keypair"
    ssh_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Ensure ~/tmp exists
      file:
        path: "{{ home_dir }}/tmp"
        state: directory
        mode: '0700'

    - name: Write the per-environment AWS credentials file
      copy:
        content: |
          {
            "aws_access_key_id": "{{ aws_access_key_id }}",
            "aws_secret_access_key": "{{ aws_secret_access_key }}",
            "aws_region": "{{ aws_credentials_region }}"
          }
        dest: "{{ home_dir }}/tmp/{{ aws_base_domain }}-creds"
        mode: '0600'
      no_log: true

    - name: Import ssh_key as this environment's EC2 key pair (named after base_domain, no collisions across environments)
      amazon.aws.ec2_key:
        name: "{{ aws_key_pair }}"
        key_material: "{{ ssh_key }}"
        state: present
      module_defaults:
        group/aws:
          access_key: "{{ aws_access_key_id }}"
          secret_key: "{{ aws_secret_access_key }}"
          region: "{{ aws_credentials_region }}"

    - name: Render aws-infra/'s own inventory
      template:
        src: "{{ playbook_dir }}/../inventory/inventory.yaml.j2"
        dest: "{{ playbook_dir }}/../inventory/inventory.yaml"
        mode: '0644'

    - name: Summary
      debug:
        msg:
          - "Wrote ~/tmp/{{ aws_base_domain }}-creds (region {{ aws_credentials_region }}),"
          - "imported EC2 key pair {{ aws_key_pair }} from this host's SSH public key,"
          - "and rendered aws-infra/inventory/inventory.yaml."
          - "Next: ansible-playbook provision-hosts.yaml -i ../inventory/inventory.yaml"
          - "That playbook renders staging/inventory/inventory.yaml itself (once the"
          - "VPC/subnets it needs exist) and copies it, plus this credentials file,"
          - "to the mirror-staging host automatically."
