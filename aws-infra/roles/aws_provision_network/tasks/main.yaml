---
- block:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ cluster_name }}-vpc"
        cidr_block: "{{ vpc_cidr }}"
        tags:
          cluster: "{{ cluster_name }}"
      register: vpc

    - name: Create public subnet (mirror-staging host + external API/ingress load balancers)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        az: "{{ availability_zone }}"
        map_public: true
        tags:
          Name: "{{ cluster_name }}-public"
          # Listed in install-config.yaml's platform.aws.vpc.subnets alongside the
          # private subnet (see generate_install_config's publish: External comment
          # for why) — openshift-install classifies it as "public" from its IGW route
          # and places the external API/ingress load balancers here; it tags the
          # subnet itself (kubernetes.io/cluster/<infraID>, kubernetes.io/role/elb)
          # for ELB auto-discovery, so don't tag it kubernetes.io/cluster/unmanaged
          # here — that's only for subnets deliberately left OUT of the provided list.
      register: public_subnet

    - name: Create private subnet (bastion + SNO machine network — no internet route)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_cidr }}"
        az: "{{ availability_zone }}"
        map_public: false
        tags:
          Name: "{{ cluster_name }}-private"
      register: private_subnet

    - name: Create internet gateway (public subnet only)
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        tags:
          Name: "{{ cluster_name }}-igw"
      register: igw

    - name: Create public route table (0.0.0.0/0 via the internet gateway)
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ cluster_name }}-public-rt"

    - name: Create private route table (deliberately no default route — no internet access)
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        subnets:
          - "{{ private_subnet.subnet.id }}"
        routes: []
        tags:
          Name: "{{ cluster_name }}-private-rt"
      register: private_route_table

    - name: Create S3 gateway endpoint on the private route table (bootstrap ignition fetch)
      amazon.aws.ec2_vpc_endpoint:
        vpc_id: "{{ vpc.vpc.id }}"
        service: "com.amazonaws.{{ aws_region }}.s3"
        route_table_ids:
          - "{{ private_route_table.route_table.id }}"
        tags:
          Name: "{{ cluster_name }}-s3-endpoint"

    # Interface VPC endpoint private DNS applies VPC-wide, not per-subnet — AWS has no
    # concept of scoping it to just the private subnet. So once these endpoints exist,
    # EVERY host in the VPC (including staging, in the public subnet with its own real
    # internet route) gets e.g. ec2.<region>.amazonaws.com silently resolved to the
    # endpoint's private IP instead of the real public one — confirmed live:
    # openshift-install running on staging timed out for 1h35m calling EC2's
    # DescribeSubnets API, because the security group only allowed the private subnet
    # and staging's own (legitimate, internet-routable) traffic to that private IP was
    # silently dropped instead of using the internet path it still has. Scoped to the
    # whole VPC CIDR (covers both subnets) rather than narrowing to just staging's
    # public_subnet_cidr too, since any future subnet added to this VPC should also be
    # able to reach these endpoints without another security-group change.
    - name: Create security group for interface VPC endpoints (HTTPS from anywhere in the VPC)
      amazon.aws.ec2_security_group:
        name: "{{ cluster_name }}-vpc-endpoints"
        description: "Allow HTTPS to interface VPC endpoints from anywhere in the VPC"
        vpc_id: "{{ vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports: [443]
            cidr_ip: "{{ vpc_cidr }}"
        tags:
          Name: "{{ cluster_name }}-vpc-endpoints"
      register: vpc_endpoint_sg

    - name: Create interface endpoints the installer/nodes need without a NAT gateway
      amazon.aws.ec2_vpc_endpoint:
        vpc_id: "{{ vpc.vpc.id }}"
        service: "com.amazonaws.{{ aws_region }}.{{ item }}"
        vpc_endpoint_type: Interface
        vpc_endpoint_subnets:
          - "{{ private_subnet.subnet.id }}"
        vpc_endpoint_security_groups:
          - "{{ vpc_endpoint_sg.group_id }}"
        tags:
          Name: "{{ cluster_name }}-{{ item }}-endpoint"
      loop: "{{ vpc_interface_endpoint_services }}"

    - name: Expose subnet/VPC facts to the rest of the provisioning run
      set_fact:
        sno_vpc_id: "{{ vpc.vpc.id }}"
        sno_public_subnet_id: "{{ public_subnet.subnet.id }}"
        sno_private_subnet_id: "{{ private_subnet.subnet.id }}"
        sno_public_subnet_cidr: "{{ public_subnet_cidr }}"
        sno_vpc_cidr: "{{ vpc_cidr }}"
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"
