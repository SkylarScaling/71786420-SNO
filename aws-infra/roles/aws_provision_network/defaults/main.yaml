---
vpc_cidr: "10.0.0.0/16"
public_subnet_cidr: "10.0.1.0/24"    # mirror-staging host only — this is the sole
                                      # internet-facing component in the whole stack
private_subnet_cidr: "{{ machine_network_cidr }}"   # bastion + SNO node — no internet route
availability_zone: "{{ aws_region }}a"

# Interface endpoints the installer/nodes need without a NAT gateway. s3 is a gateway
# endpoint (attached to the private route table), the rest are interface endpoints.
vpc_interface_endpoint_services:
  - ec2
  - elasticloadbalancing
  - sts
