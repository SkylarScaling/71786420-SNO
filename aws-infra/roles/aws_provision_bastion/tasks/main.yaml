---
# Provisions the EC2 stand-in for the target single bastion, in the private
# (route-less) subnet aws_provision_network already created. This role only creates
# the instance and the DNS it needs — it does NOT add it to any in-memory inventory
# or configure anything to run against it in this same play (unlike main's old
# version of this role). Once it exists, the operator reaches it over SSH (proxied
# through the mirror-staging host's public IP, since this host has no public IP of
# its own) and extracts the staging-produced bundle there — see
# `bastion/README.md`'s "AWS" section.

- block:
    - name: Find the latest RHEL 9 AMI for aws_region (skipped if bastion_ami_id is set)
      amazon.aws.ec2_ami_info:
        owners:
          - "{{ rhel_ami_owner }}"
        filters:
          name: "{{ rhel_ami_name_filter }}"
          state: available
      register: rhel_amis
      when: not bastion_ami_id

    - name: Use the most recently published matching AMI
      set_fact:
        bastion_ami_id: "{{ (rhel_amis.images | sort(attribute='creation_date', reverse=true) | first).image_id }}"
      when: not bastion_ami_id

    - name: Create security group for the bastion (SSH from mirror-staging; mirror registry from the whole VPC)
      amazon.aws.ec2_security_group:
        name: "{{ cluster_name }}-bastion"
        description: "Allow SSH from the mirror-staging host and mirror-registry access from the VPC - never the internet"
        vpc_id: "{{ sno_vpc_id }}"
        rules:
          - proto: tcp
            ports: [22]
            group_id: "{{ mirror_staging_security_group_id }}"
          # The SNO master and the IPI bootstrap instance both need to reach the
          # bastion's mirror registry to pull release/operator images — confirmed
          # against a real run: bootstrapping timed out after 45 minutes with no
          # route to this port at all. Scoped to the whole VPC CIDR, not just the
          # private subnet, because openshift-install places the bootstrap instance
          # in the public subnet (it's classified "public" by its IGW route, used for
          # the external API/ingress load balancers) even though the master stays in
          # the private subnet.
          - proto: tcp
            ports: ["{{ mirror_registry_quay_port }}"]
            cidr_ip: "{{ sno_vpc_cidr }}"
        tags:
          Name: "{{ cluster_name }}-bastion-sg"
      register: bastion_sg
      when: not bastion_security_groups

    - name: Use the auto-created security group (unless bastion_security_groups was set explicitly)
      set_fact:
        bastion_security_groups: ["{{ bastion_sg.group_id }}"]
      when: not bastion_security_groups

    - name: Provision bastion EC2 instance in the private subnet (no internet route — single-bastion emulation)
      amazon.aws.ec2_instance:
        name: "{{ cluster_name }}-bastion"
        instance_type: "{{ bastion_instance_type }}"
        image_id: "{{ bastion_ami_id }}"
        key_name: "{{ aws_key_pair }}"
        vpc_subnet_id: "{{ sno_private_subnet_id }}"
        security_groups: "{{ bastion_security_groups }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ bastion_root_volume_size_gb }}"
              volume_type: gp3
              delete_on_termination: true
        network:
          assign_public_ip: false
        tags:
          role: bastion
          cluster: "{{ cluster_name }}"
        wait: true
        state: present
      register: bastion_instance
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"

- name: Record bastion private IP (for the connection-info debug message)
  set_fact:
    bastion_private_ip: "{{ bastion_instance.instances[0].private_ip_address }}"

# mirror_registry_quay_hostname (mirror.{{ base_domain }}) has no DNS record anywhere
# otherwise — openshift-install manages api/api-int/apps itself via Route53 against
# base_domain's existing (public) hosted zone, scoped to {{ cluster_name }}.{{
# base_domain }}, but it never touches base_domain's apex or anything outside that
# cluster subdomain. Without this, neither the bastion itself (mirror-registry
# install --quayHostname) nor the SNO node (imageContentSources pulls) can resolve
# the mirror hostname. A private hosted zone resolves via the VPC's internal Route53
# resolver — no internet route needed, consistent with this environment having none.
# Creating our own private zone for the base_domain apex doesn't conflict with the
# installer's separate {{ cluster_name }}.{{ base_domain }} zone: Route53 resolves
# against the most specific matching zone per query, so the two coexist.
- block:
    - name: Create a private Route53 hosted zone for base_domain, associated with the VPC
      amazon.aws.route53_zone:
        zone: "{{ base_domain }}"
        vpc_id: "{{ sno_vpc_id }}"
        vpc_region: "{{ aws_region }}"
        comment: "Private zone for {{ cluster_name }} - resolves mirror.{{ base_domain }} inside the VPC (no internet route)"
        state: present

    # amazon.aws.route53 overloads its own "region" option to mean a latency-based
    # routing-policy region (requiring "identifier" alongside it) — a different
    # concept from the AWS SDK connection region. The repo-wide module_defaults
    # below (correct for route53_zone and every other amazon.aws.* module here)
    # would otherwise feed aws_region into that option and trip its validation.
    # Explicitly omit it for this task only; the module doesn't need a connection
    # region for a global service.
    - name: Point mirror.{{ base_domain }} at the bastion's private IP
      amazon.aws.route53:
        zone: "{{ base_domain }}"
        record: "mirror.{{ base_domain }}"
        type: A
        ttl: 300
        value: "{{ bastion_private_ip }}"
        private_zone: true
        overwrite: true
        state: present
        region: "{{ omit }}"
  module_defaults:
    group/aws:
      access_key: "{{ aws_access_key_id }}"
      secret_key: "{{ aws_secret_access_key }}"
      region: "{{ aws_region }}"
