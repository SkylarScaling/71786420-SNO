---
mirror_staging_ami_id: ""          # "" = auto-detect the latest matching AMI below; set explicitly to pin/override
mirror_staging_instance_type: t3.large
mirror_staging_security_groups: []
# The RHEL AMI's default root volume (~10GB) is nowhere near enough for an oc-mirror
# "mirror to disk" run — especially with imageset-config.yaml.j2's packages left
# empty (full operator catalog). Bump it explicitly; increase further if you're
# mirroring the full catalog rather than a curated package list.
#
# 100GB filled up for real during this repo's own testing under oc-mirror --v1, which
# wrote each "mirror to disk" invocation as a new incremental sequence tarball under
# oc_mirror_workspace/archive and never pruned older ones, so repeated re-runs (e.g.
# iterating on oc_mirror_operator_packages while chasing catalog/channel errors) piled
# up tens of GB per run with nothing in stage_mirror_content to clean it up. Now on
# oc-mirror --v2, which caches by content digest under oc_mirror_workspace/cache
# instead — re-runs should dedupe rather than pile up, but that isn't independently
# confirmed against a real repeated run yet, so 250GB headroom is left as-is. If the
# disk fills again, the workspace is disposable staging (registry.redhat.io/quay.io is
# the source of truth) — safe to clear oc_mirror_workspace/archive and
# oc_mirror_workspace/cache and re-run from scratch.
mirror_staging_root_volume_size_gb: 250
mirror_staging_ssh_user: ec2-user

# Auto-detected RHEL 9 AMI lookup (see tasks/main.yaml) — 309956199498 is Red Hat's
# official AWS account ID for published RHEL AMIs.
rhel_ami_owner: "309956199498"
rhel_ami_name_filter: "RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3"
