---
# Identity
# base_domain is deliberately NOT defaulted here. Ansible precedence puts this file
# (playbook group_vars/all) ABOVE inline inventory-file vars, so a default here would
# silently win over any override in inventory/baremetal/inventory.yaml's vars block.
# base_domain must be set there instead.
cluster_name: sno-test
openshift_version: "4.22.17"

# This branch is bare-metal only (the AWS provisioning layer has been removed
# entirely — see CLAUDE.md). Hardcoded rather than left to inventory: Ansible's
# precedence puts this file ABOVE inline inventory-file vars (same reason
# base_domain isn't defaulted here either — see below), so a stray "aws" default
# here would silently win over inventory/baremetal/inventory.yaml's own value.
infra_provider: baremetal

# Credentials / keys
ssh_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
ssh_private_key: "~/.ssh/id_ed25519"
# Kept as the raw JSON text (not parsed with | from_json) — generate_install_config's
# install-config.yaml.j2 embeds this directly as `pullSecret: '{{ pull_secret }}'`,
# which needs the literal JSON string, not a dict.
pull_secret: "{{ lookup('file', '~/pull-secret.json') }}"

# Working directories
tmp_dir: "/tmp/{{ cluster_name }}"
install_dir: "{{ tmp_dir }}/install"
sno_kubeconfig: "{{ install_dir }}/auth/kubeconfig"

# Single-switch / single-subnet network emulation
machine_network_cidr: "10.0.0.0/24"
cluster_network_cidr: "10.128.0.0/14"
service_network_cidr: "172.30.0.0/16"

# --- Bare-metal-specific ---
# rendezvous_ip, sno_mac_address, dns_server, default_gateway, bmc_address,
# bmc_username, bmc_password: set per-deployment in inventory/baremetal/.
# bastion_host is used by roles that delegate_to the bastion against the static
# baremetal inventory.
bastion_host: bastion1

# --- Disconnected mirroring (always on — see docs/architectural-decisions.md #2) ---
# This is the registry install-config.yaml always points at; there is no
# connected-install path.
mirror_registry_quay_hostname: "mirror.{{ base_domain }}"
mirror_registry_quay_port: 8443

# --- Backup / DR target ---
# configure_oadp_backup always targets the in-cluster NooBaa provided by
# configure_mcg — the only backend it supports (see
# roles/ocp/configure_oadp_backup/README.md). No external S3 account/region needed.
backup_s3_bucket: "{{ cluster_name }}-oadp-backup"

# --- Log forwarding target ---
log_forward_endpoint: "https://siem.example.com:9200"
