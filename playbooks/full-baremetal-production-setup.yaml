---
# Full bare-metal production rollout: storage (LVMS + MCG), MetalLB (non-HTTP TCP
# middleware), logging (LokiStack + Grafana), tracing (OpenTelemetry + Tempo), email
# alerting, backup/DR (OADP + external S3 export), and the Day 2 application platform
# (RabbitMQ/Postgres/Redis/Keycloak). Assumes content has already been mirrored
# (playbooks/mirror-content.yaml) — this is always a disconnected deployment.
- name: Install local prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [prereqs]
  tasks:
    - include_role:
        name: install_ocp_prerequisites

- import_playbook: ./provision-sno-baremetal.yaml
- import_playbook: ./configure-storage.yaml
- import_playbook: ./configure-metallb.yaml
- import_playbook: ./configure-logging.yaml
- import_playbook: ./configure-tracing.yaml
- import_playbook: ./configure-alerting.yaml
- import_playbook: ./configure-backup-dr.yaml
- import_playbook: ./configure-middleware.yaml
