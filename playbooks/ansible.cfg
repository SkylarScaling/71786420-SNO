[defaults]
roles_path = ../roles:../roles/common:../roles/aws:../roles/baremetal:../roles/ocp
callbacks_enabled = ansible.posix.profile_tasks
host_key_checking = False

[ssh_connection]
# oc-mirror (stage_mirror_content, deploy_mirror_registry) can go quiet for long
# stretches mid-transfer with no stdout; without keepalives, idle NAT/firewall
# state between the control node and the mirror-staging host / bastion gets
# dropped and the task dies with "Shared connection to X closed". ServerAliveInterval
# pings the far end every 30s so the client notices a dead connection fast (or the
# ping itself keeps NAT state alive); ControlPersist keeps the multiplexed
# connection warm between tasks. See also the server-side ClientAliveInterval
# hardening in stage_mirror_content and deploy_mirror_registry.
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ControlMaster=auto -o ControlPersist=600s
