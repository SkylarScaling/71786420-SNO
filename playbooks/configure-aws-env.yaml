---
# One-time (or once-per-test-environment) setup: prompts for AWS credentials and
# base_domain, imports/reuses an EC2 key pair derived from `ssh_key`
# (group_vars/all.yaml), then writes:
#   - ~/tmp/<base_domain>-creds: a per-environment JSON credentials file, read by the
#     generated inventory via lookup('file', ...) — the same pattern used for
#     pull_secret/ssh_key. This (not ~/.aws/credentials or AWS_PROFILE) is what lets
#     multiple AWS test environments run in parallel, each with its own credentials
#     file keyed by domain, with no shared global AWS credential state.
#   - inventory/aws/<base_domain>.yaml: a per-environment inventory, rendered from
#     inventory/aws/inventory.yaml.j2, so two environments never share one inventory
#     file either. Run this playbook once per environment (different base_domain each
#     time) and pass that environment's -i inventory/aws/<base_domain>.yaml to every
#     other playbook.
- name: Configure per-environment AWS credentials and inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: aws_base_domain
      prompt: "Base domain for this test environment (e.g. sandbox123.opentlc.com)"
      private: false

    - name: aws_access_key_id
      prompt: "AWS Access Key ID"
      private: true

    - name: aws_secret_access_key
      prompt: "AWS Secret Access Key"
      private: true

    - name: aws_credentials_region
      prompt: "AWS region for this environment"
      default: us-east-2
      private: false

  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"
    aws_key_pair: "{{ aws_base_domain }}-keypair"

  tasks:
    - name: Ensure ~/tmp exists
      file:
        path: "{{ home_dir }}/tmp"
        state: directory
        mode: '0700'

    - name: Write the per-environment AWS credentials file
      copy:
        content: |
          {
            "aws_access_key_id": "{{ aws_access_key_id }}",
            "aws_secret_access_key": "{{ aws_secret_access_key }}",
            "aws_region": "{{ aws_credentials_region }}"
          }
        dest: "{{ home_dir }}/tmp/{{ aws_base_domain }}-creds"
        mode: '0600'
      no_log: true

    - name: Import ssh_key as this environment's EC2 key pair (named after base_domain, no collisions across environments)
      amazon.aws.ec2_key:
        name: "{{ aws_key_pair }}"
        key_material: "{{ ssh_key }}"
        state: present
      module_defaults:
        group/aws:
          access_key: "{{ aws_access_key_id }}"
          secret_key: "{{ aws_secret_access_key }}"
          region: "{{ aws_credentials_region }}"

    - name: Render a dedicated inventory file for this environment
      template:
        src: "{{ playbook_dir }}/../inventory/aws/inventory.yaml.j2"
        dest: "{{ playbook_dir }}/../inventory/aws/{{ aws_base_domain }}.yaml"
        mode: '0644'

    - name: Summary
      debug:
        msg: >-
          Wrote ~/tmp/{{ aws_base_domain }}-creds (region {{ aws_credentials_region }}),
          imported EC2 key pair {{ aws_key_pair }} from ssh_key, and wrote
          inventory/aws/{{ aws_base_domain }}.yaml. Use
          -i inventory/aws/{{ aws_base_domain }}.yaml for every other playbook against
          this environment — run this playbook again with a different base_domain to
          set up another environment to run in parallel, no file collisions.
