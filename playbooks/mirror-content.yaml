---
# Standalone re-run of the mirroring pipeline (e.g. to refresh content on an existing
# bastion) plus the on-cluster application registry. The initial mirror done during
# provisioning (provision-sno-aws.yaml / provision-sno-baremetal.yaml) already runs
# stage/sync/deploy_mirror_registry — use this playbook to refresh content later
# without re-provisioning infrastructure.
# See docs/architectural-decisions.md #2.
- name: Stage content on an internet-connected host
  hosts: mirror_staging_host
  tags: [mirror_content, stage]
  tasks:
    - include_role:
        name: stage_mirror_content

- name: Sync staged content to the disconnected bastion
  hosts: mirror_staging_host
  tags: [mirror_content, sync]
  tasks:
    - include_role:
        name: sync_mirror_to_bastion

- name: Refresh the bastion's mirror registry
  hosts: bastion
  tags: [mirror_content, registry]
  tasks:
    - include_role:
        name: deploy_mirror_registry

- name: Deploy the on-cluster, highly available Quay registry for application workloads
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [mirror_content, onprem_quay]
  tasks:
    - include_role:
        name: configure_onprem_quay
